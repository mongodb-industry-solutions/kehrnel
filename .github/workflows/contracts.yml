name: Data Lab Core contracts

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  foundation-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install foundation dependencies
        run: python -m pip install -e '.[api,cli,test]'
      - name: Validate contracts and strategy packages
        env:
          PYTHON_BIN: python
          KEHRNEL_SKIP_DOTENV: "true"
        run: scripts/test-data-lab-foundation
      - name: Validate release-blocking strategies
        env:
          PYTHON_BIN: python
          KEHRNEL_SKIP_DOTENV: "true"
        run: scripts/test-supported-strategies
