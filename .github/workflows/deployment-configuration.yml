name: Deployment configuration contracts
on:
  pull_request:
    paths:
      - 'src/kehrnel/**'
      - 'tests/**'
      - 'docs/examples/deployment-projection*.json'
      - '.github/workflows/deployment-configuration.yml'
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # These openEHR/API contracts do not require the separately vendored FHIR packages.
      - run: python -m pip install -e '.[api,test,translate]'
      - run: python -m pytest -q tests/contract/test_deployment_configuration.py tests/contract/test_deployment_boundaries.py tests/unit/test_search_index_definition_builder.py tests/unit/test_rps_dual_ibm_strategy.py tests/contract/rps_dual tests/unit/test_rps_dual_versioning.py tests/unit/test_rps_dual_uuidbin_values.py tests/unit/test_rps_dual_strategy_ingest_batch.py tests/unit/test_rps_dual_nested_contains_compile.py tests/unit/test_rps_dual_raw_aql_strategy_compile.py
        env:
          KEHRNEL_SKIP_DOTENV: 'true'
