name: Deployment configuration contracts
on:
  pull_request:
    paths:
      - 'src/kehrnel/**'
      - 'tests/**'
      - 'docs/examples/deployment-projection*.json'
      - '.github/workflows/deployment-configuration.yml'
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[all]'
      - run: python -m pytest -q tests/contract/test_deployment_configuration.py tests/contract/test_deployment_boundaries.py tests/unit/test_search_index_definition_builder.py tests/unit/test_rps_dual_ibm_strategy.py
        env:
          KEHRNEL_SKIP_DOTENV: 'true'
