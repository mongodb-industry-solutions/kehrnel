services:
  kehrnel-demo-shell:
    build:
      context: ../..
      dockerfile: demo/wetty/shell/Dockerfile
    container_name: kehrnel-demo-shell
    environment:
      DEMO_USER: ${DEMO_USER:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
      KEHRNEL_PORT: ${KEHRNEL_PORT:-8080}
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-openEHR_demo}
      BINDINGS_REF: ${BINDINGS_REF:-}
      REQUIRE_RUNTIME: 0
    ports:
      - "${KEHRNEL_PORT:-8080}:8080"

  wetty:
    image: wettyoss/wetty:2.7.0
    container_name: kehrnel-demo-wetty
    depends_on:
      - kehrnel-demo-shell
    command:
      - --host
      - 0.0.0.0
      - --port
      - "3000"
      - --base
      - /wetty
      - --title
      - Kehrnel CLI Demo
      - --ssh-host
      - kehrnel-demo-shell
      - --ssh-port
      - "22"
      - --ssh-user
      - ${DEMO_USER:-demo}
      - --ssh-auth
      - password
      - --ssh-pass
      - ${DEMO_PASSWORD:-demo}
      - --allow-iframe
    ports:
      - "${WETTY_PORT:-3000}:3000"

  portal:
    image: nginx:1.27-alpine
    container_name: kehrnel-demo-portal
    depends_on:
      - wetty
    ports:
      - "${PORTAL_PORT:-3001}:80"
    volumes:
      - ./portal/index.html:/usr/share/nginx/html/index.html:ro
      - ./portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
