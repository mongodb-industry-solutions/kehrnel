resource: ChargeItemDefinition
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec ChargeItemDefinition)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: none — not listed in compartments/definitions/*.json
#
# Total parameters: 17 (12 resource-specific shipped + 2 common:
# `_id`, `_lastUpdated`). Composite `context-type-quantity`,
# `context-type-value`, and quantity `context-quantity` are deferred
# (use `context`, `context-type`, and non-quantity params directly).
#
# R5 structural notes:
#   * `useContext[]` powers `context` and `context-type` token searches.
#   * `effective` searches `applicability[].effectivePeriod`.
#   * Top-level scalar `status` and token `version` query FHIR root.

search_parameters:
  context:
    type: token
    description: "A use context assigned to the charge item definition"
    fields:
      - field: "_search.context_codes"
        tokenType: code

  context-type:
    type: token
    description: "A type of use context assigned to the charge item definition"
    fields:
      - field: "_search.contextType_codes"
        tokenType: code

  date:
    type: date
    description: "The charge item definition publication date"
    fields:
      - field: "date"
        type: date

  description:
    type: string
    description: "Natural language description of the charge item definition"
    fields:
      default:
        - field: "_search.description_lower"
          query_type: range
      exact:
        - field: "_search.description"

  effective:
    type: date
    description: "The time during which the charge item definition is intended to be in use"
    fields:
      - field: "_search.effectivePeriod"
        type: period

  identifier:
    type: token
    description: "External identifiers for the charge item definition"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  jurisdiction:
    type: token
    description: "Intended jurisdiction for the charge item definition"
    fields:
      - field: "_search.jurisdiction_systemCode"
        tokenType: systemCode
      - field: "_search.jurisdiction_codes"
        tokenType: code

  publisher:
    type: string
    description: "Name of the publisher of the charge item definition"
    fields:
      default:
        - field: "_search.publisher_lower"
          query_type: range
      exact:
        - field: "_search.publisher"

  status:
    type: token
    description: "The current status of the charge item definition"
    fields:
      - field: "status"
        tokenType: code

  title:
    type: string
    description: "Name for this charge item definition (human friendly)"
    fields:
      default:
        - field: "_search.title_lower"
          query_type: range
      exact:
        - field: "_search.title"

  url:
    type: uri
    description: "The uri that identifies the charge item definition"
    fields:
      - field: "url"

  version:
    type: token
    description: "The business version of the charge item definition"
    fields:
      - field: "version"
        tokenType: code

  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  jurisdiction:
    source: jurisdiction
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: jurisdiction[*].coding[*].code
        target_field: jurisdiction_codes
        datatype: array[string]
      - source_path: jurisdiction[*].coding[*]
        target_field: jurisdiction_systemCode
        datatype: array[string]

  use_context_value:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: useContext[*].valueCodeableConcept.coding[*].code
        target_field: context_codes
        datatype: array[string]

  use_context_type:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: useContext[*].code.code
        target_field: contextType_codes
        datatype: array[string]

  applicability_effective:
    source: $resource
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: applicability[*].effectivePeriod.start
        target_field: effectivePeriod.start
        datatype: array[date]
      - source_path: applicability[*].effectivePeriod.end
        target_field: effectivePeriod.end
        datatype: array[date]

  description:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: description
        target_field: description
        datatype: string
      - source_path: description
        target_field: description_lower
        datatype: string
        normalize: lowercase

  publisher:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: publisher
        target_field: publisher
        datatype: string
      - source_path: publisher
        target_field: publisher_lower
        datatype: string
        normalize: lowercase

  title:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: title
        target_field: title
        datatype: string
      - source_path: title
        target_field: title_lower
        datatype: string
        normalize: lowercase

indexes:
  - fields:
      - "status": 1
    options:
      name: idx_status

  - fields:
      - "url": 1
    options:
      name: idx_url
      sparse: true

  - fields:
      - "version": 1
    options:
      name: idx_version
      sparse: true

  - fields:
      - "_search.jurisdiction_codes": 1
    options:
      name: idx_jurisdiction_codes
      sparse: true

  - fields:
      - "_search.identifier_systemCode": 1
    options:
      name: idx_identifier_system_code
      sparse: true

  - fields:
      - "_search.effectivePeriod.start": 1
    options:
      name: idx_effective_period_start
      sparse: true

  - fields:
      - "date": 1
    options:
      name: idx_date
      sparse: true

  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
