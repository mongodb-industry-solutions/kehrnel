resource: Contract
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec Contract)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, relatedperson.json (signer — dynamic resolver only)
#
# Total parameters: 12 (10 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `Contract.subject[]` is Reference[]; `patient` is the Patient/*
#     shortcut.
#   * `Contract.signer[]` is backbone; `signer` searches `signer.party`.
#   * `authority[]` and `domain[]` are Reference arrays.
#   * `instantiates` searches `instantiatesUri` only (no canonical param).
#   * Top-level scalar `status` queries the FHIR root.
#   * `issued` is dateTime at resource root.

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  authority:
    type: reference
    description: "Authority with whom this contract is associated"
    fields:
      - field: "_search.authorityIds"
        referenceType: id
      - field: "_search.authorityTypes"
        referenceType: type
      - field: "authority.reference"
        referenceType: full

  domain:
    type: reference
    description: "Domain in which this contract applies"
    fields:
      - field: "_search.domainIds"
        referenceType: id
      - field: "_search.domainTypes"
        referenceType: type
      - field: "domain.reference"
        referenceType: full

  patient:
    type: reference
    description: "The patient bound to the contract (Patient subject)"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectIds"
        referenceType: id

  signer:
    type: reference
    description: "Contract Signatory party"
    fields:
      - field: "_search.signerIds"
        referenceType: id
      - field: "_search.signerTypes"
        referenceType: type

  subject:
    type: reference
    description: "The identity of the subject of the contract"
    fields:
      - field: "_search.subjectIds"
        referenceType: id
      - field: "_search.subjectTypes"
        referenceType: type

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  identifier:
    type: token
    description: "Contract number"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  status:
    type: token
    description: "amended | appended | cancelled | disputed | entered-in-error | executable | executed | negotiable | offered | policy | rejected | renewed | revoked | resolved | terminated"
    fields:
      - field: "status"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  issued:
    type: date
    description: "When this contract was issued"
    fields:
      - field: "issued"
        type: date

  # ─────────────────────────────────────────────────────────────
  # URI Parameters
  # ─────────────────────────────────────────────────────────────
  instantiates:
    type: uri
    description: "Source for Contract template"
    fields:
      - field: "_search.instantiatesUri_values"
      - field: "instantiatesUri"

  url:
    type: uri
    description: "Computer friendly representation"
    fields:
      - field: "url"

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject[*].reference
        target_field: subjectIds
        datatype: array[string]
        extractType: id
      - source_path: subject[*].reference
        target_field: subjectTypes
        datatype: array[string]
        extractType: type
      - source_path: subject[*].reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  signer:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: signer[*].party.reference
        target_field: signerIds
        datatype: array[string]
        extractType: id
      - source_path: signer[*].party.reference
        target_field: signerTypes
        datatype: array[string]
        extractType: type

  authority:
    source: authority
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: authority[*].reference
        target_field: authorityIds
        datatype: array[string]
        extractType: id
      - source_path: authority[*].reference
        target_field: authorityTypes
        datatype: array[string]
        extractType: type

  domain:
    source: domain
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: domain[*].reference
        target_field: domainIds
        datatype: array[string]
        extractType: id
      - source_path: domain[*].reference
        target_field: domainTypes
        datatype: array[string]
        extractType: type

  instantiates_uri:
    source: instantiatesUri
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: instantiatesUri
        target_field: instantiatesUri_values
        datatype: array[string]

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: "Patient compartment (patient.json linking param subject)"

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_status
  - fields:
      - "_search.patientId": 1
    options:
      name: idx_patient_id
      sparse: true
  - fields:
      - "_search.subjectIds": 1
    options:
      name: idx_subject_ids
      sparse: true
  - fields:
      - "_search.signerIds": 1
    options:
      name: idx_signer_ids
      sparse: true
  - fields:
      - "_search.authorityIds": 1
    options:
      name: idx_authority_ids
      sparse: true
  - fields:
      - "issued": 1
    options:
      name: idx_issued
      sparse: true
  - fields:
      - "url": 1
    options:
      name: idx_url
      sparse: true
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
