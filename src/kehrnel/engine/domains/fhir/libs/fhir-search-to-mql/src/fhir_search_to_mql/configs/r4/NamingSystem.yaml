resource: NamingSystem
fhir_version: R4

search_parameters:
  status:
    type: token
    description: "NamingSystem status"
    fields:
      - field: "status"
        tokenType: code
  type:
    type: token
    description: "Type of NamingSystem"
    fields:
      - field: "_search.typeCode"
        tokenType: code
      - field: "_search.typeSystemCode"
        tokenType: systemCode
  date:
    type: date
    description: "Date for NamingSystem"
    fields:
      - field: "_search.date"
        type: date
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code
  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  type:
    source: type
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: type.coding[*].code
        target_field: typeCode
        datatype: array[string]
      - source_path: type
        target_field: typeSystemCode
        datatype: array[string]
  date:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: date
        target_field: date
        datatype: date

indexes:
  - fields:
      - "status": 1
    options:
      name: idx_r4_nmngsy_status
  - fields:
      - "_search.date": -1
    options:
      name: idx_r4_nmngsy_date
  - fields:
      - "_search.typeCode": 1
    options:
      name: idx_r4_nmngsy_type
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_r4_nmngsy_updated
