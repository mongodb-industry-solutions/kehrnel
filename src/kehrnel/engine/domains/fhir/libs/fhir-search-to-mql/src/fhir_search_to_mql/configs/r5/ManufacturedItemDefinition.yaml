resource: ManufacturedItemDefinition
fhir_version: R5

search_parameters:
  status:
    type: token
    description: "ManufacturedItemDefinition status"
    fields:
      - field: status
        tokenType: code
  identifier:
    type: token
    description: "Identifier for ManufacturedItemDefinition"
    fields:
      - field: _search.identifier_systemCode
        tokenType: systemCode
      - field: _search.identifier_values
        tokenType: code
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: id
        tokenType: code
  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: meta.lastUpdated
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

indexes:
  - fields:
      - "status": 1
    options:
      name: idx_r5_manufa_status
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_r5_manufa_updated
