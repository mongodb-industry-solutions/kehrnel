  - fields:
      - "_search.expirationDate": 1
    options:
      name: idx_expiration_date
      sparse: true
  - fields:
      - "_search.manufactureDate": 1
    options:
      name: idx_manufacture_date
      sparse: true

  - fields:
      - "_search.locationId": 1
    options:
      name: idx_location_id
      sparse: true
  - fields:
      - "_search.ownerId": 1
    options:
      name: idx_owner_id
      sparse: true
  - fields:
      - "_search.parentId": 1
    options:
      name: idx_parent_id
      sparse: true
  - fields:
