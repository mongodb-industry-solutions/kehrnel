resource: ServiceRequest
fhir_version: R4

search_parameters:
  status:
    type: token
    description: "draft | active | on-hold | revoked | completed | entered-in-error | unknown"
    fields:
      - field: "status"
        tokenType: code

  intent:
    type: token
    description: "proposal | plan | directive | order | original-order | reflex-order | filler-order | instance-order | option"
    fields:
      - field: "intent"
        tokenType: code

  code:
    type: token
    description: "What is being requested/ordered"
    fields:
      - field: "_search.codeCode"
        tokenType: code
      - field: "_search.codeSystemCode"
        tokenType: systemCode

  patient:
    type: reference
    description: "Search by subject - a patient"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  subject:
    type: reference
    description: "Search by subject"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  encounter:
    type: reference
    description: "An encounter in which this request is made"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  authored:
    type: date
    description: "Date request signed"
    fields:
      - field: "_search.authoredOn"
        type: date

  identifier:
    type: token
    description: "Identifiers assigned to this order"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  _id:
    type: token
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  code:
    source: code
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: code.coding[*].code
        target_field: codeCode
        datatype: array[string]
      - source_path: code
        target_field: codeSystemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  authoredOn:
    source: authoredOn
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: authoredOn
        target_field: authoredOn
        datatype: date

  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
        reference_type: Patient
        include_self: false
        datatype: array[string]

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_r4_sr_compartment_patient
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_r4_sr_status
  - fields:
      - "_search.codeCode": 1
    options:
      name: idx_r4_sr_code
