resource: FamilyMemberHistory
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec FamilyMemberHistory)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/patient.json
#
# Total parameters: 11 (9 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `FamilyMemberHistory.patient` is required Reference(Patient).
#   * `FamilyMemberHistory.relationship` is required CodeableConcept.
#   * `code` searches `condition[].code` (not top-level `procedure`).
#   * `instantiatesCanonical` / `instantiatesUri` are polymorphic arrays.
#   * Top-level scalars `status` and `date` query the FHIR root.

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  instantiates-canonical:
    type: reference
    description: "Instantiates FHIR protocol or definition"
    fields:
      - field: "_search.instantiatesCanonical_values"
        referenceType: full
      - field: "instantiatesCanonical"
        referenceType: full

  patient:
    type: reference
    description: "The patient whose family member history is recorded"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "patient.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  code:
    type: token
    description: "A search by a condition code"
    fields:
      - field: "_search.conditionCode_systemCode"
        tokenType: systemCode
      - field: "_search.conditionCode_codes"
        tokenType: code

  identifier:
    type: token
    description: "A search by a record identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  relationship:
    type: token
    description: "A search by a relationship type"
    fields:
      - field: "_search.relationship_systemCode"
        tokenType: systemCode
      - field: "_search.relationship_codes"
        tokenType: code
      - field: "relationship.coding"
        tokenType: code

  sex:
    type: token
    description: "A search by a sex code of a family member"
    fields:
      - field: "_search.sex_systemCode"
        tokenType: systemCode
      - field: "_search.sex_codes"
        tokenType: code
      - field: "sex.coding"
        tokenType: code

  status:
    type: token
    description: "partial | completed | entered-in-error | health-unknown"
    fields:
      - field: "status"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  date:
    type: date
    description: "When history was recorded or last updated"
    fields:
      - field: "date"
        type: date

  # ─────────────────────────────────────────────────────────────
  # URI Parameters
  # ─────────────────────────────────────────────────────────────
  instantiates-uri:
    type: uri
    description: "Instantiates external protocol or definition"
    fields:
      - field: "_search.instantiatesUri_values"
      - field: "instantiatesUri"

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  patient:
    source: patient
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: patient.reference
        target_field: patientId
        datatype: string
        extractType: id

  relationship:
    source: relationship
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: relationship.coding[*].code
        target_field: relationship_codes
        datatype: array[string]
      - source_path: relationship.coding[*]
        target_field: relationship_systemCode
        datatype: array[string]

  sex:
    source: sex
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: sex.coding[*].code
        target_field: sex_codes
        datatype: array[string]
      - source_path: sex.coding[*]
        target_field: sex_systemCode
        datatype: array[string]

  condition_code:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: condition[*].code.coding[*].code
        target_field: conditionCode_codes
        datatype: array[string]
      - source_path: condition[*].code.coding[*]
        target_field: conditionCode_systemCode
        datatype: array[string]

  instantiates_canonical:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: instantiatesCanonical[*]
        target_field: instantiatesCanonical_values
        datatype: array[string]

  instantiates_uri:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: instantiatesUri[*]
        target_field: instantiatesUri_values
        datatype: array[string]

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: "Patient compartment (patient.json linking param patient)"

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_status
  - fields:
      - "_search.patientId": 1
    options:
      name: idx_patient_id
      sparse: true
  - fields:
      - "_search.conditionCode_codes": 1
    options:
      name: idx_condition_code_codes
      sparse: true
  - fields:
      - "_search.relationship_codes": 1
    options:
      name: idx_relationship_codes
      sparse: true
  - fields:
      - "date": 1
    options:
      name: idx_date
      sparse: true
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
