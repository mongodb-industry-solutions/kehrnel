resource: MedicationRequest
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec MedicationRequest)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, device.json, encounter.json
#
# Total parameters: 19 (17 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`). Composite `combo-date` (dosageInstruction
# timing union) is deferred — same policy as Encounter `location-period`.
#
# R5 structural notes:
#   * `MedicationRequest.medication` is required CodeableReference —
#     `code` searches `.concept`, `medication` searches `.reference`.
#   * `MedicationRequest.subject` is required Reference(Patient | Group);
#     `patient` is the Patient/* shortcut.
#   * `MedicationRequest.performer[]` is Reference[] (not BackboneElement);
#     `intended-performer` searches `performer`.
#   * `dispenseRequest.dispenser` powers `intended-dispenser`.
#   * `groupIdentifier` is a single Identifier (token search).
#   * Top-level scalars `status`, `intent`, `priority` query the FHIR root.

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  encounter:
    type: reference
    description: "Return prescriptions with this encounter identifier"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  intended-dispenser:
    type: reference
    description: "Returns prescriptions intended to be dispensed by this Organization"
    fields:
      - field: "_search.intendedDispenserId"
        referenceType: id
      - field: "_search.intendedDispenserType"
        referenceType: type
      - field: "dispenseRequest.dispenser.reference"
        referenceType: full

  intended-performer:
    type: reference
    description: "Returns the intended performer of the administration"
    fields:
      - field: "_search.intendedPerformerIds"
        referenceType: id
      - field: "_search.intendedPerformerTypes"
        referenceType: type
      - field: "performer.reference"
        referenceType: full

  medication:
    type: reference
    description: "Return prescriptions for this medication reference"
    fields:
      - field: "_search.medicationReferenceIds"
        referenceType: id
      - field: "_search.medicationReferenceTypes"
        referenceType: type

  patient:
    type: reference
    description: "Returns prescriptions for a specific patient"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  requester:
    type: reference
    description: "Returns prescriptions prescribed by this prescriber"
    fields:
      - field: "_search.requesterId"
        referenceType: id
      - field: "_search.requesterType"
        referenceType: type
      - field: "requester.reference"
        referenceType: full

  subject:
    type: reference
    description: "The identity of a patient to list orders for"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  category:
    type: token
    description: "Returns prescriptions with different categories"
    fields:
      - field: "_search.category_systemCode"
        tokenType: systemCode
      - field: "_search.category_codes"
        tokenType: code

  code:
    type: token
    description: "Return prescriptions of this medication code"
    fields:
      - field: "_search.medicationConcept_systemCode"
        tokenType: systemCode
      - field: "_search.medicationConcept_codes"
        tokenType: code

  group-identifier:
    type: token
    description: "Composite request this is part of"
    fields:
      - field: "_search.groupIdentifier_systemCode"
        tokenType: systemCode
      - field: "_search.groupIdentifier_values"
        tokenType: code

  identifier:
    type: token
    description: "Return prescriptions with this external identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  intended-performertype:
    type: token
    description: "Returns requests for a specific type of performer"
    fields:
      - field: "_search.performerType_systemCode"
        tokenType: systemCode
      - field: "_search.performerType_codes"
        tokenType: code

  intent:
    type: token
    description: "Returns prescriptions with different intents"
    fields:
      - field: "intent"
        tokenType: code

  priority:
    type: token
    description: "Returns prescriptions with different priorities"
    fields:
      - field: "priority"
        tokenType: code

  status:
    type: token
    description: "Status of the prescription"
    fields:
      - field: "status"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  authoredon:
    type: date
    description: "Return prescriptions written on this date"
    fields:
      - field: "authoredOn"
        type: date

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

# Denormalization Configuration
denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  group_identifier:
    source: groupIdentifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: groupIdentifier.value
        target_field: groupIdentifier_values
        datatype: array[string]
      - source_path: groupIdentifier
        target_field: groupIdentifier_systemCode
        datatype: array[string]

  category:
    source: category
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: category[*].coding[*].code
        target_field: category_codes
        datatype: array[string]
      - source_path: category[*].coding[*]
        target_field: category_systemCode
        datatype: array[string]

  medication_concept:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: medication.concept.coding[*].code
        target_field: medicationConcept_codes
        datatype: array[string]
      - source_path: medication.concept.coding[*]
        target_field: medicationConcept_systemCode
        datatype: array[string]

  medication_reference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: medication.reference.reference
        target_field: medicationReferenceIds
        datatype: array[string]
        extractType: id
      - source_path: medication.reference.reference
        target_field: medicationReferenceTypes
        datatype: array[string]
        extractType: type

  performer_type:
    source: performerType
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: performerType.coding[*].code
        target_field: performerType_codes
        datatype: array[string]
      - source_path: performerType.coding[*]
        target_field: performerType_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  requester:
    source: requester
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: requester.reference
        target_field: requesterId
        datatype: string
        extractType: id
      - source_path: requester.reference
        target_field: requesterType
        datatype: string
        extractType: type

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  performer:
    source: performer
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: performer[*].reference
        target_field: intendedPerformerIds
        datatype: array[string]
        extractType: id
      - source_path: performer[*].reference
        target_field: intendedPerformerTypes
        datatype: array[string]
        extractType: type

  intended_dispenser:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: dispenseRequest.dispenser.reference
        target_field: intendedDispenserId
        datatype: string
        extractType: id
      - source_path: dispenseRequest.dispenser.reference
        target_field: intendedDispenserType
        datatype: string
        extractType: type

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: |
          Patient compartment (patient.json linking param subject).
          `patient` path token satisfies audit for the clinical shortcut.
      - target_field: Practitioner
        source_paths:
          - requester
        reference_type: Practitioner
        datatype: array[string]
        comment: "Practitioner compartment (requester where Practitioner/*)"
      - target_field: Device
        source_paths:
          - requester
        reference_type: Device
        datatype: array[string]
        comment: "Device compartment (requester where Device/*)"
      - target_field: Encounter
        source_paths:
          - encounter
        reference_type: Encounter
        datatype: array[string]
        comment: "Encounter compartment (encounter linking param)"

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Device
    - Encounter

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true
  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true

  - fields:
      - "status": 1
    options:
      name: idx_status

  - fields:
      - "intent": 1
    options:
      name: idx_intent
      sparse: true

  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true

  - fields:
      - "_search.encounterId": 1
    options:
      name: idx_encounter_id
      sparse: true

  - fields:
      - "_search.requesterId": 1
    options:
      name: idx_requester_id
      sparse: true

  - fields:
      - "authoredOn": 1
    options:
      name: idx_authored_on
      sparse: true

  - fields:
      - "_search.medicationConcept_codes": 1
    options:
      name: idx_medication_concept_codes
      sparse: true

  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
