resource: DocumentReference
fhir_version: R4

search_parameters:
  status:
    type: token
    description: "current | superseded | entered-in-error"
    fields:
      - field: "status"
        tokenType: code

  type:
    type: token
    description: "Kind of document (LOINC if possible)"
    fields:
      - field: "_search.typeCode"
        tokenType: code
      - field: "_search.typeSystemCode"
        tokenType: systemCode

  category:
    type: token
    description: "Categorization of document"
    fields:
      - field: "_search.categoryCode"
        tokenType: code

  patient:
    type: reference
    description: "Who/what is the subject of the document"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  subject:
    type: reference
    description: "Who/what is the subject of the document"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  date:
    type: date
    description: "When this document reference was created"
    fields:
      - field: "_search.date"
        type: date

  identifier:
    type: token
    description: "Master Version Specific Identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  _id:
    type: token
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  type:
    source: type
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: type.coding[*].code
        target_field: typeCode
        datatype: array[string]
      - source_path: type
        target_field: typeSystemCode
        datatype: array[string]

  category:
    source: category
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: category[*].coding[*].code
        target_field: categoryCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id

  date:
    source: date
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: date
        target_field: date
        datatype: date

  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
        reference_type: Patient
        include_self: false
        datatype: array[string]

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_r4_docref_compartment_patient
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_r4_docref_status
  - fields:
      - "_search.typeCode": 1
    options:
      name: idx_r4_docref_type
