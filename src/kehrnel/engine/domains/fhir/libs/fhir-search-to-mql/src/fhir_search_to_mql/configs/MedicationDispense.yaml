resource: MedicationDispense
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec MedicationDispense)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, encounter.json
#
# Total parameters: 19 (17 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `MedicationDispense.medication` is required CodeableReference —
#     `code` searches `.concept`, `medication` searches `.reference`.
#   * `MedicationDispense.performer[]` is BackboneElement with `actor`
#     (Reference); `performer` search targets `performer.actor`.
#   * `authorizingPrescription[]` powers the `prescription` search param.
#   * `substitution.responsibleParty` powers `responsibleparty`.
#   * `type` is CodeableConcept (0..1); `status` is top-level scalar.
#   * No Device compartment membership for MedicationDispense per R5
#     compartment definitions (performer/receiver link Practitioner only).

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  destination:
    type: reference
    description: "Returns dispenses that should be sent to a specific destination"
    fields:
      - field: "_search.destinationId"
        referenceType: id
      - field: "_search.destinationType"
        referenceType: type
      - field: "destination.reference"
        referenceType: full

  encounter:
    type: reference
    description: "Returns dispenses with a specific encounter"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  location:
    type: reference
    description: "Returns dispense for a given location"
    fields:
      - field: "_search.locationId"
        referenceType: id
      - field: "_search.locationType"
        referenceType: type
      - field: "location.reference"
        referenceType: full

  medication:
    type: reference
    description: "Returns dispenses of this medicine resource"
    fields:
      - field: "_search.medicationReferenceIds"
        referenceType: id
      - field: "_search.medicationReferenceTypes"
        referenceType: type

  patient:
    type: reference
    description: "The identity of a patient to list dispenses for"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  performer:
    type: reference
    description: "Returns dispenses performed by a specific individual"
    fields:
      - field: "_search.performerIds"
        referenceType: id
      - field: "_search.performerTypes"
        referenceType: type
      - field: "performer.actor.reference"
        referenceType: full

  prescription:
    type: reference
    description: "The identity of a prescription to list dispenses from"
    fields:
      - field: "_search.prescriptionIds"
        referenceType: id
      - field: "_search.prescriptionTypes"
        referenceType: type
      - field: "authorizingPrescription.reference"
        referenceType: full

  receiver:
    type: reference
    description: "The identity of a receiver to list dispenses for"
    fields:
      - field: "_search.receiverIds"
        referenceType: id
      - field: "_search.receiverTypes"
        referenceType: type
      - field: "receiver.reference"
        referenceType: full

  responsibleparty:
    type: reference
    description: "Returns dispenses with the specified responsible party"
    fields:
      - field: "_search.responsiblePartyId"
        referenceType: id
      - field: "_search.responsiblePartyType"
        referenceType: type

  subject:
    type: reference
    description: "The identity of a patient for whom to list dispenses"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  code:
    type: token
    description: "Returns dispenses of this medicine code"
    fields:
      - field: "_search.medicationConcept_systemCode"
        tokenType: systemCode
      - field: "_search.medicationConcept_codes"
        tokenType: code

  identifier:
    type: token
    description: "Returns dispenses with this external identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  status:
    type: token
    description: "Returns dispenses with a specified dispense status"
    fields:
      - field: "status"
        tokenType: code

  type:
    type: token
    description: "Returns dispenses of a specific type"
    fields:
      - field: "_search.type_systemCode"
        tokenType: systemCode
      - field: "_search.type_codes"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  recorded:
    type: date
    description: "Returns dispenses where dispensing activity began on this date"
    fields:
      - field: "recorded"
        type: date

  whenhandedover:
    type: date
    description: "Returns dispenses handed over on this date"
    fields:
      - field: "whenHandedOver"
        type: date

  whenprepared:
    type: date
    description: "Returns dispenses prepared on this date"
    fields:
      - field: "whenPrepared"
        type: date

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

# Denormalization Configuration
denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  medication_concept:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: medication.concept.coding[*].code
        target_field: medicationConcept_codes
        datatype: array[string]
      - source_path: medication.concept.coding[*]
        target_field: medicationConcept_systemCode
        datatype: array[string]

  medication_reference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: medication.reference.reference
        target_field: medicationReferenceIds
        datatype: array[string]
        extractType: id
      - source_path: medication.reference.reference
        target_field: medicationReferenceTypes
        datatype: array[string]
        extractType: type

  type:
    source: type
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: type.coding[*].code
        target_field: type_codes
        datatype: array[string]
      - source_path: type.coding[*]
        target_field: type_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  location:
    source: location
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: location.reference
        target_field: locationId
        datatype: string
        extractType: id
      - source_path: location.reference
        target_field: locationType
        datatype: string
        extractType: type

  destination:
    source: destination
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: destination.reference
        target_field: destinationId
        datatype: string
        extractType: id
      - source_path: destination.reference
        target_field: destinationType
        datatype: string
        extractType: type

  performer:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: performer[*].actor.reference
        target_field: performerIds
        datatype: array[string]
        extractType: id
      - source_path: performer[*].actor.reference
        target_field: performerTypes
        datatype: array[string]
        extractType: type

  receiver:
    source: receiver
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: receiver[*].reference
        target_field: receiverIds
        datatype: array[string]
        extractType: id
      - source_path: receiver[*].reference
        target_field: receiverTypes
        datatype: array[string]
        extractType: type

  prescription:
    source: authorizingPrescription
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: authorizingPrescription[*].reference
        target_field: prescriptionIds
        datatype: array[string]
        extractType: id
      - source_path: authorizingPrescription[*].reference
        target_field: prescriptionTypes
        datatype: array[string]
        extractType: type

  responsible_party:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: substitution.responsibleParty.reference
        target_field: responsiblePartyId
        datatype: string
        extractType: id
      - source_path: substitution.responsibleParty.reference
        target_field: responsiblePartyType
        datatype: string
        extractType: type

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
          - receiver[*]
          - receiver
        reference_type: Patient
        datatype: array[string]
        comment: |
          Patient compartment (patient.json linking params patient,
          subject, receiver).
      - target_field: Practitioner
        source_paths:
          - performer[*].actor
          - performer
          - receiver[*]
          - receiver
        reference_type: Practitioner
        datatype: array[string]
        comment: |
          Practitioner compartment (performer and receiver where
          Practitioner/* per practitioner.json).
      - target_field: Encounter
        source_paths:
          - encounter
        reference_type: Encounter
        datatype: array[string]
        comment: "Encounter compartment (encounter linking param)"

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Encounter

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true

  - fields:
      - "status": 1
    options:
      name: idx_status

  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true

  - fields:
      - "_search.encounterId": 1
    options:
      name: idx_encounter_id
      sparse: true

  - fields:
      - "whenPrepared": 1
    options:
      name: idx_when_prepared
      sparse: true

  - fields:
      - "whenHandedOver": 1
    options:
      name: idx_when_handed_over
      sparse: true

  - fields:
      - "recorded": 1
    options:
      name: idx_recorded
      sparse: true

  - fields:
      - "_search.medicationConcept_codes": 1
    options:
      name: idx_medication_concept_codes
      sparse: true

  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
