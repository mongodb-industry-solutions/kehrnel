resource: MedicationStatement
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec MedicationStatement)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: patient.json (subject), practitioner.json / relatedperson.json /
#   device.json (source → informationSource), encounter.json (encounter)
#
# Total parameters: 13 (11 resource-specific + `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `medication` is required CodeableReference — `code` → `.concept`,
#     `medication` → `.reference`.
#   * `effective[x]`: `effectiveDateTime` + `effectivePeriod` power `effective`;
#     `effectiveTiming` is not indexed for date overlap (deferred).
#   * `informationSource[]` powers search param `source`.
#   * `adherence.code` is CodeableConcept (token `adherence`).

search_parameters:
  encounter:
    type: reference
    description: "Encounter associated with this medication statement"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  medication:
    type: reference
    description: "Return statements for this medication reference"
    fields:
      - field: "_search.medicationReferenceIds"
        referenceType: id
      - field: "_search.medicationReferenceTypes"
        referenceType: type

  patient:
    type: reference
    description: "The identity of a patient to list statements for"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  source:
    type: reference
    description: "Who or where the information in the statement came from"
    fields:
      - field: "_search.sourceIds"
        referenceType: id
      - field: "_search.sourceTypes"
        referenceType: type
      - field: "informationSource[*].reference"
        referenceType: full

  subject:
    type: reference
    description: "The identity of a patient or group to list statements for"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  adherence:
    type: token
    description: "Type of adherence"
    fields:
      - field: "_search.adherence_systemCode"
        tokenType: systemCode
      - field: "_search.adherence_codes"
        tokenType: code

  category:
    type: token
    description: "Returns statements of this category of medication usage"
    fields:
      - field: "_search.category_systemCode"
        tokenType: systemCode
      - field: "_search.category_codes"
        tokenType: code

  code:
    type: token
    description: "Return statements of this medication code"
    fields:
      - field: "_search.medicationConcept_systemCode"
        tokenType: systemCode
      - field: "_search.medicationConcept_codes"
        tokenType: code

  identifier:
    type: token
    description: "Return statements with this external identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  status:
    type: token
    description: "Returns statements with this medication status"
    fields:
      - field: "status"
        tokenType: code

  effective:
    type: date
    description: "Date when patient was taking (or not taking) the medication"
    fields:
      - field: "effectiveDateTime"
        type: date
      - field: "_search.effectivePeriod"
        type: period

  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  category:
    source: category
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: category[*].coding[*].code
        target_field: category_codes
        datatype: array[string]
      - source_path: category[*].coding[*]
        target_field: category_systemCode
        datatype: array[string]

  medication_concept:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: medication.concept.coding[*].code
        target_field: medicationConcept_codes
        datatype: array[string]
      - source_path: medication.concept.coding[*]
        target_field: medicationConcept_systemCode
        datatype: array[string]

  medication_reference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: medication.reference.reference
        target_field: medicationReferenceIds
        datatype: array[string]
        extractType: id
      - source_path: medication.reference.reference
        target_field: medicationReferenceTypes
        datatype: array[string]
        extractType: type

  adherence:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: adherence.code.coding[*].code
        target_field: adherence_codes
        datatype: array[string]
      - source_path: adherence.code.coding[*]
        target_field: adherence_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject — powers `patient` search parameter"

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  information_source:
    source: informationSource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: informationSource[*].reference
        target_field: sourceIds
        datatype: array[string]
        extractType: id
      - source_path: informationSource[*].reference
        target_field: sourceTypes
        datatype: array[string]
        extractType: type

  effective_period:
    source: effectivePeriod
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: start
        target_field: effectivePeriod.start
        datatype: date
        optional: true
      - source_path: end
        target_field: effectivePeriod.end
        datatype: date
        optional: true

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
      - target_field: Practitioner
        source_paths:
          - informationSource
        reference_type: Practitioner
        datatype: array[string]
        comment: "Practitioner compartment (linking param `source`)"
      - target_field: RelatedPerson
        source_paths:
          - informationSource
        reference_type: RelatedPerson
        datatype: array[string]
        comment: "RelatedPerson compartment (linking param `source`)"
      - target_field: Device
        source_paths:
          - informationSource
        reference_type: Device
        datatype: array[string]
        comment: "Device compartment (linking param `source`)"
      - target_field: Encounter
        source_paths:
          - encounter
        reference_type: Encounter
        datatype: array[string]

compartments:
  precomputed:
    - Patient
    - Practitioner
    - RelatedPerson
    - Device
    - Encounter

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.RelatedPerson": 1
    options:
      name: idx_compartment_relatedperson
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true
  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_status
  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true
  - fields:
      - "_search.encounterId": 1
    options:
      name: idx_encounter_id
      sparse: true
  - fields:
      - "effectiveDateTime": 1
    options:
      name: idx_effective_datetime
      sparse: true
  - fields:
      - "_search.effectivePeriod.start": 1
    options:
      name: idx_effective_period_start
      sparse: true
  - fields:
      - "_search.medicationConcept_codes": 1
    options:
      name: idx_medication_concept_codes
      sparse: true
  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
