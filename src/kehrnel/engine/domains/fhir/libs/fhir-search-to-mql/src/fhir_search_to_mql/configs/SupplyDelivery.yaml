resource: SupplyDelivery
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec SupplyDelivery)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json
#
# Total parameters: 7 (5 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `receiver` is Reference[] (Organization | PractitionerRole | Practitioner).
#   * `occurrence[x]` is polymorphic — no occurrence search param in R5 index.

search_parameters:
  identifier:
    type: token
    description: "External identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  patient:
    type: reference
    description: "Patient for whom the item is supplied"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "patient.reference"
        referenceType: full

  receiver:
    type: reference
    description: "Who collected the Supply"
    fields:
      - field: "_search.receiverIds"
        referenceType: id
      - field: "_search.receiverTypes"
        referenceType: type
      - field: "receiver.reference"
        referenceType: full

  status:
    type: token
    description: "in-progress | completed | abandoned | entered-in-error"
    fields:
      - field: "status"
        tokenType: code

  supplier:
    type: reference
    description: "Dispenser"
    fields:
      - field: "_search.supplierId"
        referenceType: id
      - field: "_search.supplierType"
        referenceType: type
      - field: "supplier.reference"
        referenceType: full

  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  patient:
    source: patient
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: patient.reference
        target_field: patientId
        datatype: string
        extractType: id

  supplier:
    source: supplier
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: supplier.reference
        target_field: supplierId
        datatype: string
        extractType: id
      - source_path: supplier.reference
        target_field: supplierType
        datatype: string
        extractType: type

  receiver:
    source: receiver
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: receiver[*].reference
        target_field: receiverIds
        datatype: array[string]
        extractType: id
      - source_path: receiver[*].reference
        target_field: receiverTypes
        datatype: array[string]
        extractType: type

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - patient
        reference_type: Patient
        datatype: array[string]
      - target_field: Practitioner
        source_paths:
          - supplier
          - receiver
        reference_type: Practitioner
        datatype: array[string]

compartments:
  precomputed:
    - Patient
    - Practitioner

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_status
  - fields:
      - "_search.patientId": 1
    options:
      name: idx_patient_id
      sparse: true
  - fields:
      - "_search.supplierId": 1
    options:
      name: idx_supplier_id
      sparse: true
  - fields:
      - "_search.receiverIds": 1
    options:
      name: idx_receiver_ids
      sparse: true
  - fields:
      - "_search.identifier_values": 1
    options:
      name: idx_identifier_values
      sparse: true
  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
