resource: MedicationAdministration
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec MedicationAdministration)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, device.json, encounter.json
#
# Total parameters: 17 (15 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * FHIR R5 element names use the published spelling `occurence[x]`
#     (`occurenceDateTime`, `occurencePeriod`, `occurenceTiming`) — not
#     the conventional English "occurrence".
#   * `MedicationAdministration.medication` is required CodeableReference —
#     `code` searches `.concept`, `medication` searches `.reference`.
#   * `MedicationAdministration.performer[]` is BackboneElement with
#     `actor` (CodeableReference); `performer` searches `.actor.reference`,
#     `performer-device-code` searches `.actor.concept`.
#   * `device[]` is CodeableReference — `device` searches `.reference`.
#   * `reason[]` is CodeableReference — `reason-given-code` / `reason-given`.
#   * `statusReason[]` powers `reason-not-given`.
#   * Top-level scalar `status` queries the FHIR root field directly.
#   * `encounter` search on this resource uses `encounter` only (the R5
#     index unions MedicationRequest.encounter for cross-type search).

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  device:
    type: reference
    description: "Return administrations with this administration device identity"
    fields:
      - field: "_search.deviceIds"
        referenceType: id
      - field: "_search.deviceTypes"
        referenceType: type

  encounter:
    type: reference
    description: "Return administrations that share this encounter"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  medication:
    type: reference
    description: "Return administrations of this medication reference"
    fields:
      - field: "_search.medicationReferenceIds"
        referenceType: id
      - field: "_search.medicationReferenceTypes"
        referenceType: type

  patient:
    type: reference
    description: "The identity of a patient to list administrations for"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  performer:
    type: reference
    description: "The identity of the individual who administered the medication"
    fields:
      - field: "_search.performerIds"
        referenceType: id
      - field: "_search.performerTypes"
        referenceType: type
      - field: "performer.actor.reference"
        referenceType: full

  reason-given:
    type: reference
    description: "Reference to a resource (by instance)"
    fields:
      - field: "_search.reasonGivenIds"
        referenceType: id
      - field: "_search.reasonGivenTypes"
        referenceType: type

  request:
    type: reference
    description: "The identity of a request to list administrations from"
    fields:
      - field: "_search.requestId"
        referenceType: id
      - field: "_search.requestType"
        referenceType: type
      - field: "request.reference"
        referenceType: full

  subject:
    type: reference
    description: "The identity of the individual or group to list administrations for"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  code:
    type: token
    description: "Return administrations of this medication code"
    fields:
      - field: "_search.medicationConcept_systemCode"
        tokenType: systemCode
      - field: "_search.medicationConcept_codes"
        tokenType: code

  identifier:
    type: token
    description: "Return administrations with this external identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  performer-device-code:
    type: token
    description: "Performer actor concept (device-as-performer coding)"
    fields:
      - field: "_search.performerActorConcept_systemCode"
        tokenType: systemCode
      - field: "_search.performerActorConcept_codes"
        tokenType: code

  reason-given-code:
    type: token
    description: "Reasons for administering the medication"
    fields:
      - field: "_search.reasonGivenCode_systemCode"
        tokenType: systemCode
      - field: "_search.reasonGivenCode_codes"
        tokenType: code

  reason-not-given:
    type: token
    description: "Reasons for not administering the medication"
    fields:
      - field: "_search.statusReason_systemCode"
        tokenType: systemCode
      - field: "_search.statusReason_codes"
        tokenType: code

  status:
    type: token
    description: "MedicationAdministration event status"
    fields:
      - field: "status"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  date:
    type: date
    description: "Date administration happened (or did not happen)"
    fields:
      - field: "occurenceDateTime"
        type: date
      - field: "_search.occurencePeriod"
        type: period

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

# Denormalization Configuration
denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  medication_concept:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: medication.concept.coding[*].code
        target_field: medicationConcept_codes
        datatype: array[string]
      - source_path: medication.concept.coding[*]
        target_field: medicationConcept_systemCode
        datatype: array[string]

  medication_reference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: medication.reference.reference
        target_field: medicationReferenceIds
        datatype: array[string]
        extractType: id
      - source_path: medication.reference.reference
        target_field: medicationReferenceTypes
        datatype: array[string]
        extractType: type

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  request:
    source: request
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: request.reference
        target_field: requestId
        datatype: string
        extractType: id
      - source_path: request.reference
        target_field: requestType
        datatype: string
        extractType: type

  device_reference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: device[*].reference.reference
        target_field: deviceIds
        datatype: array[string]
        extractType: id
      - source_path: device[*].reference.reference
        target_field: deviceTypes
        datatype: array[string]
        extractType: type

  performer_reference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: performer[*].actor.reference.reference
        target_field: performerIds
        datatype: array[string]
        extractType: id
      - source_path: performer[*].actor.reference.reference
        target_field: performerTypes
        datatype: array[string]
        extractType: type

  performer_actor_concept:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: performer[*].actor.concept.coding[*].code
        target_field: performerActorConcept_codes
        datatype: array[string]
      - source_path: performer[*].actor.concept.coding[*]
        target_field: performerActorConcept_systemCode
        datatype: array[string]

  reason_given_concept:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: reason[*].concept.coding[*].code
        target_field: reasonGivenCode_codes
        datatype: array[string]
      - source_path: reason[*].concept.coding[*]
        target_field: reasonGivenCode_systemCode
        datatype: array[string]

  reason_given_reference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: reason[*].reference.reference
        target_field: reasonGivenIds
        datatype: array[string]
        extractType: id
      - source_path: reason[*].reference.reference
        target_field: reasonGivenTypes
        datatype: array[string]
        extractType: type

  status_reason:
    source: statusReason
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: statusReason[*].coding[*].code
        target_field: statusReason_codes
        datatype: array[string]
      - source_path: statusReason[*].coding[*]
        target_field: statusReason_systemCode
        datatype: array[string]

  occurence_period:
    source: occurencePeriod
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: start
        target_field: occurencePeriod
        datatype: object
        comment: "Nested Period for `date` overlap queries (FHIR R5 occurence spelling)"

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: |
          Patient compartment (patient.json linking params patient,
          subject). `patient` satisfies audit for the clinical shortcut.
      - target_field: Practitioner
        source_paths:
          - performer[*].actor.reference
          - performer
        reference_type: Practitioner
        datatype: array[string]
        comment: |
          Practitioner compartment — resolve the Reference arm of
          performer.actor CodeableReference (not the wrapper dict).
      - target_field: Device
        source_paths:
          - performer[*].actor.reference
          - performer
          - device[*].reference
          - device
        reference_type: Device
        datatype: array[string]
        comment: |
          Device compartment (device.json linking params performer, device).
          CodeableReference `.reference` paths so _extract_reference sees
          a Reference dict, not the wrapper.
      - target_field: Encounter
        source_paths:
          - encounter
        reference_type: Encounter
        datatype: array[string]
        comment: "Encounter compartment (encounter linking param)"

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Device
    - Encounter

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true
  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true

  - fields:
      - "status": 1
    options:
      name: idx_status

  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true

  - fields:
      - "_search.encounterId": 1
    options:
      name: idx_encounter_id
      sparse: true

  - fields:
      - "occurenceDateTime": 1
    options:
      name: idx_occurence_datetime
      sparse: true

  - fields:
      - "_search.occurencePeriod.start": 1
      - "_search.occurencePeriod.end": 1
    options:
      name: idx_occurence_period
      sparse: true

  - fields:
      - "_search.medicationConcept_codes": 1
    options:
      name: idx_medication_concept_codes
      sparse: true

  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
