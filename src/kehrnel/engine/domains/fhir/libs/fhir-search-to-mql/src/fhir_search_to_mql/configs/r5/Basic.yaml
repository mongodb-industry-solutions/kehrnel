resource: Basic
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec Basic)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, device.json, encounter.json,
#   relatedperson.json
#
# Total parameters: 8 (6 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `code` is required CodeableConcept.
#   * `patient` is the Patient/* shortcut over `subject`.
#   * Top-level `created` is dateTime at resource root.

search_parameters:
  author:
    type: reference
    description: "Who created the basic resource"
    fields:
      - field: "_search.authorId"
        referenceType: id
      - field: "_search.authorType"
        referenceType: type
      - field: "author.reference"
        referenceType: full

  code:
    type: token
    description: "Kind of Resource"
    fields:
      - field: "_search.code_systemCode"
        tokenType: systemCode
      - field: "_search.code_codes"
        tokenType: code

  created:
    type: date
    description: "When created"
    fields:
      - field: "created"
        type: date

  identifier:
    type: token
    description: "Business identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  patient:
    type: reference
    description: "Identifies the focus of this resource (Patient subject)"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  subject:
    type: reference
    description: "Identifies the focus of this resource"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  code:
    source: code
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: code.coding[*].code
        target_field: code_codes
        datatype: array[string]
      - source_path: code.coding[*]
        target_field: code_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient

  author:
    source: author
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: author.reference
        target_field: authorId
        datatype: string
        extractType: id
      - source_path: author.reference
        target_field: authorType
        datatype: string
        extractType: type

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
      - target_field: Practitioner
        source_paths:
          - author
        reference_type: Practitioner
        datatype: array[string]
      - target_field: Device
        source_paths:
          - author
        reference_type: Device
        datatype: array[string]
      - target_field: Encounter
        source_paths:
          - subject
          - encounter
        reference_type: Encounter
        datatype: array[string]

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Device
    - Encounter

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true
  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true

  - fields:
      - "_search.code_codes": 1
    options:
      name: idx_code_codes
      sparse: true

  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true

  - fields:
      - "_search.authorId": 1
    options:
      name: idx_author_id
      sparse: true

  - fields:
      - "created": 1
    options:
      name: idx_created
      sparse: true

  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
