resource: AuditEvent
fhir_version: R4

search_parameters:
  type:
    type: token
    description: "Type of AuditEvent"
    fields:
      - field: "_search.typeCode"
        tokenType: code
      - field: "_search.typeSystemCode"
        tokenType: systemCode
  date:
    type: date
    description: "Date for AuditEvent"
    fields:
      - field: "_search.date"
        type: date
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code
  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  type:
    source: type
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: type.coding[*].code
        target_field: typeCode
        datatype: array[string]
      - source_path: type
        target_field: typeSystemCode
        datatype: array[string]
  period:
    source: period
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: period.start
        target_field: date
        datatype: date

indexes:
  - fields:
      - "_search.date": -1
    options:
      name: idx_r4_adtvnt_date
  - fields:
      - "_search.typeCode": 1
    options:
      name: idx_r4_adtvnt_type
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_r4_adtvnt_updated
