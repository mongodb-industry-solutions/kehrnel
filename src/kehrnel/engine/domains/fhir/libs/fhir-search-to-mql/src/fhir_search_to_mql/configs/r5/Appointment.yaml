resource: Appointment
fhir_version: R5
# Definition: https://hl7.org/fhir/R5/appointment-definitions.html
# Search Parameters Configuration
# Reference: https://hl7.org/fhir/R5/appointment.html#search
# Total Parameters: 23 (21 resource-specific per FHIR R5 + 2 common: _id, _lastUpdated)
# Validated against the canonical R5 search parameter table at
# https://hl7.org/fhir/R5/appointment.html (2026-05).
#
# R5 spec parameter coverage (alphabetical):
#   actor (reference), appointment-type (token), based-on (reference), date (date),
#   group (reference), identifier (token), location (reference), part-status (token),
#   patient (reference), practitioner (reference), reason-code (token),
#   reason-reference (reference), requested-period (date), service-category (token),
#   service-type (token), service-type-reference (reference), slot (reference),
#   specialty (token), status (token), subject (reference), supporting-info (reference)

search_parameters:
  # Reference Parameters (11 total)
  actor:
    type: reference
    description: "Any one of the individuals participating in the appointment"
    fields:
      - field: "_search.actorIds"
        referenceType: id
      - field: "_search.actorTypes"
        referenceType: type
      - field: "participant.actor.reference"
        referenceType: full
  
  patient:
    type: reference
    description: "One of the individuals of the appointment is this patient"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full
      - field: "participant.actor.reference"
        referenceType: full
  
  practitioner:
    type: reference
    description: "One of the individuals of the appointment is this practitioner"
    fields:
      - field: "_search.practitionerId"
        referenceType: id
      - field: "participant.actor.reference"
        referenceType: full
  
  location:
    type: reference
    description: "This location is listed in the participants of the appointment"
    fields:
      - field: "_search.locationId"
        referenceType: id
      - field: "participant.actor.reference"
        referenceType: full
  
  based-on:
    type: reference
    description: "The service request this appointment is allocated to assess"
    fields:
      - field: "_search.basedOnId"
        referenceType: id
      - field: "_search.basedOnType"
        referenceType: type
      - field: "basedOn.reference"
        referenceType: full
  
  reason-reference:
    type: reference
    description: "Reference to a resource (by instance)"
    fields:
      - field: "_search.reasonReferenceId"
        referenceType: id
      - field: "_search.reasonReferenceType"
        referenceType: type
      - field: "reason.reference"
        referenceType: full
  
  service-type-reference:
    type: reference
    description: "The specific service (by HealthcareService) that is to be performed during this appointment"
    fields:
      - field: "_search.serviceTypeReferenceId"
        referenceType: id
      - field: "serviceType.reference"
        referenceType: full
  
  slot:
    type: reference
    description: "The slots that this appointment is filling"
    fields:
      - field: "_search.slotId"
        referenceType: id
      - field: "slot.reference"
        referenceType: full
  
  subject:
    type: reference
    description: "One of the individuals of the appointment is this patient"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "_search.actorIds"
        referenceType: id
      - field: "_search.actorTypes"
        referenceType: type
      - field: "subject.reference"
        referenceType: full
      - field: "participant.actor.reference"
        referenceType: full
  
  group:
    type: reference
    description: "One of the individuals of the appointment is this patient (when subject is a Group)"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.actorIds"
        referenceType: id
      - field: "subject.reference"
        referenceType: full
      - field: "participant.actor.reference"
        referenceType: full
  
  supporting-info:
    type: reference
    description: "Additional information to support the appointment"
    fields:
      - field: "_search.supportingInfoId"
        referenceType: id
      - field: "supportingInformation.reference"
        referenceType: full
  
  # Token Parameters (8 total)
  status:
    type: token
    description: "The overall status of the appointment"
    fields:
      - field: "status"
        tokenType: code
  
  appointment-type:
    type: token
    description: "The style of appointment or patient that has been booked in the slot (not service type)"
    fields:
      - field: "_search.appointmentType_systemCode"
        tokenType: systemCode
      - field: "_search.appointmentType_codes"
        tokenType: code
  
  service-type:
    type: token
    description: "The specific service (by coding) that is to be performed during this appointment"
    fields:
      - field: "_search.serviceType_systemCode"
        tokenType: systemCode
      - field: "_search.serviceType_codes"
        tokenType: code
  
  service-category:
    type: token
    description: "A broad categorization of the service that is to be performed during this appointment"
    fields:
      - field: "_search.serviceCategory_systemCode"
        tokenType: systemCode
      - field: "_search.serviceCategory_codes"
        tokenType: code
  
  specialty:
    type: token
    description: "The specialty of a practitioner that would be required to perform the service requested in this appointment"
    fields:
      - field: "_search.specialty_systemCode"
        tokenType: systemCode
      - field: "_search.specialty_codes"
        tokenType: code
  
  identifier:
    type: token
    description: "An Identifier of the Appointment"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code
  
  part-status:
    type: token
    description: "The Participation status of the subject, or other participant on the appointment"
    fields:
      - field: "_search.participantStatus"
        tokenType: code
      - field: "participant.status"
        tokenType: code
  
  reason-code:
    type: token
    description: "Reference to a concept (by class)"
    fields:
      - field: "_search.reasonCode_systemCode"
        tokenType: systemCode
      - field: "_search.reasonCode_codes"
        tokenType: code
  
  # Date Parameters (2 total)
  date:
    type: date
    description: "Appointment date/time"
    fields:
      - field: "start"
        type: date
      - field: "_search.appointmentPeriod"
        type: period
  
  requested-period:
    type: date
    description: "During what period was the Appointment requested to take place"
    fields:
      - field: "_search.requestedPeriod"
        type: period
      - field: "requestedPeriod.start"
        type: date
  
  # Common Parameters (2 total)
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code
  
  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

# Denormalization Configuration
denormalization:
  appointmentType:
    source: appointmentType
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: appointmentType.coding[*].code
        target_field: appointmentType_codes
        datatype: array[string]
        comment: "Array of appointment type codes"
      - source_path: appointmentType.coding[*]
        target_field: appointmentType_systemCode
        datatype: array[string]
        comment: "Array of system|code pairs for appointment type (e.g., 'http://terminology.hl7.org|CHECKUP')"
  
  # FHIR R5 wrapped `Appointment.serviceType` in a CodeableReference
  # (`{concept: CodeableConcept, reference: Reference}`), so the
  # codings live at `serviceType[*].concept.coding[*]` — one extra
  # nesting level vs R4's flat CodeableConcept. Pre-resolved mode
  # (`source: serviceType`) hands the extractor the wrapper dict,
  # which doesn't expose `.coding` directly. Resource-rooted
  # (`source: $resource`) lets the path resolver descend through
  # `.concept` and yields the actual codings.
  serviceType:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: serviceType[*].concept.coding[*].code
        target_field: serviceType_codes
        datatype: array[string]
        comment: "Array of service type codes from CodeableReference"
      - source_path: serviceType[*].concept.coding[*]
        target_field: serviceType_systemCode
        datatype: array[string]
        comment: "Array of system|code pairs for service type"
  
  serviceCategory:
    source: serviceCategory
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: serviceCategory[*].coding[*].code
        target_field: serviceCategory_codes
        datatype: array[string]
        comment: "Array of service category codes"
      - source_path: serviceCategory[*].coding[*]
        target_field: serviceCategory_systemCode
        datatype: array[string]
        comment: "Array of system|code pairs for service category"
  
  specialty:
    source: specialty
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: specialty[*].coding[*].code
        target_field: specialty_codes
        datatype: array[string]
        comment: "Array of specialty codes"
      - source_path: specialty[*].coding[*]
        target_field: specialty_systemCode
        datatype: array[string]
        comment: "Array of system|code pairs for specialty"
  
  # See the `serviceType` rule above for the rationale —
  # `Appointment.reason` is a CodeableReference[] in FHIR R5, so the
  # codings live at `reason[*].concept.coding[*]` and only the
  # resource-rooted mode resolves that path correctly.
  reasonCode:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: reason[*].concept.coding[*].code
        target_field: reasonCode_codes
        datatype: array[string]
        comment: "Array of reason codes from CodeableReference"
      - source_path: reason[*].concept.coding[*]
        target_field: reasonCode_systemCode
        datatype: array[string]
        comment: "Array of system|code pairs for reason codes"
  
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
        comment: "Identifier values extracted from identifier array"
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]
        comment: "System|value pairs constructed by extractor (e.g., 'http://hospital.org|APT123')"
  
  # Participant actor references — resource-type-filtered buckets.
  #
  # The previous version of this rule populated `patientId`,
  # `practitionerId`, and `locationId` by re-projecting the SAME
  # `extractType: id` over `participant[*].actor.reference`, which
  # made all three buckets identical (every participant ID, regardless
  # of type) and produced false-positive matches when search filtered
  # by patient or practitioner. The fix is `filterType:` — a
  # resource-type filter applied by ReferenceExtractor before the
  # id/type/full projection — so each bucket holds IDs of the
  # corresponding FHIR resource type only.
  participant:
    source: participant
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      # `actor` search parameter: spans every participant regardless
      # of resource type. These two arrays are the canonical "any
      # participant" projection and are intentionally unfiltered.
      - source_path: participant[*].actor.reference
        target_field: actorIds
        datatype: array[string]
        extractType: id
        comment: "IDs of every participant actor (Patient + Practitioner + Location + ...)"
      - source_path: participant[*].actor.reference
        target_field: actorTypes
        datatype: array[string]
        extractType: type
        comment: "Resource types of every participant actor (parallel to actorIds)"
      # Type-filtered buckets. ReferenceExtractor parses each
      # `Patient/<id>` reference and only keeps the projection when
      # the parsed resource type matches `filterType`. Outputs are
      # sparse: an Appointment with no Patient participant simply
      # omits `_search.patientId` (no `[]` write, no `null`).
      - source_path: participant[*].actor.reference
        target_field: patientId
        datatype: array[string]
        extractType: id
        filterType: Patient
        comment: "IDs of Patient/* participants only"
      - source_path: participant[*].actor.reference
        target_field: practitionerId
        datatype: array[string]
        extractType: id
        filterType: Practitioner
        comment: "IDs of Practitioner/* participants only"
      - source_path: participant[*].actor.reference
        target_field: locationId
        datatype: array[string]
        extractType: id
        filterType: Location
        comment: "IDs of Location/* participants only"

  # Participant status codes are NOT references, so they need a
  # text-aware extractor. ReferenceExtractor in pre-resolved mode
  # uses field_mappings[0]'s source_path as a global navigation hint
  # and falls back to `all_ids` for any mapping whose source_path
  # doesn't contain "reference" / "display" — which is how
  # `participantStatus` previously ended up holding actor IDs.
  # TextExtractor with `source: $resource` resolves the path
  # cleanly and writes the status string array.
  participantStatuses:
    source: $resource
    target: _search
    extractor: TextExtractor
    field_mappings:
      - source_path: participant[*].status
        target_field: participantStatus
        datatype: array[string]
        comment: "Participation status codes (accepted, declined, tentative, needs-action)"
  
  basedOn:
    source: basedOn
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: basedOn[*].reference
        target_field: basedOnId
        datatype: array[string]
        extractType: id
        comment: "IDs extracted from basedOn references (CarePlan, DeviceRequest, etc.)"
      - source_path: basedOn[*].reference
        target_field: basedOnType
        datatype: array[string]
        extractType: type
        comment: "Resource types from basedOn references"
  
  # In FHIR R5, `Appointment.reason` is `CodeableReference[]`
  # (changed from R4's flat `Reference[]`). The CodeableReference
  # shape is `{concept: CodeableConcept, reference: Reference}` —
  # so `reason[*].reference` resolves to the inner Reference dict,
  # NOT a string. ReferenceExtractor's pre-resolved branch
  # (`source: reason`) calls `_parse_reference()` on whatever
  # `ref.get('reference')` returns, which for an R5 Appointment is
  # a dict — and `dict` has no `.startswith`, hence the runtime
  # crash that nuked the entire rule. Switching to `source: $resource`
  # routes through `_extract_from_resource`, which correctly
  # extracts `item.get("reference")` (the inner string) for each
  # resolved Reference dict. Same root cause, same fix for
  # `serviceType` below.
  reasonReference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: reason[*].reference
        target_field: reasonReferenceId
        datatype: array[string]
        extractType: id
        comment: "IDs extracted from reason CodeableReferences (Condition, Procedure, etc.)"
      - source_path: reason[*].reference
        target_field: reasonReferenceType
        datatype: array[string]
        extractType: type
        comment: "Resource types from reason CodeableReferences"

  serviceTypeReference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: serviceType[*].reference
        target_field: serviceTypeReferenceId
        datatype: array[string]
        extractType: id
        comment: "IDs extracted from serviceType CodeableReferences (HealthcareService)"
  
  slot:
    source: slot
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: slot[*].reference
        target_field: slotId
        datatype: array[string]
        extractType: id
        comment: "IDs extracted from slot references"
  
  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
        comment: "ID extracted from subject reference (Patient or Group)"
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
        comment: "Resource type from subject reference (Patient or Group)"
  
  supportingInformation:
    source: supportingInformation
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: supportingInformation[*].reference
        target_field: supportingInfoId
        datatype: array[string]
        extractType: id
        comment: "IDs extracted from supportingInformation references"
  
  # Synthesize a Period structure from the resource's top-level
  # `start`/`end` fields. Appointment doesn't store these as a
  # nested Period in FHIR R5 (they're separate scalars), but the
  # search parameter `date` targets `_search.appointmentPeriod` for
  # period-typed range/overlap queries — so we project them into one
  # here. PeriodExtractor with `source: $resource` reads
  # `resource['start']` / `resource['end']` directly. The previous
  # `extractor: CustomExtractor` reference was a typo: that
  # extractor was never registered, so this rule silently failed on
  # every document.
  period:
    source: $resource
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: start
        target_field: appointmentPeriod.start
        datatype: string
        comment: "Appointment start datetime (top-level Appointment.start)"
      - source_path: end
        target_field: appointmentPeriod.end
        datatype: string
        comment: "Appointment end datetime (top-level Appointment.end)"
        optional: true
  
  # `Appointment.requestedPeriod` is `Period[]` per FHIR R5
  # (https://www.hl7.org/fhir/R5/appointment-definitions.html#Appointment.requestedPeriod).
  # The previous YAML wrote a flat array of START strings — which
  # the `requested-period` search parameter (type=date / period)
  # could not range-query correctly because the END boundary was
  # discarded entirely. PeriodExtractor's `array[object]` branch
  # now projects each input Period as a sparse `{start, end}` dict,
  # giving us `_search.requestedPeriod = [{start, end}, ...]` —
  # exactly what's needed for `requestedPeriod.start: {$gte: ...}`
  # / `requestedPeriod.end: {$lt: ...}` overlap checks.
  requestedPeriod:
    source: requestedPeriod
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: requestedPeriod
        target_field: requestedPeriod
        datatype: array[object]
        comment: "Requested period(s) for appointment scheduling, as [{start,end}, ...]"

  # ---------------------------------------------------------------------
  # Compartment membership precompute (Hybrid Approach 3). Patient
  # compartment for Appointment per FHIR R5 is `actor`, filtered to
  # references whose resourceType is `Patient`. Appointment.participant[]
  # is the structural location of the actor reference.
  # ---------------------------------------------------------------------
  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - participant[*].actor
        reference_type: Patient
        datatype: array[string]
        comment: "Patient compartment IDs (participant.actor where ref is Patient/*)"
      # Practitioner compartment for Appointment. Per FHIR R5
      # CompartmentDefinition the linking parameter is `actor` (same
      # element walked above for the Patient compartment); we project
      # the Practitioner-typed refs into a sibling field so a query
      # like `Practitioner/p-7/Appointment` collapses to a single
      # `_compartments.Practitioner = "p-7"` lookup.
      - target_field: Practitioner
        source_paths:
          - participant[*].actor
        reference_type: Practitioner
        datatype: array[string]
        comment: "Practitioner compartment IDs (participant.actor where ref is Practitioner/*)"
      # Device compartment for Appointment. Per FHIR R5
      # compartmentdefinition-device.html, Appointment participates
      # in the Device compartment via the `actor` linking parameter
      # (Appointment.participant.actor cardinality includes
      # Reference(Device) per R5). Same source path as the two
      # buckets above; `reference_type: Device` routes only the
      # Device-typed actor refs into `_compartments.Device` so a
      # query like `Device/dev-9/Appointment` collapses to a single
      # indexed `_compartments.Device = "dev-9"` lookup.
      - target_field: Device
        source_paths:
          - participant[*].actor
        reference_type: Device
        datatype: array[string]
        comment: "Device compartment IDs (participant.actor where ref is Device/*)"

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Device

# Recommended MongoDB Indexes
indexes:
  # Compartment fast-path index (Hybrid Approach 3).
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true
  # High-priority single field indexes
  - fields:
      - "_search.patientId": 1
    options:
      name: idx_patient_id
      sparse: true
  
  - fields:
      - "_search.practitionerId": 1
    options:
      name: idx_practitioner_id
      sparse: true
  
  - fields:
      - "start": 1
    options:
      name: idx_start_date
  
  - fields:
      - "status": 1
    options:
      name: idx_status
  
  - fields:
      - "_search.locationId": 1
    options:
      name: idx_location_id
      sparse: true
  
  - fields:
      - "_search.actorIds": 1
    options:
      name: idx_actor_ids
      sparse: true
  
  - fields:
      - "_search.identifier_systemCode": 1
    options:
      name: idx_identifier_systemCode
      sparse: true
  
  # Compound indexes for common query patterns
  - fields:
      - "_search.patientId": 1
      - "start": 1
    options:
      name: idx_patient_start_compound
      sparse: true
  
  - fields:
      - "_search.practitionerId": 1
      - "start": 1
    options:
      name: idx_practitioner_start_compound
      sparse: true
  
  - fields:
      - "_search.locationId": 1
      - "start": 1
    options:
      name: idx_location_start_compound
      sparse: true
  
  - fields:
      - "status": 1
      - "start": 1
    options:
      name: idx_status_start_compound
  
  # Token field indexes
  - fields:
      - "_search.appointmentType_codes": 1
    options:
      name: idx_appointment_type_codes
      sparse: true
  
  - fields:
      - "_search.serviceType_codes": 1
    options:
      name: idx_service_type_codes
      sparse: true
  
  - fields:
      - "_search.specialty_codes": 1
    options:
      name: idx_specialty_codes
      sparse: true
  
  - fields:
      - "_search.participantStatus": 1
    options:
      name: idx_participant_status
      sparse: true
  
  # Date range queries
  - fields:
      - "start": 1
      - "end": 1
    options:
      name: idx_start_end_period
  
  # Reference lookups
  - fields:
      - "_search.basedOnId": 1
    options:
      name: idx_based_on_id
      sparse: true
  
  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true
  
  - fields:
      - "_search.slotId": 1
    options:
      name: idx_slot_id
      sparse: true
  
  # Common metadata searches
  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_last_updated
  
  - fields:
      - "id": 1
    options:
      name: idx_id
      unique: true
