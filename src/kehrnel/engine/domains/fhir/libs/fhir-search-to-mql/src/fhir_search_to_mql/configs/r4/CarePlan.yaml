resource: CarePlan
fhir_version: R4

search_parameters:
  status:
    type: token
    description: "draft | active | on-hold | revoked | completed | entered-in-error | unknown"
    fields:
      - field: "status"
        tokenType: code

  intent:
    type: token
    description: "proposal | plan | order | option"
    fields:
      - field: "intent"
        tokenType: code

  patient:
    type: reference
    description: "Who the care plan is for"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  subject:
    type: reference
    description: "Who the care plan is for"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  encounter:
    type: reference
    description: "The Encounter during which this CarePlan was created"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  category:
    type: token
    description: "Type of plan"
    fields:
      - field: "_search.categoryCode"
        tokenType: code

  date:
    type: date
    description: "Time period plan covers"
    fields:
      - field: "_search.periodStart"
        type: date

  _id:
    type: token
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  category:
    source: category
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: category[*].coding[*].code
        target_field: categoryCode
        datatype: array[string]

  period:
    source: period
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: period.start
        target_field: periodStart
        datatype: date

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
        reference_type: Patient
        include_self: false
        datatype: array[string]

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_r4_cp_compartment_patient
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_r4_cp_status
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_r4_cp_last_updated
