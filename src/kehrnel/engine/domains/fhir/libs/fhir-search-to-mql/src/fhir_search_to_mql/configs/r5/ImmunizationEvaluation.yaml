resource: ImmunizationEvaluation
fhir_version: R5

search_parameters:
  status:
    type: token
    description: "ImmunizationEvaluation status"
    fields:
      - field: status
        tokenType: code
  patient:
    type: reference
    description: "Patient for ImmunizationEvaluation"
    fields:
      - field: _search.patientId
        referenceType: id
      - field: patient.reference
        referenceType: full
  date:
    type: date
    description: "Date for ImmunizationEvaluation"
    fields:
      - field: _search.date
        type: date
  identifier:
    type: token
    description: "Identifier for ImmunizationEvaluation"
    fields:
      - field: _search.identifier_systemCode
        tokenType: systemCode
      - field: _search.identifier_values
        tokenType: code
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: id
        tokenType: code
  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: meta.lastUpdated
        type: date

denormalization:
  subject:
    source: patient
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: patient.reference
        target_field: patientId
        datatype: string
        extractType: id
  date:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: date
        target_field: date
        datatype: date
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]
  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths: ['patient']
        reference_type: Patient
        include_self: false
        datatype: array[string]

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_r5_immuni_compartment_patient
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_r5_immuni_status
  - fields:
      - "_search.date": -1
    options:
      name: idx_r5_immuni_date
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_r5_immuni_updated
