resource: MedicationDispense
fhir_version: R4

# R4 note: uses medicationCodeableConcept or medicationReference (not medication CodeableReference)

search_parameters:
  status:
    type: token
    description: "preparation | in-progress | cancelled | on-hold | completed | entered-in-error | stopped | declined | unknown"
    fields:
      - field: "status"
        tokenType: code

  patient:
    type: reference
    description: "The identity of a patient to list dispenses for"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  subject:
    type: reference
    description: "The identity of a patient to list dispenses for"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  medication:
    type: reference
    description: "Returns dispenses of this medicine resource"
    fields:
      - field: "_search.medicationId"
        referenceType: id
      - field: "medicationReference.reference"
        referenceType: full

  code:
    type: token
    description: "Returns dispenses of this medicine code"
    fields:
      - field: "_search.medicationCode"
        tokenType: code

  _id:
    type: token
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id

  # R4: medicationReference (not medication CodeableReference)
  medicationReference:
    source: medicationReference
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: medicationReference.reference
        target_field: medicationId
        datatype: string
        extractType: id

  # R4: medicationCodeableConcept
  medicationCodeableConcept:
    source: medicationCodeableConcept
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: medicationCodeableConcept.coding[*].code
        target_field: medicationCode
        datatype: array[string]

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
        reference_type: Patient
        include_self: false
        datatype: array[string]

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_r4_medd_compartment_patient
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_r4_medd_status
