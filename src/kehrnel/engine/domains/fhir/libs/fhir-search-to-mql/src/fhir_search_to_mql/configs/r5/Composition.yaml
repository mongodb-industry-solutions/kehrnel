resource: Composition
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec Composition)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, encounter.json, device.json,
#   relatedperson.json
#
# Total parameters: 22 (20 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`). Composite `section-code-text` is deferred
# (use `section` token and `title` string directly).
#
# R5 structural notes:
#   * `author[]` and `type` are required; `subject[]` is Reference[].
#   * `event[]` uses CodeableReference on `detail` for event-code /
#     event-reference searches.
#   * `relatesTo[]` uses RelatedArtifact `resourceReference`.
#   * `section[].entry[]` powers `entry` reference search.
#   * `patient` is Patient/* filter on `subject`.
#   * RelatedPerson compartment uses dynamic resolver (attester paths).

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  date:
    type: date
    description: "Composition editing time"
    fields:
      - field: "date"
        type: date

  period:
    type: date
    description: "The period covered by the documentation"
    fields:
      - field: "_search.period"
        type: period

  # ─────────────────────────────────────────────────────────────
  # String Parameters
  # ─────────────────────────────────────────────────────────────
  title:
    type: string
    description: "Human readable label"
    fields:
      default:
        - field: "_search.title_lower"
          query_type: range
      exact:
        - field: "_search.title"

  # ─────────────────────────────────────────────────────────────
  # URI Parameters
  # ─────────────────────────────────────────────────────────────
  url:
    type: uri
    description: "The logical URL of the composition"
    fields:
      - field: "url"

  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  attester:
    type: reference
    description: "Who attested the composition"
    fields:
      - field: "_search.attesterPartyIds"
        referenceType: id
      - field: "_search.attesterPartyTypes"
        referenceType: type

  author:
    type: reference
    description: "Who and/or what authored the composition"
    fields:
      - field: "_search.authorIds"
        referenceType: id
      - field: "_search.authorTypes"
        referenceType: type
      - field: "author.reference"
        referenceType: full

  encounter:
    type: reference
    description: "Context of the Composition"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "_search.encounterType"
        referenceType: type
      - field: "encounter.reference"
        referenceType: full

  entry:
    type: reference
    description: "A reference to data that is part of the composition"
    fields:
      - field: "_search.sectionEntryIds"
        referenceType: id
      - field: "_search.sectionEntryTypes"
        referenceType: type

  event-reference:
    type: reference
    description: "The event resource that the documentation is about"
    fields:
      - field: "_search.eventReferenceIds"
        referenceType: id
      - field: "_search.eventReferenceTypes"
        referenceType: type

  patient:
    type: reference
    description: "Who and/or what the composition is about (Patient/*)"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectIds"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  related:
    type: reference
    description: "Target of the relationship"
    fields:
      - field: "_search.relatedTargetIds"
        referenceType: id
      - field: "_search.relatedTargetTypes"
        referenceType: type

  subject:
    type: reference
    description: "Who and/or what the composition is about"
    fields:
      - field: "_search.subjectIds"
        referenceType: id
      - field: "_search.subjectTypes"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  category:
    type: token
    description: "Categorization of Composition"
    fields:
      - field: "_search.category_systemCode"
        tokenType: systemCode
      - field: "_search.category_codes"
        tokenType: code

  event-code:
    type: token
    description: "Code for the event the documentation is about"
    fields:
      - field: "_search.eventCode_systemCode"
        tokenType: systemCode
      - field: "_search.eventCode_codes"
        tokenType: code

  identifier:
    type: token
    description: "Composition unique identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  section:
    type: token
    description: "Classification of section (recommended)"
    fields:
      - field: "_search.section_systemCode"
        tokenType: systemCode
      - field: "_search.section_codes"
        tokenType: code

  status:
    type: token
    description: "preliminary | final | amended | entered-in-error"
    fields:
      - field: "status"
        tokenType: code

  type:
    type: token
    description: "Kind of composition (LOINC if possible)"
    fields:
      - field: "_search.type_systemCode"
        tokenType: systemCode
      - field: "_search.type_codes"
        tokenType: code

  version:
    type: token
    description: "The business version of the composition"
    fields:
      - field: "version"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  type:
    source: type
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: type.coding[*].code
        target_field: type_codes
        datatype: array[string]
      - source_path: type.coding[*]
        target_field: type_systemCode
        datatype: array[string]

  category:
    source: category
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: category[*].coding[*].code
        target_field: category_codes
        datatype: array[string]
      - source_path: category[*].coding[*]
        target_field: category_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject[*].reference
        target_field: subjectIds
        datatype: array[string]
        extractType: id
      - source_path: subject[*].reference
        target_field: subjectTypes
        datatype: array[string]
        extractType: type
      - source_path: subject[*].reference
        target_field: patientId
        datatype: array[string]
        extractType: id
        filterType: Patient
        comment: "Patient/* subject — powers `patient` search parameter"

  author:
    source: author
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: author[*].reference
        target_field: authorIds
        datatype: array[string]
        extractType: id
      - source_path: author[*].reference
        target_field: authorTypes
        datatype: array[string]
        extractType: type

  attester_party:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: attester[*].party.reference
        target_field: attesterPartyIds
        datatype: array[string]
        extractType: id
      - source_path: attester[*].party.reference
        target_field: attesterPartyTypes
        datatype: array[string]
        extractType: type

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id
      - source_path: encounter.reference
        target_field: encounterType
        datatype: string
        extractType: type

  section_entry:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: section[*].entry[*].reference
        target_field: sectionEntryIds
        datatype: array[string]
        extractType: id
      - source_path: section[*].entry[*].reference
        target_field: sectionEntryTypes
        datatype: array[string]
        extractType: type

  event_code:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: event[*].detail[*].concept.coding[*].code
        target_field: eventCode_codes
        datatype: array[string]
      - source_path: event[*].detail[*].concept.coding[*]
        target_field: eventCode_systemCode
        datatype: array[string]

  event_reference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: event[*].detail[*].reference.reference
        target_field: eventReferenceIds
        datatype: array[string]
        extractType: id
      - source_path: event[*].detail[*].reference.reference
        target_field: eventReferenceTypes
        datatype: array[string]
        extractType: type

  related_target:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: relatesTo[*].resourceReference.reference
        target_field: relatedTargetIds
        datatype: array[string]
        extractType: id
      - source_path: relatesTo[*].resourceReference.reference
        target_field: relatedTargetTypes
        datatype: array[string]
        extractType: type

  section_code:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: section[*].code.coding[*].code
        target_field: section_codes
        datatype: array[string]
      - source_path: section[*].code.coding[*]
        target_field: section_systemCode
        datatype: array[string]

  event_period:
    source: $resource
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: event[*].period
        target_field: period
        datatype: array[object]

  title:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: title
        target_field: title
        datatype: string
      - source_path: title
        target_field: title_lower
        datatype: string
        normalize: lowercase

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
          - author
        reference_type: Patient
        datatype: array[string]
        comment: |
          Patient compartment (subject, author). `patient` is the
          clinical-patient search alias on subject.
      - target_field: Practitioner
        source_paths:
          - subject
          - author
          - attester[*].party
        reference_type: Practitioner
        datatype: array[string]
        comment: |
          Practitioner compartment (subject, author, attester).
      - target_field: Encounter
        source_paths:
          - encounter
        reference_type: Encounter
        datatype: array[string]
      - target_field: Device
        source_paths:
          - subject
          - author
        reference_type: Device
        datatype: array[string]
        comment: "Device compartment (subject, author filtered to Device/*)"

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Encounter
    - Device

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true

  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true

  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true

  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true

  - fields:
      - "status": 1
    options:
      name: idx_status

  - fields:
      - "_search.patientId": 1
    options:
      name: idx_patient_id
      sparse: true

  - fields:
      - "_search.type_codes": 1
    options:
      name: idx_type_codes
      sparse: true

  - fields:
      - "date": 1
    options:
      name: idx_date
      sparse: true

  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
