resource: Account
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec Account)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, device.json, encounter.json,
#   relatedperson.json
#
# Total parameters: 12 (10 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `Account.subject[]` is Reference[]; `patient` is the Patient/*
#     shortcut on subject.
#   * `guarantor[]` backbone; `guarantor` searches `guarantor.party`.
#   * `relatedAccount[]` backbone; `relatedaccount` searches
#     `relatedAccount.account`.
#   * `period` searches `servicePeriod` (interval overlap).
#   * `name` is a root string with `:exact` modifier support.
#   * Top-level scalar `status` queries the FHIR root.

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  guarantor:
    type: reference
    description: "The parties ultimately responsible for balancing the account"
    fields:
      - field: "_search.guarantorIds"
        referenceType: id
      - field: "_search.guarantorTypes"
        referenceType: type
      - field: "guarantor.party.reference"
        referenceType: full

  owner:
    type: reference
    description: "Entity managing the account"
    fields:
      - field: "_search.ownerId"
        referenceType: id
      - field: "_search.ownerType"
        referenceType: type
      - field: "owner.reference"
        referenceType: full

  patient:
    type: reference
    description: "The entity that caused the expenses (Patient subject)"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectIds"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  relatedaccount:
    type: reference
    description: "Parent and other related accounts"
    fields:
      - field: "_search.relatedAccountIds"
        referenceType: id
      - field: "_search.relatedAccountTypes"
        referenceType: type
      - field: "relatedAccount.account.reference"
        referenceType: full

  subject:
    type: reference
    description: "The entity that caused the expenses"
    fields:
      - field: "_search.subjectIds"
        referenceType: id
      - field: "_search.subjectTypes"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  identifier:
    type: token
    description: "Account number"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  type:
    type: token
    description: "E.g. patient, expense, depreciation"
    fields:
      - field: "_search.type_systemCode"
        tokenType: systemCode
      - field: "_search.type_codes"
        tokenType: code

  status:
    type: token
    description: "active | inactive | entered-in-error | on-hold | unknown"
    fields:
      - field: "status"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # String Parameters
  # ─────────────────────────────────────────────────────────────
  name:
    type: string
    description: "Human-readable label"
    fields:
      default:
        - field: "_search.name_lower"
          query_type: range
      exact:
        - field: "_search.name"

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  period:
    type: date
    description: "Transaction window"
    fields:
      - field: "_search.servicePeriod"
        type: period

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  type:
    source: type
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: type.coding[*].code
        target_field: type_codes
        datatype: array[string]
      - source_path: type.coding[*]
        target_field: type_systemCode
        datatype: array[string]

  name:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: name
        target_field: name
        datatype: string
      - source_path: name
        target_field: name_lower
        datatype: string
        normalize: lowercase

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject[*].reference
        target_field: subjectIds
        datatype: array[string]
        extractType: id
      - source_path: subject[*].reference
        target_field: subjectTypes
        datatype: array[string]
        extractType: type
      - source_path: subject[*].reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  guarantor:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: guarantor[*].party.reference
        target_field: guarantorIds
        datatype: array[string]
        extractType: id
      - source_path: guarantor[*].party.reference
        target_field: guarantorTypes
        datatype: array[string]
        extractType: type

  owner:
    source: owner
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: owner.reference
        target_field: ownerId
        datatype: string
        extractType: id
      - source_path: owner.reference
        target_field: ownerType
        datatype: string
        extractType: type

  related_account:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: relatedAccount[*].account.reference
        target_field: relatedAccountIds
        datatype: array[string]
        extractType: id
        filterType: Account
      - source_path: relatedAccount[*].account.reference
        target_field: relatedAccountTypes
        datatype: array[string]
        extractType: type
        filterType: Account

  service_period:
    source: servicePeriod
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: start
        target_field: servicePeriod.start
        datatype: date
        optional: true
      - source_path: end
        target_field: servicePeriod.end
        datatype: date
        optional: true

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: |
          Patient compartment (patient.json linking param subject).
      - target_field: Practitioner
        source_paths:
          - subject
        reference_type: Practitioner
        datatype: array[string]
        comment: "Practitioner compartment (subject linking param)"
      - target_field: Device
        source_paths:
          - subject
        reference_type: Device
        datatype: array[string]
        comment: "Device compartment (subject linking param)"
      - target_field: Encounter
        source_paths:
          - subject
        reference_type: Encounter
        datatype: array[string]
        comment: "Encounter compartment (subject linking param)"

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Device
    - Encounter

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true
  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_status
  - fields:
      - "_search.patientId": 1
    options:
      name: idx_patient_id
      sparse: true
  - fields:
      - "_search.subjectIds": 1
    options:
      name: idx_subject_ids
      sparse: true
  - fields:
      - "_search.ownerId": 1
    options:
      name: idx_owner_id
      sparse: true
  - fields:
      - "_search.guarantorIds": 1
    options:
      name: idx_guarantor_ids
      sparse: true
  - fields:
      - "_search.relatedAccountIds": 1
    options:
      name: idx_related_account_ids
      sparse: true
  - fields:
      - "_search.type_codes": 1
    options:
      name: idx_type_codes
      sparse: true
  - fields:
      - "_search.servicePeriod.start": 1
      - "_search.servicePeriod.end": 1
    options:
      name: idx_service_period
      sparse: true
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
