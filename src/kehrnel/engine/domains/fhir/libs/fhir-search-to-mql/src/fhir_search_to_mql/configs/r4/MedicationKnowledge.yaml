resource: MedicationKnowledge
fhir_version: R4

search_parameters:
  status:
    type: token
    description: "MedicationKnowledge status"
    fields:
      - field: "status"
        tokenType: code
  code:
    type: token
    description: "Code for MedicationKnowledge"
    fields:
      - field: "_search.codeCode"
        tokenType: code
      - field: "_search.codeSystemCode"
        tokenType: systemCode
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code
  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  code:
    source: code
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: code.coding[*].code
        target_field: codeCode
        datatype: array[string]
      - source_path: code
        target_field: codeSystemCode
        datatype: array[string]

indexes:
  - fields:
      - "status": 1
    options:
      name: idx_r4_mdctnk_status
  - fields:
      - "_search.codeCode": 1
    options:
      name: idx_r4_mdctnk_code
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_r4_mdctnk_updated
