resource: Condition
fhir_version: R5

# Definition: https://www.hl7.org/fhir/condition-definitions.html
# Search Parameters: https://www.hl7.org/fhir/condition-search.html
# Compartments (R5): Encounter, Patient, Practitioner, RelatedPerson
#   — https://www.hl7.org/fhir/compartmentdefinition-patient.html lists
#     Condition via `patient` and `subject`; Practitioner / RelatedPerson /
#     Device via `participant`; Encounter via `encounter`.
#
# Total parameters: 24 (22 resource-specific per FHIR R5 + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `Condition.onset[x]` / `Condition.abatement[x]` are polymorphic
#     choices (dateTime, Age, Period, Range, string). Search parameters
#     bind to specific variants via `.ofType(...)` in the FHIR expressions.
#   * `Condition.evidence` is `CodeableReference[]` — `evidence` searches
#     `.concept`, `evidence-detail` searches `.reference`.
#   * `Condition.participant[]` is a BackboneElement with required `actor`
#     (Reference) and optional `function` (CodeableConcept).
#   * `Condition.stage[]` is a BackboneElement; `stage` search parameter
#     targets `stage.summary` (CodeableConcept).
#   * `Condition.subject` is Reference(Patient | Group); `patient` is the
#     clinical-patient shortcut for `subject.where(resolve() is Patient)`.

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  encounter:
    type: reference
    description: "The Encounter during which this Condition was created"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  evidence-detail:
    type: reference
    description: "Supporting information found elsewhere (Condition.evidence.reference)"
    fields:
      - field: "_search.evidenceDetailIds"
        referenceType: id
      - field: "_search.evidenceDetailTypes"
        referenceType: type
      - field: "evidence.reference"
        referenceType: full

  participant-actor:
    type: reference
    description: "Who or what participated in activities related to the condition"
    fields:
      - field: "_search.participantActorIds"
        referenceType: id
      - field: "_search.participantActorTypes"
        referenceType: type
      - field: "participant.actor.reference"
        referenceType: full

  patient:
    type: reference
    description: "Who has the condition? (subject when resolved as Patient)"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  subject:
    type: reference
    description: "Who has the condition? (Patient or Group)"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  body-site:
    type: token
    description: "Anatomical location, if relevant"
    fields:
      - field: "_search.bodySite_systemCode"
        tokenType: systemCode
      - field: "_search.bodySite_codes"
        tokenType: code

  category:
    type: token
    description: "The category of the condition"
    fields:
      - field: "_search.category_systemCode"
        tokenType: systemCode
      - field: "_search.category_codes"
        tokenType: code

  clinical-status:
    type: token
    description: "The clinical status of the condition"
    fields:
      - field: "_search.clinicalStatus_systemCode"
        tokenType: systemCode
      - field: "_search.clinicalStatus_codes"
        tokenType: code

  code:
    type: token
    description: "Code for the condition (Condition.code)"
    fields:
      default:
        - field: "_search.code_systemCode"
          tokenType: systemCode
        - field: "_search.code_codes"
          tokenType: code
      text:
        - field: "_search.code_displays_lower"
          tokenType: code
        - field: "_search.code_text_lower"
          tokenType: code

  evidence:
    type: token
    description: "Manifestation/symptom (Condition.evidence.concept)"
    fields:
      - field: "_search.evidence_systemCode"
        tokenType: systemCode
      - field: "_search.evidence_codes"
        tokenType: code

  identifier:
    type: token
    description: "A unique identifier of the condition record"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  participant-function:
    type: token
    description: "Type of involvement of the actor in activities related to the condition"
    fields:
      - field: "_search.participantFunction_systemCode"
        tokenType: systemCode
      - field: "_search.participantFunction_codes"
        tokenType: code

  severity:
    type: token
    description: "The severity of the condition"
    fields:
      - field: "_search.severity_systemCode"
        tokenType: systemCode
      - field: "_search.severity_codes"
        tokenType: code

  stage:
    type: token
    description: "Simple summary (disease specific) — Condition.stage.summary"
    fields:
      - field: "_search.stage_systemCode"
        tokenType: systemCode
      - field: "_search.stage_codes"
        tokenType: code

  verification-status:
    type: token
    description: "unconfirmed | provisional | differential | confirmed | refuted | entered-in-error"
    fields:
      - field: "_search.verificationStatus_systemCode"
        tokenType: systemCode
      - field: "_search.verificationStatus_codes"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # String Parameters (onset/abatement string variants)
  # ─────────────────────────────────────────────────────────────
  abatement-string:
    type: string
    description: "Abatement as a string (Condition.abatement.ofType(string))"
    fields:
      default:
        - field: "_search.abatementString_lower"
          query_type: range
      exact:
        - field: "_search.abatementString"

  onset-info:
    type: string
    description: "Onsets as a string (Condition.onset.ofType(string))"
    fields:
      default:
        - field: "_search.onsetString_lower"
          query_type: range
      exact:
        - field: "_search.onsetString"

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  abatement-date:
    type: date
    description: "Date-related abatements (dateTime and Period variants)"
    fields:
      - field: "abatementDateTime"
        type: date
      - field: "_search.abatementPeriod"
        type: period

  onset-date:
    type: date
    description: "Date-related onsets (dateTime and Period variants)"
    fields:
      - field: "onsetDateTime"
        type: date
      - field: "_search.onsetPeriod"
        type: period

  recorded-date:
    type: date
    description: "Date record was first recorded (Condition.recordedDate)"
    fields:
      - field: "recordedDate"
        type: date

  # ─────────────────────────────────────────────────────────────
  # Quantity Parameters (Age variant of onset/abatement[x])
  # ─────────────────────────────────────────────────────────────
  abatement-age:
    type: quantity
    description: "Abatement as age or age range"
    fields:
      - field: "abatementAge"
        quantityType: full

  onset-age:
    type: quantity
    description: "Onsets as age or age range"
    fields:
      - field: "onsetAge"
        quantityType: full

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

# Denormalization Configuration
denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  code:
    source: code
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: code.coding[*].code
        target_field: code_codes
        datatype: array[string]
      - source_path: code.coding[*]
        target_field: code_systemCode
        datatype: array[string]
      - source_path: code.coding[*].display
        target_field: code_displays_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: code.text
        target_field: code_text_lower
        datatype: string
        normalize: lowercase
        optional: true

  clinicalStatus:
    source: clinicalStatus
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: clinicalStatus.coding[*].code
        target_field: clinicalStatus_codes
        datatype: array[string]
      - source_path: clinicalStatus.coding[*]
        target_field: clinicalStatus_systemCode
        datatype: array[string]

  verificationStatus:
    source: verificationStatus
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: verificationStatus.coding[*].code
        target_field: verificationStatus_codes
        datatype: array[string]
      - source_path: verificationStatus.coding[*]
        target_field: verificationStatus_systemCode
        datatype: array[string]

  category:
    source: category
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: category[*].coding[*].code
        target_field: category_codes
        datatype: array[string]
      - source_path: category[*].coding[*]
        target_field: category_systemCode
        datatype: array[string]

  severity:
    source: severity
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: severity.coding[*].code
        target_field: severity_codes
        datatype: array[string]
      - source_path: severity.coding[*]
        target_field: severity_systemCode
        datatype: array[string]

  bodySite:
    source: bodySite
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: bodySite[*].coding[*].code
        target_field: bodySite_codes
        datatype: array[string]
      - source_path: bodySite[*].coding[*]
        target_field: bodySite_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  participant:
    source: participant
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: participant[*].actor.reference
        target_field: participantActorIds
        datatype: array[string]
        extractType: id
        comment: "All participant actors — powers `participant-actor`"
      - source_path: participant[*].actor.reference
        target_field: participantActorTypes
        datatype: array[string]
        extractType: type

  participantFunction:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: participant[*].function.coding[*].code
        target_field: participantFunction_codes
        datatype: array[string]
      - source_path: participant[*].function.coding[*]
        target_field: participantFunction_systemCode
        datatype: array[string]

  stage:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: stage[*].summary.coding[*].code
        target_field: stage_codes
        datatype: array[string]
      - source_path: stage[*].summary.coding[*]
        target_field: stage_systemCode
        datatype: array[string]

  evidence_concept:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: evidence[*].concept.coding[*].code
        target_field: evidence_codes
        datatype: array[string]
      - source_path: evidence[*].concept.coding[*]
        target_field: evidence_systemCode
        datatype: array[string]

  evidence_reference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: evidence[*].reference.reference
        target_field: evidenceDetailIds
        datatype: array[string]
        extractType: id
      - source_path: evidence[*].reference.reference
        target_field: evidenceDetailTypes
        datatype: array[string]
        extractType: type

  # Polymorphic onset[x] / abatement[x] — Period and string variants are
  # denormalized into `_search`. dateTime variants are queried directly
  # on the FHIR root fields (`onsetDateTime`, `abatementDateTime`,
  # `recordedDate`) per the search-parameter `fields` blocks above.
  onset_period:
    source: onsetPeriod
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: start
        target_field: onsetPeriod
        datatype: object
        comment: "Nested Period for `onset-date` overlap queries"

  onset_string:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: onsetString
        target_field: onsetString
        datatype: string
      - source_path: onsetString
        target_field: onsetString_lower
        datatype: string
        normalize: lowercase

  abatement_period:
    source: abatementPeriod
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: start
        target_field: abatementPeriod
        datatype: object

  abatement_string:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: abatementString
        target_field: abatementString
        datatype: string
      - source_path: abatementString
        target_field: abatementString_lower
        datatype: string
        normalize: lowercase

  # ---------------------------------------------------------------------
  # Compartment membership precompute (Hybrid Approach 3).
  # Patient compartment: `patient` + `subject` linking parameters → subject
  # when the reference resolves to Patient/*.
  # Practitioner / Device compartments: `participant` linking parameter →
  # participant.actor filtered by resource type.
  # Encounter and RelatedPerson compartments use dynamic resolver fallback.
  # ---------------------------------------------------------------------
  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: |
          Patient compartment IDs. FHIR R5 lists linking parameters
          `patient` and `subject`; both resolve through `Condition.subject`
          when the reference is Patient/* (`patient` is the clinical shortcut).
      - target_field: Practitioner
        source_paths:
          - participant[*].actor
        reference_type: Practitioner
        datatype: array[string]
        comment: "Practitioner compartment IDs (participant.actor where Practitioner/*)"
      - target_field: Device
        source_paths:
          - participant[*].actor
        reference_type: Device
        datatype: array[string]
        comment: "Device compartment IDs (participant.actor where Device/*)"

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Device

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true

  - fields:
      - "recordedDate": 1
    options:
      name: idx_recorded_date
      sparse: true
  - fields:
      - "onsetDateTime": 1
    options:
      name: idx_onset_datetime
      sparse: true
  - fields:
      - "abatementDateTime": 1
    options:
      name: idx_abatement_datetime
      sparse: true

  - fields:
      - "_search.code_systemCode": 1
    options:
      name: idx_code_system_code
      sparse: true
  - fields:
      - "_search.code_codes": 1
    options:
      name: idx_code_codes
      sparse: true
  - fields:
      - "_search.clinicalStatus_codes": 1
    options:
      name: idx_clinical_status_codes
      sparse: true
  - fields:
      - "_search.verificationStatus_codes": 1
    options:
      name: idx_verification_status_codes
      sparse: true
  - fields:
      - "_search.category_codes": 1
    options:
      name: idx_category_codes
      sparse: true
  - fields:
      - "_search.identifier_values": 1
    options:
      name: idx_identifier_values
      sparse: true
  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true
  - fields:
      - "_search.patientId": 1
    options:
      name: idx_patient_id
      sparse: true
  - fields:
      - "_search.encounterId": 1
    options:
      name: idx_encounter_id
      sparse: true
  - fields:
      - "_search.participantActorIds": 1
    options:
      name: idx_participant_actor_ids
      sparse: true
  - fields:
      - "_search.evidence_codes": 1
    options:
      name: idx_evidence_codes
      sparse: true
  - fields:
      - "_search.stage_codes": 1
    options:
      name: idx_stage_codes
      sparse: true
  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
