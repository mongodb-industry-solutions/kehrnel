resource: NutritionIntake
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec NutritionIntake)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, device.json, encounter.json
#
# Total parameters: 11 (9 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `subject` is required Reference(Patient | Group); `patient` is
#     the Patient/* shortcut.
#   * `occurrence[x]` splits into `occurrenceDateTime` and
#     `_search.occurrencePeriod` for `date` search.
#   * `source` searches `reportedReference` only (Reference arm of
#     reported[x]).
#   * `nutrition` searches `consumedItem[].nutritionProduct.concept`.

search_parameters:
  code:
    type: token
    description: "Returns statements of this code of NutritionIntake"
    fields:
      - field: "_search.code_systemCode"
        tokenType: systemCode
      - field: "_search.code_codes"
        tokenType: code

  date:
    type: date
    description: "Date when patient was taking (or not taking) the medication"
    fields:
      - field: "occurrenceDateTime"
        type: date
      - field: "_search.occurrencePeriod"
        type: period

  encounter:
    type: reference
    description: "Returns statements for a specific encounter"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  identifier:
    type: token
    description: "Return statements with this external identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  nutrition:
    type: token
    description: "Return intakes for a specific consumed item"
    fields:
      - field: "_search.nutritionProductConcept_systemCode"
        tokenType: systemCode
      - field: "_search.nutritionProductConcept_codes"
        tokenType: code

  patient:
    type: reference
    description: "Returns statements for a specific patient"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  source:
    type: reference
    description: "Who or where the information in the statement came from"
    fields:
      - field: "_search.sourceId"
        referenceType: id
      - field: "_search.sourceType"
        referenceType: type
      - field: "reportedReference.reference"
        referenceType: full

  status:
    type: token
    description: "Return statements that match the given status"
    fields:
      - field: "status"
        tokenType: code

  subject:
    type: reference
    description: "The identity of a patient, animal or group to list statements for"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  code:
    source: code
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: code.coding[*].code
        target_field: code_codes
        datatype: array[string]
      - source_path: code.coding[*]
        target_field: code_systemCode
        datatype: array[string]

  nutrition_product:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: consumedItem[*].nutritionProduct.concept.coding[*].code
        target_field: nutritionProductConcept_codes
        datatype: array[string]
      - source_path: consumedItem[*].nutritionProduct.concept.coding[*]
        target_field: nutritionProductConcept_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient

  source:
    source: reportedReference
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: reportedReference.reference
        target_field: sourceId
        datatype: string
        extractType: id
      - source_path: reportedReference.reference
        target_field: sourceType
        datatype: string
        extractType: type

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  occurrence_period:
    source: occurrencePeriod
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: occurrencePeriod
        target_field: occurrencePeriod
        datatype: object

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
          - reportedReference
          - source
        reference_type: Patient
        datatype: array[string]
      - target_field: Practitioner
        source_paths:
          - reportedReference
          - source
        reference_type: Practitioner
        datatype: array[string]
      - target_field: Device
        source_paths:
          - reportedReference
          - source
        reference_type: Device
        datatype: array[string]
      - target_field: Encounter
        source_paths:
          - encounter
        reference_type: Encounter
        datatype: array[string]

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Device
    - Encounter

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true
  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true

  - fields:
      - "status": 1
    options:
      name: idx_status

  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true

  - fields:
      - "_search.sourceId": 1
    options:
      name: idx_source_id
      sparse: true

  - fields:
      - "_search.encounterId": 1
    options:
      name: idx_encounter_id
      sparse: true

  - fields:
      - "_search.nutritionProductConcept_codes": 1
    options:
      name: idx_nutrition_product_codes
      sparse: true

  - fields:
      - "occurrenceDateTime": 1
    options:
      name: idx_occurrence_datetime
      sparse: true

  - fields:
      - "_search.occurrencePeriod.start": 1
      - "_search.occurrencePeriod.end": 1
    options:
      name: idx_occurrence_period
      sparse: true

  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
