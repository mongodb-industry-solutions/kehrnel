resource: Device
fhir_version: R4

# R4 note: uses deviceName[] array (not name[]); type is CodeableConcept

search_parameters:
  status:
    type: token
    description: "active | inactive | entered-in-error | unknown"
    fields:
      - field: "status"
        tokenType: code

  patient:
    type: reference
    description: "Patient information, if the resource is affixed to a person"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "patient.reference"
        referenceType: full

  type:
    type: token
    description: "The type of the device"
    fields:
      - field: "_search.typeCode"
        tokenType: code

  identifier:
    type: token
    description: "Instance id from manufacturer, owner, and others"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  _id:
    type: token
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  patient:
    source: patient
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: patient.reference
        target_field: patientId
        datatype: string
        extractType: id

  type:
    source: type
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: type.coding[*].code
        target_field: typeCode
        datatype: array[string]

  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - patient
        reference_type: Patient
        include_self: false
        datatype: array[string]

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_r4_dev_compartment_patient
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_r4_dev_status
