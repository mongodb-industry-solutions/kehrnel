resource: DeviceDispense
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec DeviceDispense)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: none — DeviceDispense is not listed in any R5 compartment
#   definition (see compartments/definitions/*.json).
#
# Total parameters: 7 (5 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `device` is required CodeableReference — `code` searches
#     `device.concept`.
#   * `patient` is a Patient/* shortcut on `subject`.
#   * `subject` may reference Patient or Practitioner.

search_parameters:
  code:
    type: token
    description: "Search for devices that match this code"
    fields:
      - field: "_search.deviceConcept_systemCode"
        tokenType: systemCode
      - field: "_search.deviceConcept_codes"
        tokenType: code

  identifier:
    type: token
    description: "The identifier of the dispense"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  patient:
    type: reference
    description: "Returns device dispenses for a specific patient"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  status:
    type: token
    description: "The status of the dispense"
    fields:
      - field: "status"
        tokenType: code

  subject:
    type: reference
    description: "The identity of a patient for whom to list dispenses"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  device_concept:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: device.concept.coding[*].code
        target_field: deviceConcept_codes
        datatype: array[string]
      - source_path: device.concept.coding[*]
        target_field: deviceConcept_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient

indexes:
  - fields:
      - "status": 1
    options:
      name: idx_status
  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true
  - fields:
      - "_search.deviceConcept_codes": 1
    options:
      name: idx_device_concept_codes
      sparse: true
  - fields:
      - "_search.identifier_values": 1
    options:
      name: idx_identifier_values
      sparse: true
  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
