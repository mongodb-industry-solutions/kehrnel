resource: MedicinalProductInteraction
fhir_version: R4

search_parameters:
  type:
    type: token
    description: "Type of MedicinalProductInteraction"
    fields:
      - field: "_search.typeCode"
        tokenType: code
      - field: "_search.typeSystemCode"
        tokenType: systemCode
  patient:
    type: reference
    description: "Patient for MedicinalProductInteraction"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full
  subject:
    type: reference
    description: "Subject of MedicinalProductInteraction"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code
  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  type:
    source: type
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: type.coding[*].code
        target_field: typeCode
        datatype: array[string]
      - source_path: type
        target_field: typeSystemCode
        datatype: array[string]
  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
        reference_type: Patient
        include_self: false
        datatype: array[string]

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_r4_mdcnlp_compartment_patient
      sparse: true
  - fields:
      - "_search.typeCode": 1
    options:
      name: idx_r4_mdcnlp_type
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_r4_mdcnlp_updated
