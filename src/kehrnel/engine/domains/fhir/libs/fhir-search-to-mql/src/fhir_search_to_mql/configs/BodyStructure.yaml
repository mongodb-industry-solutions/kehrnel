resource: BodyStructure
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec BodyStructure)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/patient.json
#
# Total parameters: 7 (5 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `includedStructure[]` and `excludedStructure[]` are BackboneElements
#     with nested `structure` CodeableConcept.
#   * `patient` is required Reference(Patient).

search_parameters:
  patient:
    type: reference
    description: "Who this is about"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "patient.reference"
        referenceType: full

  identifier:
    type: token
    description: "Bodystructure identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  morphology:
    type: token
    description: "Kind of Structure"
    fields:
      - field: "_search.morphology_systemCode"
        tokenType: systemCode
      - field: "_search.morphology_codes"
        tokenType: code

  included_structure:
    type: token
    description: "Body site includedStructure structure"
    fields:
      - field: "_search.includedStructure_systemCode"
        tokenType: systemCode
      - field: "_search.includedStructure_codes"
        tokenType: code

  excluded_structure:
    type: token
    description: "Body site excludedStructure structure"
    fields:
      - field: "_search.excludedStructure_systemCode"
        tokenType: systemCode
      - field: "_search.excludedStructure_codes"
        tokenType: code

  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  morphology:
    source: morphology
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: morphology.coding[*].code
        target_field: morphology_codes
        datatype: array[string]
      - source_path: morphology.coding[*]
        target_field: morphology_systemCode
        datatype: array[string]

  included_structure:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: includedStructure[*].structure.coding[*].code
        target_field: includedStructure_codes
        datatype: array[string]
      - source_path: includedStructure[*].structure.coding[*]
        target_field: includedStructure_systemCode
        datatype: array[string]

  excluded_structure:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: excludedStructure[*].structure.coding[*].code
        target_field: excludedStructure_codes
        datatype: array[string]
      - source_path: excludedStructure[*].structure.coding[*]
        target_field: excludedStructure_systemCode
        datatype: array[string]

  patient:
    source: patient
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: patient.reference
        target_field: patientId
        datatype: string
        extractType: id

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: "Patient compartment (patient.json linking param patient)"

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_search.patientId": 1
    options:
      name: idx_patient_id
      sparse: true
  - fields:
      - "_search.morphology_codes": 1
    options:
      name: idx_morphology_codes
      sparse: true
  - fields:
      - "_search.includedStructure_codes": 1
    options:
      name: idx_included_structure_codes
      sparse: true
  - fields:
      - "_search.identifier_values": 1
    options:
      name: idx_identifier_values
      sparse: true
  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
