resource: Patient
fhir_version: R4

# US Core Patient Profile: http://hl7.org/fhir/us/core/StructureDefinition/us-core-patient
# FHIR R4 Patient search parameters: https://www.hl7.org/fhir/R4/patient.html#search
# US Core adds: race, ethnicity, birthsex extensions; _profile search

search_parameters:
  name:
    type: string
    description: "A server-defined search that may match any of the string fields in the HumanName"
    fields:
      default:
        - field: "_search.familyName_lower"
          query_type: range
        - field: "_search.givenNames_lower"
          query_type: range
        - field: "_search.fullName_lower"
          query_type: range
      exact:
        - field: "_search.familyName"
        - field: "_search.givenNames"
        - field: "_search.fullName"

  family:
    type: string
    description: "A portion of the family name of the patient"
    fields:
      default:
        - field: "_search.familyName_lower"
          query_type: range
      exact:
        - field: "_search.familyName"

  given:
    type: string
    description: "A portion of the given name of the patient"
    fields:
      default:
        - field: "_search.givenNames_lower"
          query_type: range
      exact:
        - field: "_search.givenNames"

  gender:
    type: token
    description: "Gender of the patient"
    fields:
      - field: "gender"
        tokenType: code

  birthdate:
    type: date
    description: "The patient's date of birth"
    fields:
      - field: "birthDate"
        type: date

  identifier:
    type: token
    description: "A patient identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  email:
    type: token
    description: "A value in an email contact"
    fields:
      - field: "_search.email"
        tokenType: code

  phone:
    type: token
    description: "A value in a phone contact"
    fields:
      - field: "_search.phone"
        tokenType: code

  address:
    type: string
    description: "A server-defined search that may match any of the string fields in the Address"
    fields:
      default:
        - field: "_search.addressFull_lower"
          query_type: range
      exact:
        - field: "_search.addressFull"

  address-city:
    type: string
    description: "A city specified in an address"
    fields:
      default:
        - field: "_search.addressCity_lower"
          query_type: range
      exact:
        - field: "_search.addressCity"

  address-state:
    type: string
    description: "A state specified in an address"
    fields:
      default:
        - field: "_search.addressState_lower"
          query_type: range
      exact:
        - field: "_search.addressState"

  address-postalcode:
    type: string
    description: "A postal code specified in an address"
    fields:
      - field: "_search.addressPostalCode"
        query_type: exact

  active:
    type: token
    description: "Whether the patient record is active"
    fields:
      - field: "active"
        tokenType: boolean

  deceased:
    type: token
    description: "This patient has been marked as deceased, or has a death date entered"
    fields:
      - field: "_search.deceased"
        tokenType: boolean

  death-date:
    type: date
    description: "The date of death has been provided and satisfies this search value"
    fields:
      - field: "_search.deathDate"
        type: date

  language:
    type: token
    description: "Language code (irrespective of use value)"
    fields:
      - field: "_search.language"
        tokenType: code

  general-practitioner:
    type: reference
    description: "Patient's nominated general practitioner"
    fields:
      - field: "_search.generalPractitionerId"
        referenceType: id
      - field: "generalPractitioner.reference"
        referenceType: full

  organization:
    type: reference
    description: "The organization that is the custodian of the patient record"
    fields:
      - field: "_search.managingOrganizationId"
        referenceType: id
      - field: "managingOrganization.reference"
        referenceType: full

  link:
    type: reference
    description: "All patients/related persons linked to the given patient"
    fields:
      - field: "_search.linkOtherId"
        referenceType: id
      - field: "link.other.reference"
        referenceType: full

  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  name:
    source: name
    target: _search
    extractor: HumanNameExtractor
    field_mappings:
      - source_path: name[*].family
        target_field: familyName
        datatype: array[string]
      - source_path: name[*].family
        target_field: familyName_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: name[*].given
        target_field: givenNames
        datatype: array[string]
      - source_path: name[*].given
        target_field: givenNames_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: name[*]
        target_field: fullName
        datatype: array[string]
      - source_path: name[*]
        target_field: fullName_lower
        datatype: array[string]
        normalize: lowercase

  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  telecom:
    source: telecom
    target: _search
    extractor: ContactPointExtractor
    field_mappings:
      - source_path: telecom[*].value
        target_field: email
        datatype: array[string]
        normalize: lowercase
      - source_path: telecom[*].value
        target_field: phone
        datatype: array[string]
      - source_path: telecom[*].value
        target_field: telecom_values
        datatype: array[string]
      - source_path: telecom[*]
        target_field: telecom_systemCode
        datatype: array[string]

  address:
    source: address
    target: _search
    extractor: AddressExtractor
    field_mappings:
      - source_path: address[*]
        target_field: addressFull
        datatype: array[string]
      - source_path: address[*]
        target_field: addressFull_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: address[*].city
        target_field: addressCity
        datatype: array[string]
      - source_path: address[*].city
        target_field: addressCity_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: address[*].state
        target_field: addressState
        datatype: array[string]
      - source_path: address[*].state
        target_field: addressState_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: address[*].postalCode
        target_field: addressPostalCode
        datatype: array[string]

  deceased:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: deceasedBoolean
        target_field: deceased
        datatype: boolean
      - source_path: deceasedDateTime
        target_field: deceased
        datatype: boolean
        transform: presence
      - source_path: deceasedDateTime
        target_field: deathDate
        datatype: date

  communication:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: communication[*].language.coding[*].code
        target_field: language
        datatype: array[string]

  generalPractitioner:
    source: generalPractitioner
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: generalPractitioner[*].reference
        target_field: generalPractitionerId
        datatype: array[string]
        extractType: id

  managingOrganization:
    source: managingOrganization
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: managingOrganization.reference
        target_field: managingOrganizationId
        datatype: string
        extractType: id

  link:
    source: link
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: link[*].other.reference
        target_field: linkOtherId
        datatype: array[string]
        extractType: id

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - link[*].other
        reference_type: Patient
        include_self: true
        datatype: array[string]
      - target_field: Practitioner
        source_paths:
          - generalPractitioner
        reference_type: Practitioner
        datatype: array[string]

compartments:
  precomputed:
    - Patient
    - Practitioner

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_r4_compartment_patient
      sparse: true
  - fields:
      - "_search.familyName_lower": 1
    options:
      name: idx_r4_family_name_lower
  - fields:
      - "birthDate": 1
    options:
      name: idx_r4_birth_date
  - fields:
      - "_search.identifier_systemCode": 1
    options:
      name: idx_r4_identifier_system_code
  - fields:
      - "gender": 1
    options:
      name: idx_r4_gender
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_r4_last_updated
