resource: Measure
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec Measure)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: none — not listed in compartments/definitions/*.json
#
# Total parameters: 24 (19 resource-specific shipped + 2 common:
# `_id`, `_lastUpdated`). Composite `context-type-quantity`,
# `context-type-value`, and quantity `context-quantity` are deferred
# (use `context`, `context-type`, and non-quantity params directly).
#
# R5 structural notes:
#   * `relatedArtifact[]` powers composed-of / depends-on / derived-from /
#     predecessor / successor reference searches (filtered by artifact type).
#   * `depends-on` also searches `library[]` canonical references.
#   * `useContext[]` powers `context` and `context-type` token searches.
#   * `effectivePeriod` powers `effective` date overlap search.
#   * Top-level scalar `status` and token `version` query FHIR root.

search_parameters:
  composed-of:
    type: reference
    description: "What resource is being referenced (composed-of relatedArtifact)"
    fields:
      - field: "_search.composedOfIds"
        referenceType: id
      - field: "_search.composedOfTypes"
        referenceType: type

  context:
    type: token
    description: "A use context assigned to the measure"
    fields:
      - field: "_search.context_codes"
        tokenType: code

  context-type:
    type: token
    description: "A type of use context assigned to the measure"
    fields:
      - field: "_search.contextType_codes"
        tokenType: code

  date:
    type: date
    description: "The measure publication date"
    fields:
      - field: "date"
        type: date

  depends-on:
    type: reference
    description: "What resource is being referenced (depends-on relatedArtifact or library)"
    fields:
      - field: "_search.dependsOnIds"
        referenceType: id
      - field: "_search.dependsOnTypes"
        referenceType: type
      - field: "_search.library_values"
        referenceType: full

  derived-from:
    type: reference
    description: "What resource is being referenced (derived-from relatedArtifact)"
    fields:
      - field: "_search.derivedFromIds"
        referenceType: id
      - field: "_search.derivedFromTypes"
        referenceType: type

  description:
    type: string
    description: "Natural language description of the measure"
    fields:
      default:
        - field: "_search.description_lower"
          query_type: range
      exact:
        - field: "_search.description"

  effective:
    type: date
    description: "The time during which the measure is intended to be in use"
    fields:
      - field: "_search.effectivePeriod"
        type: period

  identifier:
    type: token
    description: "External identifiers for the measure"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  jurisdiction:
    type: token
    description: "Intended jurisdiction for the measure"
    fields:
      - field: "_search.jurisdiction_systemCode"
        tokenType: systemCode
      - field: "_search.jurisdiction_codes"
        tokenType: code

  name:
    type: string
    description: "Name for this measure (computer friendly)"
    fields:
      default:
        - field: "_search.name_lower"
          query_type: range
      exact:
        - field: "_search.name"

  predecessor:
    type: reference
    description: "What resource is being referenced (predecessor relatedArtifact)"
    fields:
      - field: "_search.predecessorIds"
        referenceType: id
      - field: "_search.predecessorTypes"
        referenceType: type

  publisher:
    type: string
    description: "Name of the publisher of the measure"
    fields:
      default:
        - field: "_search.publisher_lower"
          query_type: range
      exact:
        - field: "_search.publisher"

  status:
    type: token
    description: "The current status of the measure"
    fields:
      - field: "status"
        tokenType: code

  successor:
    type: reference
    description: "What resource is being referenced (successor relatedArtifact)"
    fields:
      - field: "_search.successorIds"
        referenceType: id
      - field: "_search.successorTypes"
        referenceType: type

  title:
    type: string
    description: "Name for this measure (human friendly)"
    fields:
      default:
        - field: "_search.title_lower"
          query_type: range
      exact:
        - field: "_search.title"

  topic:
    type: token
    description: "Topics associated with the measure"
    fields:
      - field: "_search.topic_systemCode"
        tokenType: systemCode
      - field: "_search.topic_codes"
        tokenType: code

  url:
    type: uri
    description: "The uri that identifies the measure"
    fields:
      - field: "url"

  version:
    type: token
    description: "The business version of the measure"
    fields:
      - field: "version"
        tokenType: code

  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  jurisdiction:
    source: jurisdiction
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: jurisdiction[*].coding[*].code
        target_field: jurisdiction_codes
        datatype: array[string]
      - source_path: jurisdiction[*].coding[*]
        target_field: jurisdiction_systemCode
        datatype: array[string]

  topic:
    source: topic
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: topic[*].coding[*].code
        target_field: topic_codes
        datatype: array[string]
      - source_path: topic[*].coding[*]
        target_field: topic_systemCode
        datatype: array[string]

  use_context_value:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: useContext[*].valueCodeableConcept.coding[*].code
        target_field: context_codes
        datatype: array[string]

  use_context_type:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: useContext[*].code.code
        target_field: contextType_codes
        datatype: array[string]

  effective_period:
    source: effectivePeriod
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: start
        target_field: effectivePeriod
        datatype: object

  library:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: library[*]
        target_field: library_values
        datatype: array[string]

  related_artifact_composed_of:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - relatedArtifactType: composed-of
        target_field: composedOfIds
        datatype: array[string]
        extractType: id
      - relatedArtifactType: composed-of
        target_field: composedOfTypes
        datatype: array[string]
        extractType: type

  related_artifact_depends_on:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - relatedArtifactType: depends-on
        target_field: dependsOnIds
        datatype: array[string]
        extractType: id
      - relatedArtifactType: depends-on
        target_field: dependsOnTypes
        datatype: array[string]
        extractType: type

  related_artifact_derived_from:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - relatedArtifactType: derived-from
        target_field: derivedFromIds
        datatype: array[string]
        extractType: id
      - relatedArtifactType: derived-from
        target_field: derivedFromTypes
        datatype: array[string]
        extractType: type

  related_artifact_predecessor:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - relatedArtifactType: predecessor
        target_field: predecessorIds
        datatype: array[string]
        extractType: id
      - relatedArtifactType: predecessor
        target_field: predecessorTypes
        datatype: array[string]
        extractType: type

  related_artifact_successor:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - relatedArtifactType: successor
        target_field: successorIds
        datatype: array[string]
        extractType: id
      - relatedArtifactType: successor
        target_field: successorTypes
        datatype: array[string]
        extractType: type

  description:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: description
        target_field: description
        datatype: string
      - source_path: description
        target_field: description_lower
        datatype: string
        normalize: lowercase

  name:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: name
        target_field: name
        datatype: string
      - source_path: name
        target_field: name_lower
        datatype: string
        normalize: lowercase

  publisher:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: publisher
        target_field: publisher
        datatype: string
      - source_path: publisher
        target_field: publisher_lower
        datatype: string
        normalize: lowercase

  title:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: title
        target_field: title
        datatype: string
      - source_path: title
        target_field: title_lower
        datatype: string
        normalize: lowercase

indexes:
  - fields:
      - "status": 1
    options:
      name: idx_status

  - fields:
      - "url": 1
    options:
      name: idx_url
      sparse: true

  - fields:
      - "version": 1
    options:
      name: idx_version
      sparse: true

  - fields:
      - "_search.dependsOnIds": 1
    options:
      name: idx_depends_on_ids
      sparse: true

  - fields:
      - "_search.composedOfIds": 1
    options:
      name: idx_composed_of_ids
      sparse: true

  - fields:
      - "_search.context_codes": 1
    options:
      name: idx_context_codes
      sparse: true

  - fields:
      - "_search.jurisdiction_codes": 1
    options:
      name: idx_jurisdiction_codes
      sparse: true

  - fields:
      - "date": 1
    options:
      name: idx_date
      sparse: true

  - fields:
      - "_search.effectivePeriod.start": 1
      - "_search.effectivePeriod.end": 1
    options:
      name: idx_effective_period
      sparse: true

  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
