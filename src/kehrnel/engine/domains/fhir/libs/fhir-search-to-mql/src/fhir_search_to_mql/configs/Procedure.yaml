resource: Procedure
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec Procedure)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, device.json, encounter.json
#
# Total parameters: 19 (17 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `Procedure.subject` is required Reference(Patient | Group | Device |
#     Organization | Practitioner | Location); `patient` is the Patient/*
#     shortcut on subject.
#   * `Procedure.performer[]` is BackboneElement with `actor` (Reference);
#     `performer` search targets `performer.actor`.
#   * `Procedure.reason[]` is CodeableReference — `reason-code` searches
#     `.concept`, `reason-reference` searches `.reference`.
#   * `Procedure.occurrence[x]` is polymorphic (dateTime | Period | Timing |
#     Age | Range | string). `date` uses `occurrenceDateTime` and
#     `_search.occurrencePeriod` for interval overlap; Timing and other
#     variants are not denormalized for search.
#   * `Procedure.code` is CodeableConcept (0..1); `category` is
#     CodeableConcept[].
#   * Top-level scalar `status` queries the FHIR root field directly.
#   * `instantiatesCanonical` is canonical[]; `instantiates-uri` is uri[].

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  based-on:
    type: reference
    description: "A request for this procedure"
    fields:
      - field: "_search.basedOnIds"
        referenceType: id
      - field: "_search.basedOnTypes"
        referenceType: type
      - field: "basedOn.reference"
        referenceType: full

  encounter:
    type: reference
    description: "The Encounter during which this Procedure was created"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  instantiates-canonical:
    type: reference
    description: "Instantiates FHIR protocol or definition"
    fields:
      - field: "_search.instantiatesCanonical_values"
        referenceType: full
      - field: "instantiatesCanonical"
        referenceType: full

  location:
    type: reference
    description: "Where the procedure happened"
    fields:
      - field: "_search.locationId"
        referenceType: id
      - field: "_search.locationType"
        referenceType: type
      - field: "location.reference"
        referenceType: full

  part-of:
    type: reference
    description: "Part of referenced event"
    fields:
      - field: "_search.partOfIds"
        referenceType: id
      - field: "_search.partOfTypes"
        referenceType: type
      - field: "partOf.reference"
        referenceType: full

  patient:
    type: reference
    description: "Search by subject when Patient"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  performer:
    type: reference
    description: "Who performed the procedure"
    fields:
      - field: "_search.performerIds"
        referenceType: id
      - field: "_search.performerTypes"
        referenceType: type
      - field: "performer.actor.reference"
        referenceType: full

  reason-reference:
    type: reference
    description: "Reference to a resource (by instance)"
    fields:
      - field: "_search.reasonReferenceIds"
        referenceType: id
      - field: "_search.reasonReferenceTypes"
        referenceType: type

  report:
    type: reference
    description: "Any report resulting from the procedure"
    fields:
      - field: "_search.reportIds"
        referenceType: id
      - field: "_search.reportTypes"
        referenceType: type
      - field: "report.reference"
        referenceType: full

  subject:
    type: reference
    description: "Search by subject"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  category:
    type: token
    description: "Classification of the procedure"
    fields:
      - field: "_search.category_systemCode"
        tokenType: systemCode
      - field: "_search.category_codes"
        tokenType: code

  code:
    type: token
    description: "A code to identify a procedure"
    fields:
      - field: "_search.code_systemCode"
        tokenType: systemCode
      - field: "_search.code_codes"
        tokenType: code

  identifier:
    type: token
    description: "A unique identifier for a procedure"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  reason-code:
    type: token
    description: "Reference to a concept (by class)"
    fields:
      - field: "_search.reasonCode_systemCode"
        tokenType: systemCode
      - field: "_search.reasonCode_codes"
        tokenType: code

  status:
    type: token
    description: "preparation | in-progress | not-done | on-hold | stopped | completed | entered-in-error | unknown"
    fields:
      - field: "status"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  date:
    type: date
    description: "When the procedure occurred or is occurring"
    fields:
      - field: "occurrenceDateTime"
        type: date
      - field: "_search.occurrencePeriod"
        type: period

  # ─────────────────────────────────────────────────────────────
  # URI Parameters
  # ─────────────────────────────────────────────────────────────
  instantiates-uri:
    type: uri
    description: "Instantiates external protocol or definition"
    fields:
      - field: "_search.instantiatesUri_values"
      - field: "instantiatesUri"

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

# Denormalization Configuration
denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  category:
    source: category
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: category[*].coding[*].code
        target_field: category_codes
        datatype: array[string]
      - source_path: category[*].coding[*]
        target_field: category_systemCode
        datatype: array[string]

  code:
    source: code
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: code.coding[*].code
        target_field: code_codes
        datatype: array[string]
      - source_path: code.coding[*]
        target_field: code_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  location:
    source: location
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: location.reference
        target_field: locationId
        datatype: string
        extractType: id
      - source_path: location.reference
        target_field: locationType
        datatype: string
        extractType: type

  basedOn:
    source: basedOn
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: basedOn[*].reference
        target_field: basedOnIds
        datatype: array[string]
        extractType: id
      - source_path: basedOn[*].reference
        target_field: basedOnTypes
        datatype: array[string]
        extractType: type

  partOf:
    source: partOf
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: partOf[*].reference
        target_field: partOfIds
        datatype: array[string]
        extractType: id
      - source_path: partOf[*].reference
        target_field: partOfTypes
        datatype: array[string]
        extractType: type

  performer:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: performer[*].actor.reference
        target_field: performerIds
        datatype: array[string]
        extractType: id
      - source_path: performer[*].actor.reference
        target_field: performerTypes
        datatype: array[string]
        extractType: type

  reason_concept:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: reason[*].concept.coding[*].code
        target_field: reasonCode_codes
        datatype: array[string]
      - source_path: reason[*].concept.coding[*]
        target_field: reasonCode_systemCode
        datatype: array[string]

  reason_reference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: reason[*].reference.reference
        target_field: reasonReferenceIds
        datatype: array[string]
        extractType: id
      - source_path: reason[*].reference.reference
        target_field: reasonReferenceTypes
        datatype: array[string]
        extractType: type

  report:
    source: report
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: report[*].reference
        target_field: reportIds
        datatype: array[string]
        extractType: id
      - source_path: report[*].reference
        target_field: reportTypes
        datatype: array[string]
        extractType: type

  instantiates_canonical:
    source: instantiatesCanonical
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: instantiatesCanonical[*]
        target_field: instantiatesCanonical_values
        datatype: array[string]

  instantiates_uri:
    source: instantiatesUri
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: instantiatesUri[*]
        target_field: instantiatesUri_values
        datatype: array[string]

  occurrence_period:
    source: occurrencePeriod
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: start
        target_field: occurrencePeriod
        datatype: object
        comment: "Nested Period for `date` overlap queries"

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
          - performer[*].actor
        reference_type: Patient
        datatype: array[string]
        comment: |
          Patient compartment (patient.json linking params patient,
          subject, performer). Patient/* on subject and performer.actor.
      - target_field: Practitioner
        source_paths:
          - performer[*].actor
          - performer
        reference_type: Practitioner
        datatype: array[string]
        comment: "Practitioner compartment (performer.actor where Practitioner/*)"
      - target_field: Device
        source_paths:
          - performer[*].actor
          - performer
        reference_type: Device
        datatype: array[string]
        comment: "Device compartment (performer.actor where Device/*)"
      - target_field: Encounter
        source_paths:
          - encounter
        reference_type: Encounter
        datatype: array[string]
        comment: "Encounter compartment (encounter linking param)"

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Device
    - Encounter

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true
  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true

  - fields:
      - "status": 1
    options:
      name: idx_status

  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true

  - fields:
      - "_search.encounterId": 1
    options:
      name: idx_encounter_id
      sparse: true

  - fields:
      - "occurrenceDateTime": 1
    options:
      name: idx_occurrence_datetime
      sparse: true

  - fields:
      - "_search.occurrencePeriod.start": 1
      - "_search.occurrencePeriod.end": 1
    options:
      name: idx_occurrence_period
      sparse: true

  - fields:
      - "_search.identifier_values": 1
    options:
      name: idx_identifier_values
      sparse: true

  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
