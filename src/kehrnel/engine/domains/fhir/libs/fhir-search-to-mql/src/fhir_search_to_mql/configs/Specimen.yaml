resource: Specimen
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec Specimen)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, device.json (both linking param subject)
#
# Total parameters: 14 (12 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `Specimen.subject` may reference Patient, Device, Group, etc.;
#     `patient` is the Patient/* shortcut.
#   * `Specimen.collection` backbone holds `collector`, `procedure`,
#     `bodySite` (CodeableReference), and `collectedDateTime` /
#     `collectedPeriod` (R5 split; search param `collected` is union).
#   * `container-device` searches `container[*].device` where Device/*.
#   * `accessionIdentifier` is a single Identifier (token search).
#   * Top-level scalar `status` and `type` query the FHIR root.

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  bodysite:
    type: reference
    description: "Anatomical collection site (BodyStructure reference)"
    fields:
      - field: "_search.bodySiteReferenceIds"
        referenceType: id
      - field: "_search.bodySiteReferenceTypes"
        referenceType: type

  collector:
    type: reference
    description: "Who collected the specimen"
    fields:
      - field: "_search.collectorId"
        referenceType: id
      - field: "_search.collectorType"
        referenceType: type
      - field: "collection.collector.reference"
        referenceType: full

  container-device:
    type: reference
    description: "The device associated with the specimen container"
    fields:
      - field: "_search.containerDeviceIds"
        referenceType: id
      - field: "_search.containerDeviceTypes"
        referenceType: type

  parent:
    type: reference
    description: "The parent of the specimen"
    fields:
      - field: "_search.parentIds"
        referenceType: id
      - field: "_search.parentTypes"
        referenceType: type

  patient:
    type: reference
    description: "The patient the specimen comes from"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  procedure:
    type: reference
    description: "The procedure that collected the specimen"
    fields:
      - field: "_search.procedureId"
        referenceType: id
      - field: "_search.procedureType"
        referenceType: type
      - field: "collection.procedure.reference"
        referenceType: full

  subject:
    type: reference
    description: "The subject of the specimen"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  accession:
    type: token
    description: "The accession number associated with the specimen"
    fields:
      - field: "_search.accession_systemCode"
        tokenType: systemCode
      - field: "_search.accession_values"
        tokenType: code

  identifier:
    type: token
    description: "The unique identifier associated with the specimen"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  status:
    type: token
    description: "available | unavailable | unsatisfactory | entered-in-error"
    fields:
      - field: "status"
        tokenType: code

  type:
    type: token
    description: "The specimen type"
    fields:
      - field: "_search.type_systemCode"
        tokenType: systemCode
      - field: "_search.type_codes"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  collected:
    type: date
    description: "The date the specimen was collected"
    fields:
      - field: "collection.collectedDateTime"
        type: date
      - field: "_search.collectedPeriod"
        type: period

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  accession:
    source: accessionIdentifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: accessionIdentifier.value
        target_field: accession_values
        datatype: array[string]
      - source_path: accessionIdentifier
        target_field: accession_systemCode
        datatype: array[string]

  type:
    source: type
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: type.coding[*].code
        target_field: type_codes
        datatype: array[string]
      - source_path: type.coding[*]
        target_field: type_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  parent:
    source: parent
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: parent[*].reference
        target_field: parentIds
        datatype: array[string]
        extractType: id
      - source_path: parent[*].reference
        target_field: parentTypes
        datatype: array[string]
        extractType: type

  collector:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: collection.collector.reference
        target_field: collectorId
        datatype: string
        extractType: id
      - source_path: collection.collector.reference
        target_field: collectorType
        datatype: string
        extractType: type

  procedure:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: collection.procedure.reference
        target_field: procedureId
        datatype: string
        extractType: id
      - source_path: collection.procedure.reference
        target_field: procedureType
        datatype: string
        extractType: type

  body_site_reference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: collection.bodySite.reference.reference
        target_field: bodySiteReferenceIds
        datatype: array[string]
        extractType: id
      - source_path: collection.bodySite.reference.reference
        target_field: bodySiteReferenceTypes
        datatype: array[string]
        extractType: type

  container_device:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: container[*].device.reference
        target_field: containerDeviceIds
        datatype: array[string]
        extractType: id
        filterType: Device
        comment: "Device/* container devices — powers `container-device`"
      - source_path: container[*].device.reference
        target_field: containerDeviceTypes
        datatype: array[string]
        extractType: type
        filterType: Device

  collected_period:
    source: $resource
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: collection.collectedPeriod.start
        target_field: collectedPeriod
        datatype: object
        comment: "Nested Period for `collected` overlap queries"

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: "Patient compartment (patient.json linking param subject)"
      - target_field: Device
        source_paths:
          - subject
        reference_type: Device
        datatype: array[string]
        comment: "Device compartment (device.json linking param subject)"

compartments:
  precomputed:
    - Patient
    - Device

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_status
  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true
  - fields:
      - "_search.patientId": 1
    options:
      name: idx_patient_id
      sparse: true
  - fields:
      - "_search.type_codes": 1
    options:
      name: idx_type_codes
      sparse: true
  - fields:
      - "collection.collectedDateTime": 1
    options:
      name: idx_collected_date_time
      sparse: true
  - fields:
      - "_search.collectorId": 1
    options:
      name: idx_collector_id
      sparse: true
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
