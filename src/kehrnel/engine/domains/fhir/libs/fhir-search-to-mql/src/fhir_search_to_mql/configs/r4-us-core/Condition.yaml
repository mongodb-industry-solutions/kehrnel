resource: Condition
fhir_version: R4
profile: us-core

# US Core Condition profiles: us-core-condition-problems-health-concerns, us-core-condition-encounter-diagnosis
# FHIR R4 Condition search parameters: https://www.hl7.org/fhir/R4/condition.html#search
# R4 note: subject is plain Reference (not CodeableReference)

search_parameters:
  clinical-status:
    type: token
    description: "The clinical status of the condition"
    fields:
      - field: "_search.clinicalStatusCode"
        tokenType: code

  verification-status:
    type: token
    description: "The verification status to support the clinical status of the condition"
    fields:
      - field: "_search.verificationStatusCode"
        tokenType: code

  category:
    type: token
    description: "The category of the condition"
    fields:
      - field: "_search.categoryCode"
        tokenType: code

  code:
    type: token
    description: "Code for the condition"
    fields:
      - field: "_search.codeCode"
        tokenType: code
      - field: "_search.codeSystemCode"
        tokenType: systemCode

  patient:
    type: reference
    description: "Who has the condition?"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  subject:
    type: reference
    description: "Who has the condition?"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  encounter:
    type: reference
    description: "Encounter created as part of"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  onset-date:
    type: date
    description: "Date related onsets (dateTime and Period)"
    fields:
      - field: "_search.onsetDate"
        type: date

  recorded-date:
    type: date
    description: "Date record was first recorded"
    fields:
      - field: "_search.recordedDate"
        type: date

  severity:
    type: token
    description: "The severity of the condition"
    fields:
      - field: "_search.severityCode"
        tokenType: code

  _profile:
    type: uri
    description: "US Core profile URL this resource conforms to (e.g. us-core-condition-problems-health-concerns)"
    fields:
      - field: "meta.profile"

  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  clinicalStatus:
    source: clinicalStatus
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: clinicalStatus.coding[*].code
        target_field: clinicalStatusCode
        datatype: array[string]

  verificationStatus:
    source: verificationStatus
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: verificationStatus.coding[*].code
        target_field: verificationStatusCode
        datatype: array[string]

  category:
    source: category
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: category[*].coding[*].code
        target_field: categoryCode
        datatype: array[string]

  code:
    source: code
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: code.coding[*].code
        target_field: codeCode
        datatype: array[string]
      - source_path: code
        target_field: codeSystemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  onset:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: onsetDateTime
        target_field: onsetDate
        datatype: date

  recordedDate:
    source: recordedDate
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: recordedDate
        target_field: recordedDate
        datatype: date

  severity:
    source: severity
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: severity.coding[*].code
        target_field: severityCode
        datatype: array[string]

  meta_profile:
    source: meta
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: profile
        target_field: meta_profile
        datatype: array[string]
        comment: "US Core profile URLs from meta.profile (stamped by fhir-gen --profile-pack us-core)"

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
        reference_type: Patient
        include_self: false
        datatype: array[string]

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_r4_cond_compartment_patient
      sparse: true
  - fields:
      - "_search.clinicalStatusCode": 1
    options:
      name: idx_r4_cond_clinical_status
  - fields:
      - "_search.codeCode": 1
    options:
      name: idx_r4_cond_code
  - fields:
      - "meta.profile": 1
    options:
      name: idx_r4_us_cond_meta_profile
      sparse: true
