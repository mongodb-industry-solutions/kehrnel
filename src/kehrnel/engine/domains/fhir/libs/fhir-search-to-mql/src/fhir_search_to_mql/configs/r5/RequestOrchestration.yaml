resource: RequestOrchestration
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec RequestOrchestration)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, device.json, encounter.json,
#   relatedperson.json
#
# Total parameters: 17 (15 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `participant` searches nested `action[].participant[]` actors
#     (Reference and canonical arms).
#   * `patient` is the Patient/* shortcut over `subject`.
#   * Top-level scalars `status`, `intent`, `priority` query root fields.

search_parameters:
  author:
    type: reference
    description: "The author of the request orchestration"
    fields:
      - field: "_search.authorId"
        referenceType: id
      - field: "_search.authorType"
        referenceType: type
      - field: "author.reference"
        referenceType: full

  authored:
    type: date
    description: "The date the request orchestration was authored"
    fields:
      - field: "authoredOn"
        type: date

  based-on:
    type: reference
    description: "What this request fulfills"
    fields:
      - field: "_search.basedOnIds"
        referenceType: id
      - field: "_search.basedOnTypes"
        referenceType: type
      - field: "basedOn.reference"
        referenceType: full

  code:
    type: token
    description: "The code of the request orchestration"
    fields:
      - field: "_search.code_systemCode"
        tokenType: systemCode
      - field: "_search.code_codes"
        tokenType: code

  encounter:
    type: reference
    description: "The encounter the request orchestration applies to"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  group-identifier:
    type: token
    description: "The group identifier for the request orchestration"
    fields:
      - field: "_search.groupIdentifier_systemCode"
        tokenType: systemCode
      - field: "_search.groupIdentifier_values"
        tokenType: code

  identifier:
    type: token
    description: "External identifiers for the request orchestration"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  instantiates-canonical:
    type: reference
    description: "The FHIR-based definition from which the request orchestration is realized"
    fields:
      - field: "_search.instantiatesCanonical_values"
        referenceType: full
      - field: "instantiatesCanonical"
        referenceType: full

  instantiates-uri:
    type: uri
    description: "The external definition from which the request orchestration is realized"
    fields:
      - field: "_search.instantiatesUri_values"
      - field: "instantiatesUri"

  intent:
    type: token
    description: "The intent of the request orchestration"
    fields:
      - field: "intent"
        tokenType: code

  participant:
    type: reference
    description: "The participant in the requests in the orchestration"
    fields:
      - field: "_search.participantIds"
        referenceType: id
      - field: "_search.participantTypes"
        referenceType: type
      - field: "_search.participantCanonical_values"
        referenceType: full

  patient:
    type: reference
    description: "The identity of a patient to search for request orchestrations"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  priority:
    type: token
    description: "The priority of the request orchestration"
    fields:
      - field: "priority"
        tokenType: code

  status:
    type: token
    description: "The status of the request orchestration"
    fields:
      - field: "status"
        tokenType: code

  subject:
    type: reference
    description: "The subject that the request orchestration is about"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  group_identifier:
    source: groupIdentifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: groupIdentifier.value
        target_field: groupIdentifier_values
        datatype: array[string]
      - source_path: groupIdentifier
        target_field: groupIdentifier_systemCode
        datatype: array[string]

  code:
    source: code
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: code.coding[*].code
        target_field: code_codes
        datatype: array[string]
      - source_path: code.coding[*]
        target_field: code_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient

  author:
    source: author
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: author.reference
        target_field: authorId
        datatype: string
        extractType: id
      - source_path: author.reference
        target_field: authorType
        datatype: string
        extractType: type

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  based_on:
    source: basedOn
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: basedOn[*].reference
        target_field: basedOnIds
        datatype: array[string]
        extractType: id
      - source_path: basedOn[*].reference
        target_field: basedOnTypes
        datatype: array[string]
        extractType: type

  instantiates_canonical:
    source: instantiatesCanonical
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: instantiatesCanonical[*]
        target_field: instantiatesCanonical_values
        datatype: array[string]

  instantiates_uri:
    source: instantiatesUri
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: instantiatesUri[*]
        target_field: instantiatesUri_values
        datatype: array[string]

  action_participant:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: action[*].participant[*].actorReference.reference
        target_field: participantIds
        datatype: array[string]
        extractType: id
      - source_path: action[*].participant[*].actorReference.reference
        target_field: participantTypes
        datatype: array[string]
        extractType: type

  action_participant_canonical:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: action[*].participant[*].actorCanonical
        target_field: participantCanonical_values
        datatype: array[string]

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
      - target_field: Practitioner
        source_paths:
          - author
          - participant
          - action[*].participant[*].actorReference
        reference_type: Practitioner
        datatype: array[string]
      - target_field: Device
        source_paths:
          - author
          - participant
          - action[*].participant[*].actorReference
        reference_type: Device
        datatype: array[string]
      - target_field: RelatedPerson
        source_paths:
          - author
          - participant
          - action[*].participant[*].actorReference
        reference_type: RelatedPerson
        datatype: array[string]
      - target_field: Encounter
        source_paths:
          - encounter
        reference_type: Encounter
        datatype: array[string]

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Device
    - Encounter
    - RelatedPerson

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true
  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true
  - fields:
      - "_compartments.RelatedPerson": 1
    options:
      name: idx_compartment_relatedperson
      sparse: true

  - fields:
      - "status": 1
    options:
      name: idx_status
  - fields:
      - "intent": 1
    options:
      name: idx_intent
      sparse: true

  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true

  - fields:
      - "_search.authorId": 1
    options:
      name: idx_author_id
      sparse: true

  - fields:
      - "_search.participantIds": 1
    options:
      name: idx_participant_ids
      sparse: true

  - fields:
      - "_search.basedOnIds": 1
    options:
      name: idx_based_on_ids
      sparse: true

  - fields:
      - "authoredOn": 1
    options:
      name: idx_authored_on
      sparse: true

  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
