resource: DeviceUsage
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec DeviceUsage)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, relatedperson.json, device.json
#
# Total parameters: 6 (4 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `device` is required CodeableReference — `device` search targets
#     `device.concept` only (no device-reference search param).
#   * `patient` is required Reference(Patient).

search_parameters:
  device:
    type: token
    description: "Search by device (concept arm of CodeableReference)"
    fields:
      - field: "_search.deviceConcept_systemCode"
        tokenType: systemCode
      - field: "_search.deviceConcept_codes"
        tokenType: code

  identifier:
    type: token
    description: "Search by identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  patient:
    type: reference
    description: "Search by patient who used / uses the device"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "patient.reference"
        referenceType: full

  status:
    type: token
    description: "The status of the device usage"
    fields:
      - field: "status"
        tokenType: code

  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  device_concept:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: device.concept.coding[*].code
        target_field: deviceConcept_codes
        datatype: array[string]
      - source_path: device.concept.coding[*]
        target_field: deviceConcept_systemCode
        datatype: array[string]

  device_reference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: device.reference.reference
        target_field: deviceIds
        datatype: array[string]
        extractType: id

  patient:
    source: patient
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: patient.reference
        target_field: patientId
        datatype: string
        extractType: id

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - patient
        reference_type: Patient
        datatype: array[string]
      - target_field: Practitioner
        source_paths:
          - patient
        reference_type: Practitioner
        datatype: array[string]
        comment: "Practitioner compartment (practitioner.json linking param patient)"
      - target_field: Device
        source_paths:
          - device.reference
        reference_type: Device
        datatype: array[string]

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Device

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_status
  - fields:
      - "_search.patientId": 1
    options:
      name: idx_patient_id
      sparse: true
  - fields:
      - "_search.deviceConcept_codes": 1
    options:
      name: idx_device_concept_codes
      sparse: true
  - fields:
      - "_search.deviceIds": 1
    options:
      name: idx_device_ids
      sparse: true
  - fields:
      - "_search.identifier_values": 1
    options:
      name: idx_identifier_values
      sparse: true
  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
