resource: Communication
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec Communication)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, device.json, encounter.json,
#   relatedperson.json
#
# Total parameters: 18 (16 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `Communication.subject` is Reference(Patient | Group); `patient`
#     is the Patient/* shortcut.
#   * `sender` is a single Reference; `recipient[]` is plural.
#   * `category[]` and `medium[]` are CodeableConcept arrays; `topic`
#     is a single CodeableConcept.
#   * `instantiatesCanonical` is canonical[]; `instantiates-uri` is uri[].
#   * Top-level scalar `status` queries the FHIR root.
#   * `sent` and `received` are root dateTime fields.

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  based-on:
    type: reference
    description: "Request fulfilled by this communication"
    fields:
      - field: "_search.basedOnIds"
        referenceType: id
      - field: "_search.basedOnTypes"
        referenceType: type
      - field: "basedOn.reference"
        referenceType: full

  encounter:
    type: reference
    description: "Encounter created as part of"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  instantiates-canonical:
    type: reference
    description: "Instantiates FHIR protocol or definition"
    fields:
      - field: "_search.instantiatesCanonical_values"
        referenceType: full
      - field: "instantiatesCanonical"
        referenceType: full

  part-of:
    type: reference
    description: "Part of this action"
    fields:
      - field: "_search.partOfIds"
        referenceType: id
      - field: "_search.partOfTypes"
        referenceType: type
      - field: "partOf.reference"
        referenceType: full

  patient:
    type: reference
    description: "Focus of this communication when Patient"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  recipient:
    type: reference
    description: "Message recipient"
    fields:
      - field: "_search.recipientIds"
        referenceType: id
      - field: "_search.recipientTypes"
        referenceType: type
      - field: "recipient.reference"
        referenceType: full

  sender:
    type: reference
    description: "Message sender"
    fields:
      - field: "_search.senderId"
        referenceType: id
      - field: "_search.senderType"
        referenceType: type
      - field: "sender.reference"
        referenceType: full

  subject:
    type: reference
    description: "Focus of this communication"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  category:
    type: token
    description: "Message category"
    fields:
      - field: "_search.category_systemCode"
        tokenType: systemCode
      - field: "_search.category_codes"
        tokenType: code

  identifier:
    type: token
    description: "Unique identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  medium:
    type: token
    description: "Communication medium"
    fields:
      - field: "_search.medium_systemCode"
        tokenType: systemCode
      - field: "_search.medium_codes"
        tokenType: code

  status:
    type: token
    description: "preparation | in-progress | not-done | on-hold | stopped | completed | entered-in-error | unknown"
    fields:
      - field: "status"
        tokenType: code

  topic:
    type: token
    description: "Description of the purpose/content"
    fields:
      - field: "_search.topic_systemCode"
        tokenType: systemCode
      - field: "_search.topic_codes"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  received:
    type: date
    description: "When received"
    fields:
      - field: "received"
        type: date

  sent:
    type: date
    description: "When sent"
    fields:
      - field: "sent"
        type: date

  # ─────────────────────────────────────────────────────────────
  # URI Parameters
  # ─────────────────────────────────────────────────────────────
  instantiates-uri:
    type: uri
    description: "Instantiates external protocol or definition"
    fields:
      - field: "_search.instantiatesUri_values"
      - field: "instantiatesUri"

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  category:
    source: category
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: category[*].coding[*].code
        target_field: category_codes
        datatype: array[string]
      - source_path: category[*].coding[*]
        target_field: category_systemCode
        datatype: array[string]

  medium:
    source: medium
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: medium[*].coding[*].code
        target_field: medium_codes
        datatype: array[string]
      - source_path: medium[*].coding[*]
        target_field: medium_systemCode
        datatype: array[string]

  topic:
    source: topic
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: topic.coding[*].code
        target_field: topic_codes
        datatype: array[string]
      - source_path: topic.coding[*]
        target_field: topic_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  sender:
    source: sender
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: sender.reference
        target_field: senderId
        datatype: string
        extractType: id
      - source_path: sender.reference
        target_field: senderType
        datatype: string
        extractType: type

  recipient:
    source: recipient
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: recipient[*].reference
        target_field: recipientIds
        datatype: array[string]
        extractType: id
      - source_path: recipient[*].reference
        target_field: recipientTypes
        datatype: array[string]
        extractType: type

  based_on:
    source: basedOn
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: basedOn[*].reference
        target_field: basedOnIds
        datatype: array[string]
        extractType: id
      - source_path: basedOn[*].reference
        target_field: basedOnTypes
        datatype: array[string]
        extractType: type

  part_of:
    source: partOf
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: partOf[*].reference
        target_field: partOfIds
        datatype: array[string]
        extractType: id
      - source_path: partOf[*].reference
        target_field: partOfTypes
        datatype: array[string]
        extractType: type

  instantiates_canonical:
    source: instantiatesCanonical
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: instantiatesCanonical[*]
        target_field: instantiatesCanonical_values
        datatype: array[string]

  instantiates_uri:
    source: instantiatesUri
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: instantiatesUri[*]
        target_field: instantiatesUri_values
        datatype: array[string]

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - sender
          - recipient
        reference_type: Patient
        datatype: array[string]
        comment: |
          Patient compartment (patient.json linking params subject,
          sender, recipient). Patient/* refs only.
      - target_field: Practitioner
        source_paths:
          - sender
          - recipient
        reference_type: Practitioner
        datatype: array[string]
        comment: "Practitioner compartment (sender, recipient)"
      - target_field: Device
        source_paths:
          - sender
          - recipient
        reference_type: Device
        datatype: array[string]
        comment: "Device compartment (sender, recipient)"
      - target_field: Encounter
        source_paths:
          - encounter
        reference_type: Encounter
        datatype: array[string]
        comment: "Encounter compartment (encounter linking param)"

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Encounter
    - Device

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_status
  - fields:
      - "_search.patientId": 1
    options:
      name: idx_patient_id
      sparse: true
  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true
  - fields:
      - "_search.encounterId": 1
    options:
      name: idx_encounter_id
      sparse: true
  - fields:
      - "_search.senderId": 1
    options:
      name: idx_sender_id
      sparse: true
  - fields:
      - "_search.recipientIds": 1
    options:
      name: idx_recipient_ids
      sparse: true
  - fields:
      - "_search.category_codes": 1
    options:
      name: idx_category_codes
      sparse: true
  - fields:
      - "sent": 1
    options:
      name: idx_sent
      sparse: true
  - fields:
      - "received": 1
    options:
      name: idx_received
      sparse: true
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
