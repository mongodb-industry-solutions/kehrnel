resource: Encounter
fhir_version: R4
profile: us-core

# US Core Encounter Profile: http://hl7.org/fhir/us/core/StructureDefinition/us-core-encounter
# FHIR R4 Encounter search parameters: https://www.hl7.org/fhir/R4/encounter.html#search
# R4 structural notes:
#   - Encounter.class is a single Coding (not array of CodeableConcept as in R5)
#   - Encounter.period (not actualPeriod as in R5)
#   - Encounter.participant[].individual (not actor as in R5)

search_parameters:
  status:
    type: token
    description: "planned | arrived | triaged | in-progress | onleave | finished | cancelled"
    fields:
      - field: "status"
        tokenType: code

  class:
    type: token
    description: "Classification of patient encounter (R4: single Coding)"
    fields:
      - field: "_search.classCode"
        tokenType: code
      - field: "_search.classSystemCode"
        tokenType: systemCode

  type:
    type: token
    description: "Specific type of encounter"
    fields:
      - field: "_search.typeCode"
        tokenType: code

  patient:
    type: reference
    description: "The patient or group present at the encounter"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  subject:
    type: reference
    description: "The patient or group present at the encounter"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  participant:
    type: reference
    description: "Persons involved in the encounter other than the patient"
    fields:
      - field: "_search.participantId"
        referenceType: id

  date:
    type: date
    description: "A date within the period the Encounter lasted"
    fields:
      - field: "_search.periodStart"
        type: date

  service-provider:
    type: reference
    description: "The organization (facility) responsible for this encounter"
    fields:
      - field: "_search.serviceProviderId"
        referenceType: id
      - field: "serviceProvider.reference"
        referenceType: full

  identifier:
    type: token
    description: "Identifier(s) by which this encounter is known"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  _profile:
    type: uri
    description: "US Core profile URL this resource conforms to (e.g. us-core-encounter)"
    fields:
      - field: "meta.profile"

  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  # R4: Encounter.class is a single Coding (not array of CodeableConcept)
  class:
    source: class
    target: _search
    extractor: CodingExtractor
    field_mappings:
      - source_path: class.code
        target_field: classCode
        datatype: string
      - source_path: class
        target_field: classSystemCode
        datatype: string

  type:
    source: type
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: type[*].coding[*].code
        target_field: typeCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id

  # R4: participant[].individual (not actor)
  participant:
    source: participant
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: participant[*].individual.reference
        target_field: participantId
        datatype: array[string]
        extractType: id

  # R4: Encounter.period (not actualPeriod)
  period:
    source: period
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: period.start
        target_field: periodStart
        datatype: date
      - source_path: period.end
        target_field: periodEnd
        datatype: date

  serviceProvider:
    source: serviceProvider
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: serviceProvider.reference
        target_field: serviceProviderId
        datatype: string
        extractType: id

  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  meta_profile:
    source: meta
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: profile
        target_field: meta_profile
        datatype: array[string]
        comment: "US Core profile URLs from meta.profile (stamped by fhir-gen --profile-pack us-core)"

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
        reference_type: Patient
        include_self: false
        datatype: array[string]
      - target_field: Practitioner
        source_paths:
          - participant[*].individual
        reference_type: Practitioner
        datatype: array[string]

compartments:
  precomputed:
    - Patient
    - Practitioner

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_r4_enc_compartment_patient
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_r4_enc_status
  - fields:
      - "_search.classCode": 1
    options:
      name: idx_r4_enc_class
  - fields:
      - "_search.periodStart": -1
    options:
      name: idx_r4_enc_period_start
  - fields:
      - "meta.profile": 1
    options:
      name: idx_r4_us_enc_meta_profile
      sparse: true
