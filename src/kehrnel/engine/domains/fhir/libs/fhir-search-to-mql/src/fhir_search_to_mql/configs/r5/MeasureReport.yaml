resource: MeasureReport
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec MeasureReport)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, relatedperson.json
#
# Total parameters: 12 (10 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `patient` is the Patient/* shortcut over `subject`.
#   * `measure` is canonical — searched as a reference URI/canonical.
#   * `period` is required Period at resource root.
#   * Top-level scalar `status` queries the FHIR root.

search_parameters:
  date:
    type: date
    description: "The date of the measure report"
    fields:
      - field: "date"
        type: date

  evaluated-resource:
    type: reference
    description: "An evaluated resource referenced by the measure report"
    fields:
      - field: "_search.evaluatedResourceIds"
        referenceType: id
      - field: "_search.evaluatedResourceTypes"
        referenceType: type

  identifier:
    type: token
    description: "External identifier of the measure report to be returned"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  location:
    type: reference
    description: "The location to return measure report results for"
    fields:
      - field: "_search.locationId"
        referenceType: id
      - field: "location.reference"
        referenceType: full

  measure:
    type: reference
    description: "The measure to return measure report results for"
    fields:
      - field: "_search.measureCanonical_values"
        referenceType: full
      - field: "measure"
        referenceType: full

  patient:
    type: reference
    description: "The identity of a patient to search for individual measure report results for"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  period:
    type: date
    description: "The period of the measure report"
    fields:
      - field: "_search.period"
        type: period

  reporter:
    type: reference
    description: "The reporter to return measure report results for"
    fields:
      - field: "_search.reporterId"
        referenceType: id
      - field: "_search.reporterType"
        referenceType: type
      - field: "reporter.reference"
        referenceType: full

  status:
    type: token
    description: "The status of the measure report"
    fields:
      - field: "status"
        tokenType: code

  subject:
    type: reference
    description: "The identity of a subject to search for individual measure report results for"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient

  reporter:
    source: reporter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: reporter.reference
        target_field: reporterId
        datatype: string
        extractType: id
      - source_path: reporter.reference
        target_field: reporterType
        datatype: string
        extractType: type

  location:
    source: location
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: location.reference
        target_field: locationId
        datatype: string
        extractType: id

  measure_canonical:
    source: measure
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: measure
        target_field: measureCanonical_values
        datatype: string

  evaluated_resource:
    source: evaluatedResource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: evaluatedResource[*].reference
        target_field: evaluatedResourceIds
        datatype: array[string]
        extractType: id
      - source_path: evaluatedResource[*].reference
        target_field: evaluatedResourceTypes
        datatype: array[string]
        extractType: type

  report_period:
    source: period
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: start
        target_field: period
        datatype: object

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
      - target_field: Practitioner
        source_paths:
          - reporter
        reference_type: Practitioner
        datatype: array[string]
      - target_field: RelatedPerson
        source_paths:
          - reporter
        reference_type: RelatedPerson
        datatype: array[string]

compartments:
  precomputed:
    - Patient
    - Practitioner
    - RelatedPerson

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.RelatedPerson": 1
    options:
      name: idx_compartment_relatedperson
      sparse: true

  - fields:
      - "status": 1
    options:
      name: idx_status

  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true

  - fields:
      - "_search.reporterId": 1
    options:
      name: idx_reporter_id
      sparse: true

  - fields:
      - "_search.evaluatedResourceIds": 1
    options:
      name: idx_evaluated_resource_ids
      sparse: true

  - fields:
      - "date": 1
    options:
      name: idx_date
      sparse: true

  - fields:
      - "_search.period.start": 1
      - "_search.period.end": 1
    options:
      name: idx_period
      sparse: true

  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
