resource: List
fhir_version: R4

search_parameters:
  status:
    type: token
    description: "List status"
    fields:
      - field: "status"
        tokenType: code
  code:
    type: token
    description: "Code for List"
    fields:
      - field: "_search.codeCode"
        tokenType: code
      - field: "_search.codeSystemCode"
        tokenType: systemCode
  patient:
    type: reference
    description: "Patient for List"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full
  subject:
    type: reference
    description: "Subject of List"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full
  encounter:
    type: reference
    description: "Encounter for List"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full
  date:
    type: date
    description: "Date for List"
    fields:
      - field: "_search.date"
        type: date
  identifier:
    type: token
    description: "Identifier for List"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code
  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  code:
    source: code
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: code.coding[*].code
        target_field: codeCode
        datatype: array[string]
      - source_path: code
        target_field: codeSystemCode
        datatype: array[string]
  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id
  date:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: date
        target_field: date
        datatype: date
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]
  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
        reference_type: Patient
        include_self: false
        datatype: array[string]

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_r4_list_compartment_patient
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_r4_list_status
  - fields:
      - "_search.date": -1
    options:
      name: idx_r4_list_date
  - fields:
      - "_search.codeCode": 1
    options:
      name: idx_r4_list_code
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_r4_list_updated
