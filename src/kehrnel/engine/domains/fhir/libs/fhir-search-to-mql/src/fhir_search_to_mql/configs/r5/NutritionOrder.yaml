resource: NutritionOrder
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec NutritionOrder)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, encounter.json
#
# Total parameters: 14 (12 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `NutritionOrder.subject` is required Reference(Patient | Group);
#     `patient` is the Patient/* shortcut.
#   * `NutritionOrder.orderer` powers the `provider` search parameter.
#   * `groupIdentifier` is a single Identifier (token search).
#   * `additive` / `formula` / `supplement` token params search
#     CodeableReference `.concept`; `oraldiet` searches `oralDiet.type[]`.
#   * Top-level scalar `status` queries the FHIR root.
#   * `datetime` searches root `dateTime`.

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  encounter:
    type: reference
    description: "Return nutrition orders with this encounter identifier"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  patient:
    type: reference
    description: "The patient who requires the diet, formula or supplement"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  provider:
    type: reference
    description: "The provider who placed the nutrition order"
    fields:
      - field: "_search.providerId"
        referenceType: id
      - field: "_search.providerType"
        referenceType: type
      - field: "orderer.reference"
        referenceType: full

  subject:
    type: reference
    description: "The identity of the individual or group who requires the order"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  additive:
    type: token
    description: "Type of module component to add to the feeding"
    fields:
      - field: "_search.additiveConcept_systemCode"
        tokenType: systemCode
      - field: "_search.additiveConcept_codes"
        tokenType: code

  formula:
    type: token
    description: "Type of enteral or infant formula"
    fields:
      - field: "_search.formulaConcept_systemCode"
        tokenType: systemCode
      - field: "_search.formulaConcept_codes"
        tokenType: code

  group-identifier:
    type: token
    description: "Composite Request ID"
    fields:
      - field: "_search.groupIdentifier_systemCode"
        tokenType: systemCode
      - field: "_search.groupIdentifier_values"
        tokenType: code

  identifier:
    type: token
    description: "Return nutrition orders with this external identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  oraldiet:
    type: token
    description: "Type of diet that can be consumed orally"
    fields:
      - field: "_search.oralDietType_systemCode"
        tokenType: systemCode
      - field: "_search.oralDietType_codes"
        tokenType: code

  status:
    type: token
    description: "Status of the nutrition order"
    fields:
      - field: "status"
        tokenType: code

  supplement:
    type: token
    description: "Type of supplement product requested"
    fields:
      - field: "_search.supplementConcept_systemCode"
        tokenType: systemCode
      - field: "_search.supplementConcept_codes"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  datetime:
    type: date
    description: "Return nutrition orders requested on this date"
    fields:
      - field: "dateTime"
        type: date

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  group_identifier:
    source: groupIdentifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: groupIdentifier.value
        target_field: groupIdentifier_values
        datatype: array[string]
      - source_path: groupIdentifier
        target_field: groupIdentifier_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  orderer:
    source: orderer
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: orderer.reference
        target_field: providerId
        datatype: string
        extractType: id
      - source_path: orderer.reference
        target_field: providerType
        datatype: string
        extractType: type

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  additive_concept:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: enteralFormula.additive[*].type.concept.coding[*].code
        target_field: additiveConcept_codes
        datatype: array[string]
      - source_path: enteralFormula.additive[*].type.concept.coding[*]
        target_field: additiveConcept_systemCode
        datatype: array[string]

  formula_concept:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: enteralFormula.baseFormulaType.concept.coding[*].code
        target_field: formulaConcept_codes
        datatype: array[string]
      - source_path: enteralFormula.baseFormulaType.concept.coding[*]
        target_field: formulaConcept_systemCode
        datatype: array[string]

  oral_diet_type:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: oralDiet.type[*].coding[*].code
        target_field: oralDietType_codes
        datatype: array[string]
      - source_path: oralDiet.type[*].coding[*]
        target_field: oralDietType_systemCode
        datatype: array[string]

  supplement_concept:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: supplement[*].type.concept.coding[*].code
        target_field: supplementConcept_codes
        datatype: array[string]
      - source_path: supplement[*].type.concept.coding[*]
        target_field: supplementConcept_systemCode
        datatype: array[string]

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: "Patient compartment (patient.json linking param patient)"
      - target_field: Practitioner
        source_paths:
          - orderer
          - provider
        reference_type: Practitioner
        datatype: array[string]
        comment: "Practitioner compartment (provider → orderer)"
      - target_field: Encounter
        source_paths:
          - encounter
        reference_type: Encounter
        datatype: array[string]
        comment: "Encounter compartment (encounter linking param)"

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Encounter

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_status
  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true
  - fields:
      - "_search.encounterId": 1
    options:
      name: idx_encounter_id
      sparse: true
  - fields:
      - "_search.providerId": 1
    options:
      name: idx_provider_id
      sparse: true
  - fields:
      - "dateTime": 1
    options:
      name: idx_date_time
      sparse: true
  - fields:
      - "_search.oralDietType_codes": 1
    options:
      name: idx_oral_diet_type_codes
      sparse: true
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
