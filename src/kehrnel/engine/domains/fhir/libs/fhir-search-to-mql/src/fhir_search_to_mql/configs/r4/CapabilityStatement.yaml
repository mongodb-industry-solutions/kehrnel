resource: CapabilityStatement
fhir_version: R4

search_parameters:
  status:
    type: token
    description: "CapabilityStatement status"
    fields:
      - field: "status"
        tokenType: code
  date:
    type: date
    description: "Date for CapabilityStatement"
    fields:
      - field: "_search.date"
        type: date
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code
  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  date:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: date
        target_field: date
        datatype: date

indexes:
  - fields:
      - "status": 1
    options:
      name: idx_r4_cpblty_status
  - fields:
      - "_search.date": -1
    options:
      name: idx_r4_cpblty_date
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_r4_cpblty_updated
