resource: RiskAssessment
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec RiskAssessment)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, encounter.json
#
# Total parameters: 12 (10 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `RiskAssessment.subject` is required Reference(Patient | Group);
#     `patient` is the Patient/* shortcut.
#   * `occurrence[x]` is polymorphic — `date` searches
#     `occurrenceDateTime` only (not `occurrencePeriod`).
#   * `prediction[]` backbone: `probability` uses `probabilityDecimal`;
#     `risk` searches `prediction.qualitativeRisk`.
#   * `performer` is a single Reference (Practitioner, Patient, etc.).

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  condition:
    type: reference
    description: "Condition assessed for risk"
    fields:
      - field: "_search.conditionId"
        referenceType: id
      - field: "condition.reference"
        referenceType: full

  encounter:
    type: reference
    description: "Encounter during which the assessment was made"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  patient:
    type: reference
    description: "Who/what the assessment is about (Patient subject)"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  performer:
    type: reference
    description: "Who performed the assessment"
    fields:
      - field: "_search.performerId"
        referenceType: id
      - field: "_search.performerType"
        referenceType: type
      - field: "performer.reference"
        referenceType: full

  subject:
    type: reference
    description: "Who/what the assessment is about"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  identifier:
    type: token
    description: "Business identifier for this risk assessment"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  method:
    type: token
    description: "Evaluation mechanism"
    fields:
      - field: "_search.method_systemCode"
        tokenType: systemCode
      - field: "_search.method_codes"
        tokenType: code

  risk:
    type: token
    description: "Likelihood of specified outcome (qualitative)"
    fields:
      - field: "_search.risk_systemCode"
        tokenType: systemCode
      - field: "_search.risk_codes"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Number Parameters
  # ─────────────────────────────────────────────────────────────
  probability:
    type: number
    description: "Likelihood of specified outcome (decimal probability)"
    fields:
      - field: "_search.probabilityDecimal_values"

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  date:
    type: date
    description: "When was assessment made (occurrenceDateTime)"
    fields:
      - field: "occurrenceDateTime"
        type: date

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  method:
    source: method
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: method.coding[*].code
        target_field: method_codes
        datatype: array[string]
      - source_path: method.coding[*]
        target_field: method_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient

  performer:
    source: performer
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: performer.reference
        target_field: performerId
        datatype: string
        extractType: id
      - source_path: performer.reference
        target_field: performerType
        datatype: string
        extractType: type

  condition:
    source: condition
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: condition.reference
        target_field: conditionId
        datatype: string
        extractType: id

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  prediction_probability:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: prediction[*].probabilityDecimal
        target_field: probabilityDecimal_values
        datatype: array[decimal]

  prediction_risk:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: prediction[*].qualitativeRisk.coding[*].code
        target_field: risk_codes
        datatype: array[string]
      - source_path: prediction[*].qualitativeRisk.coding[*]
        target_field: risk_systemCode
        datatype: array[string]

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: "Patient compartment (patient.json linking params patient, subject)"
      - target_field: Encounter
        source_paths:
          - encounter
        reference_type: Encounter
        datatype: array[string]
        comment: "Encounter compartment (encounter.json linking param encounter)"

compartments:
  precomputed:
    - Patient
    - Encounter

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true
  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true
  - fields:
      - "_search.patientId": 1
    options:
      name: idx_patient_id
      sparse: true
  - fields:
      - "_search.encounterId": 1
    options:
      name: idx_encounter_id
      sparse: true
  - fields:
      - "_search.conditionId": 1
    options:
      name: idx_condition_id
      sparse: true
  - fields:
      - "_search.risk_codes": 1
    options:
      name: idx_risk_codes
      sparse: true
  - fields:
      - "_search.probabilityDecimal_values": 1
    options:
      name: idx_probability_decimal
      sparse: true
  - fields:
      - "occurrenceDateTime": 1
    options:
      name: idx_occurrence_date_time
      sparse: true
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_last_updated
