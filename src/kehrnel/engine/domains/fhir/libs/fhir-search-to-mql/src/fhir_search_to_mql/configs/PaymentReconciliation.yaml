resource: PaymentReconciliation
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec PaymentReconciliation)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   practitioner.json
#
# Total parameters: 12 (10 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `amount` and `type` are required; not searchable in R5 index.
#   * `allocation[]` backbone drives `allocation-account` and
#     `allocation-encounter` reference search params.
#   * `disposition` is a root string with `:exact` modifier support.
#   * Top-level scalars `status`, `outcome`, and `created` query the root.

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  allocation-account:
    type: reference
    description: "The account to which payment or adjustment was applied"
    fields:
      - field: "_search.allocationAccountIds"
        referenceType: id
      - field: "_search.allocationAccountTypes"
        referenceType: type
      - field: "allocation.account.reference"
        referenceType: full

  allocation-encounter:
    type: reference
    description: "The encounter to which payment or adjustment was applied"
    fields:
      - field: "_search.allocationEncounterIds"
        referenceType: id
      - field: "_search.allocationEncounterTypes"
        referenceType: type
      - field: "allocation.encounter.reference"
        referenceType: full

  payment-issuer:
    type: reference
    description: "The organization which generated this resource"
    fields:
      - field: "_search.paymentIssuerId"
        referenceType: id
      - field: "_search.paymentIssuerType"
        referenceType: type
      - field: "paymentIssuer.reference"
        referenceType: full

  request:
    type: reference
    description: "The reference to the claim"
    fields:
      - field: "_search.requestId"
        referenceType: id
      - field: "_search.requestType"
        referenceType: type
      - field: "request.reference"
        referenceType: full

  requestor:
    type: reference
    description: "The reference to the provider who submitted the claim"
    fields:
      - field: "_search.requestorId"
        referenceType: id
      - field: "_search.requestorType"
        referenceType: type
      - field: "requestor.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  identifier:
    type: token
    description: "The business identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  outcome:
    type: token
    description: "The processing outcome"
    fields:
      - field: "outcome"
        tokenType: code

  status:
    type: token
    description: "active | cancelled | draft | entered-in-error"
    fields:
      - field: "status"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # String Parameters
  # ─────────────────────────────────────────────────────────────
  disposition:
    type: string
    description: "The contents of the disposition message"
    fields:
      default:
        - field: "_search.disposition_lower"
          query_type: range
      exact:
        - field: "_search.disposition"

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  created:
    type: date
    description: "The creation date"
    fields:
      - field: "created"
        type: date

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  disposition:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: disposition
        target_field: disposition
        datatype: string
      - source_path: disposition
        target_field: disposition_lower
        datatype: string
        normalize: lowercase

  payment_issuer:
    source: paymentIssuer
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: paymentIssuer.reference
        target_field: paymentIssuerId
        datatype: string
        extractType: id
      - source_path: paymentIssuer.reference
        target_field: paymentIssuerType
        datatype: string
        extractType: type

  request:
    source: request
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: request.reference
        target_field: requestId
        datatype: string
        extractType: id
      - source_path: request.reference
        target_field: requestType
        datatype: string
        extractType: type

  requestor:
    source: requestor
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: requestor.reference
        target_field: requestorId
        datatype: string
        extractType: id
      - source_path: requestor.reference
        target_field: requestorType
        datatype: string
        extractType: type

  allocation_account:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: allocation[*].account.reference
        target_field: allocationAccountIds
        datatype: array[string]
        extractType: id
        filterType: Account
      - source_path: allocation[*].account.reference
        target_field: allocationAccountTypes
        datatype: array[string]
        extractType: type
        filterType: Account

  allocation_encounter:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: allocation[*].encounter.reference
        target_field: allocationEncounterIds
        datatype: array[string]
        extractType: id
        filterType: Encounter
      - source_path: allocation[*].encounter.reference
        target_field: allocationEncounterTypes
        datatype: array[string]
        extractType: type
        filterType: Encounter

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Practitioner
        source_paths:
          - requestor
        reference_type: Practitioner
        datatype: array[string]
        comment: |
          Practitioner compartment (requestor linking param). Filtered
          to Practitioner/*; Organization/PractitionerRole omitted.

compartments:
