resource: QuestionnaireResponse
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec QuestionnaireResponse)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, device.json, encounter.json,
#   relatedperson.json
#
# Total parameters: 14 (12 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `questionnaire` is required canonical(Questionnaire).
#   * `subject` is Reference; `patient` is the Patient/* shortcut.
#   * `basedOn[]` and `partOf[]` are Reference arrays.
#   * `item-subject` searches answer Reference values on top-level items
#     carrying the questionnaireresponse-isSubject extension (R5 does not
#     repeat nested item trees in the FHIR expression).
#   * Top-level scalar `status` and `authored` query the FHIR root.

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  author:
    type: reference
    description: "The author of the questionnaire response"
    fields:
      - field: "_search.authorId"
        referenceType: id
      - field: "_search.authorType"
        referenceType: type
      - field: "author.reference"
        referenceType: full

  based-on:
    type: reference
    description: "Plan/proposal/order fulfilled by this questionnaire response"
    fields:
      - field: "_search.basedOnIds"
        referenceType: id
      - field: "_search.basedOnTypes"
        referenceType: type
      - field: "basedOn.reference"
        referenceType: full

  encounter:
    type: reference
    description: "Encounter associated with the questionnaire response"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  item-subject:
    type: reference
    description: "Item answer reference when item has isSubject extension"
    fields:
      - field: "_search.itemSubjectIds"
        referenceType: id
      - field: "_search.itemSubjectTypes"
        referenceType: type
      - field: "item.answer.valueReference.reference"
        referenceType: full

  part-of:
    type: reference
    description: "Procedure or observation this response was performed as part of"
    fields:
      - field: "_search.partOfIds"
        referenceType: id
      - field: "_search.partOfTypes"
        referenceType: type
      - field: "partOf.reference"
        referenceType: full

  patient:
    type: reference
    description: "The patient that is the subject of the questionnaire response"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  questionnaire:
    type: reference
    description: "The questionnaire the answers are provided for"
    fields:
      - field: "_search.questionnaire_values"
        referenceType: full
      - field: "questionnaire"
        referenceType: full

  source:
    type: reference
    description: "The individual providing the information in the response"
    fields:
      - field: "_search.sourceId"
        referenceType: id
      - field: "_search.sourceType"
        referenceType: type
      - field: "source.reference"
        referenceType: full

  subject:
    type: reference
    description: "The subject of the questionnaire response"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  identifier:
    type: token
    description: "The unique identifier for the questionnaire response"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  status:
    type: token
    description: "in-progress | completed | amended | entered-in-error | stopped"
    fields:
      - field: "status"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  authored:
    type: date
    description: "When the questionnaire response was last changed"
    fields:
      - field: "authored"
        type: date

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  author:
    source: author
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: author.reference
        target_field: authorId
        datatype: string
        extractType: id
      - source_path: author.reference
        target_field: authorType
        datatype: string
        extractType: type

  source:
    source: source
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: source.reference
        target_field: sourceId
        datatype: string
        extractType: id
      - source_path: source.reference
        target_field: sourceType
        datatype: string
        extractType: type

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  based_on:
    source: basedOn
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: basedOn[*].reference
        target_field: basedOnIds
        datatype: array[string]
        extractType: id
      - source_path: basedOn[*].reference
        target_field: basedOnTypes
        datatype: array[string]
        extractType: type

  part_of:
    source: partOf
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: partOf[*].reference
        target_field: partOfIds
        datatype: array[string]
        extractType: id
      - source_path: partOf[*].reference
        target_field: partOfTypes
        datatype: array[string]
        extractType: type

  questionnaire_canonical:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: questionnaire
        target_field: questionnaire_values
        datatype: string
        comment: "Required canonical — powers `questionnaire` reference search"

  item_subject:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: item[*].answer[*].valueReference.reference
        target_field: itemSubjectIds
        datatype: array[string]
        extractType: id
        comment: |
          Top-level item answer references. Per R5 `item-subject`, only items
          with questionnaireresponse-isSubject should carry valueReference.
      - source_path: item[*].answer[*].valueReference.reference
        target_field: itemSubjectTypes
        datatype: array[string]
        extractType: type

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
          - author
        reference_type: Patient
        datatype: array[string]
        comment: |
          Patient compartment (patient.json linking params subject, author).
      - target_field: Practitioner
        source_paths:
          - author
          - source
        reference_type: Practitioner
        datatype: array[string]
        comment: "Practitioner compartment (author, source linking params)"
      - target_field: Device
        source_paths:
          - author
          - source
        reference_type: Device
        datatype: array[string]
        comment: "Device compartment (author, source linking params)"
      - target_field: Encounter
        source_paths:
          - encounter
        reference_type: Encounter
        datatype: array[string]
        comment: "Encounter compartment (encounter linking param)"

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Encounter
    - Device

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_status
  - fields:
      - "_search.patientId": 1
    options:
      name: idx_patient_id
      sparse: true
  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true
  - fields:
      - "_search.encounterId": 1
    options:
      name: idx_encounter_id
      sparse: true
  - fields:
      - "_search.authorId": 1
    options:
      name: idx_author_id
      sparse: true
  - fields:
      - "_search.sourceId": 1
    options:
      name: idx_source_id
      sparse: true
  - fields:
      - "_search.questionnaire_values": 1
    options:
      name: idx_questionnaire
      sparse: true
  - fields:
      - "_search.basedOnIds": 1
    options:
      name: idx_based_on_ids
      sparse: true
  - fields:
      - "_search.partOfIds": 1
    options:
      name: idx_part_of_ids
      sparse: true
  - fields:
      - "_search.itemSubjectIds": 1
    options:
      name: idx_item_subject_ids
      sparse: true
  - fields:
      - "authored": 1
    options:
      name: idx_authored
      sparse: true
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
