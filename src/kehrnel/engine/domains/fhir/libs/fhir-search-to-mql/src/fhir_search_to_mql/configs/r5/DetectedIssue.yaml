resource: DetectedIssue
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec DetectedIssue)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, device.json, relatedperson.json
#
# Total parameters: 11 (9 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `subject` is Reference; `patient` is the Patient/* shortcut.
#   * `identified[x]` splits into `identifiedDateTime` and `identifiedPeriod`
#     (search param `identified` is a polymorphic date union).
#   * `category[]` and `implicated[]` are arrays.
#   * Top-level scalar `status` queries the FHIR root.

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  author:
    type: reference
    description: "The provider or device that identified the issue"
    fields:
      - field: "_search.authorId"
        referenceType: id
      - field: "_search.authorType"
        referenceType: type
      - field: "author.reference"
        referenceType: full

  implicated:
    type: reference
    description: "Problem resource"
    fields:
      - field: "_search.implicatedIds"
        referenceType: id
      - field: "_search.implicatedTypes"
        referenceType: type
      - field: "implicated.reference"
        referenceType: full

  patient:
    type: reference
    description: "Associated patient"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  subject:
    type: reference
    description: "Associated subject"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  category:
    type: token
    description: "Issue category, e.g. drug-drug, duplicate therapy"
    fields:
      - field: "_search.category_systemCode"
        tokenType: systemCode
      - field: "_search.category_codes"
        tokenType: code

  code:
    type: token
    description: "Issue type, e.g. drug-drug, duplicate therapy"
    fields:
      - field: "_search.code_systemCode"
        tokenType: systemCode
      - field: "_search.code_codes"
        tokenType: code

  identifier:
    type: token
    description: "Unique id for the detected issue"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  status:
    type: token
    description: "preliminary | final | entered-in-error | mitigated"
    fields:
      - field: "status"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  identified:
    type: date
    description: "When identified"
    fields:
      - field: "identifiedDateTime"
        type: date
      - field: "_search.identifiedPeriod"
        type: period

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  category:
    source: category
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: category[*].coding[*].code
        target_field: category_codes
        datatype: array[string]
      - source_path: category[*].coding[*]
        target_field: category_systemCode
        datatype: array[string]

  code:
    source: code
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: code.coding[*].code
        target_field: code_codes
        datatype: array[string]
      - source_path: code.coding[*]
        target_field: code_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  author:
    source: author
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: author.reference
        target_field: authorId
        datatype: string
        extractType: id
      - source_path: author.reference
        target_field: authorType
        datatype: string
        extractType: type

  implicated:
    source: implicated
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: implicated[*].reference
        target_field: implicatedIds
        datatype: array[string]
        extractType: id
      - source_path: implicated[*].reference
        target_field: implicatedTypes
        datatype: array[string]
        extractType: type

  identified_period:
    source: $resource
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: identifiedPeriod.start
        target_field: identifiedPeriod
        datatype: object
        comment: "Nested Period for `identified` overlap queries"

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: "Patient compartment (patient.json linking param patient)"
      - target_field: Practitioner
        source_paths:
          - author
        reference_type: Practitioner
        datatype: array[string]
        comment: "Practitioner compartment (author linking param)"
      - target_field: Device
        source_paths:
          - author
        reference_type: Device
        datatype: array[string]
        comment: "Device compartment (author linking param)"

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Device

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_status
  - fields:
      - "_search.patientId": 1
    options:
      name: idx_patient_id
      sparse: true
  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true
  - fields:
      - "_search.authorId": 1
    options:
      name: idx_author_id
      sparse: true
  - fields:
      - "_search.implicatedIds": 1
    options:
      name: idx_implicated_ids
      sparse: true
  - fields:
      - "_search.category_codes": 1
    options:
      name: idx_category_codes
      sparse: true
  - fields:
      - "_search.code_codes": 1
    options:
      name: idx_code_codes
      sparse: true
  - fields:
      - "identifiedDateTime": 1
    options:
      name: idx_identified_date_time
      sparse: true
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
