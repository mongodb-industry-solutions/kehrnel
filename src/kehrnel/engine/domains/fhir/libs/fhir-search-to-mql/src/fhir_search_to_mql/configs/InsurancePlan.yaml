resource: InsurancePlan
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec InsurancePlan)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: none — not listed in compartments/definitions/*.json
#
# Total parameters: 16 (14 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `name` parameter unions `name | alias` (same pattern as Organization).
#   * Address fields search `contact.address` (ExtendedContactDetail[]).
#   * Top-level scalar `status` queries the FHIR root.

search_parameters:
  address:
    type: string
    description: "A server defined search that matches any address field"
    fields:
      default:
        - field: "_search.addressFull_lower"
          query_type: range
      exact:
        - field: "_search.addressFull"

  address-city:
    type: string
    description: "A city specified in an address"
    fields:
      default:
        - field: "_search.addressCity_lower"
          query_type: range
      exact:
        - field: "_search.addressCity"

  address-country:
    type: string
    description: "A country specified in an address"
    fields:
      default:
        - field: "_search.addressCountry_lower"
          query_type: range
      exact:
        - field: "_search.addressCountry"

  address-postalcode:
    type: string
    description: "A postal code specified in an address"
    fields:
      - field: "_search.addressPostalCode"
        query_type: exact

  address-state:
    type: string
    description: "A state specified in an address"
    fields:
      default:
        - field: "_search.addressState_lower"
          query_type: range
      exact:
        - field: "_search.addressState"

  address-use:
    type: token
    description: "A use code specified in an address"
    fields:
      - field: "_search.addressUse"
        tokenType: code

  administered-by:
    type: reference
    description: "Product administrator"
    fields:
      - field: "_search.administeredById"
        referenceType: id
      - field: "administeredBy.reference"
        referenceType: full

  endpoint:
    type: reference
    description: "Technical endpoint"
    fields:
      - field: "_search.endpointIds"
        referenceType: id
      - field: "endpoint.reference"
        referenceType: full

  identifier:
    type: token
    description: "Business Identifier for the plan"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  name:
    type: string
    description: "A portion of the insurance plan's name or alias"
    fields:
      default:
        - field: "_search.name_lower"
          query_type: range
        - field: "_search.aliases_lower"
          query_type: range
        - field: "_search.nameAlias_lower"
          query_type: range
      exact:
        - field: "_search.name"
        - field: "_search.aliases"

  owned-by:
    type: reference
    description: "Product issuer"
    fields:
      - field: "_search.ownedById"
        referenceType: id
      - field: "ownedBy.reference"
        referenceType: full

  phonetic:
    type: token
    description: "A portion of the insurance plan's name using Soundex"
    fields:
      - field: "_search.phonetic_codes"
        tokenType: code

  status:
    type: token
    description: "The status of the insurance plan"
    fields:
      - field: "status"
        tokenType: code

  type:
    type: token
    description: "Type of plan"
    fields:
      - field: "_search.type_systemCode"
        tokenType: systemCode
      - field: "_search.type_codes"
        tokenType: code

  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  name:
    source: $resource
    target: _search
    extractor: TextExtractor
    field_mappings:
      - source_path: name
        target_field: name
        datatype: string
      - source_path: name
        target_field: name_lower
        datatype: string
        normalize: lowercase
      - source_path: alias[*]
        target_field: aliases
        datatype: array[string]
      - source_path: alias[*]
        target_field: aliases_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: name | alias[*]
        target_field: nameAlias_lower
        datatype: string
        normalize: lowercase
        separator: " "

  phonetic:
    source: $resource
    target: _search
    extractor: PhoneticExtractor
    field_mappings:
      - source_path: name | alias[*]
        target_field: phonetic_codes
        datatype: array[string]

  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  type:
    source: type
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: type[*].coding[*].code
        target_field: type_codes
        datatype: array[string]
      - source_path: type[*].coding[*]
        target_field: type_systemCode
        datatype: array[string]

  address:
    source: $resource
    target: _search
    extractor: AddressExtractor
    field_mappings:
      - source_path: contact[*].address
        target_field: addressFull
        datatype: array[string]
      - source_path: contact[*].address
        target_field: addressFull_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: contact[*].address.city
        target_field: addressCity
        datatype: array[string]
      - source_path: contact[*].address.city
        target_field: addressCity_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: contact[*].address.state
        target_field: addressState
        datatype: array[string]
      - source_path: contact[*].address.state
        target_field: addressState_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: contact[*].address.postalCode
        target_field: addressPostalCode
        datatype: array[string]
      - source_path: contact[*].address.country
        target_field: addressCountry
        datatype: array[string]
      - source_path: contact[*].address.country
        target_field: addressCountry_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: contact[*].address.use
        target_field: addressUse
        datatype: array[string]

  administeredBy:
    source: administeredBy
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: administeredBy.reference
        target_field: administeredById
        datatype: string
        extractType: id

  ownedBy:
    source: ownedBy
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: ownedBy.reference
        target_field: ownedById
        datatype: string
        extractType: id

  endpoint:
    source: endpoint
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: endpoint[*].reference
        target_field: endpointIds
        datatype: array[string]
        extractType: id

indexes:
  - fields:
      - "status": 1
    options:
      name: idx_status

  - fields:
      - "_search.name_lower": 1
    options:
      name: idx_name_lower
      sparse: true

  - fields:
      - "_search.type_codes": 1
    options:
      name: idx_type_codes
      sparse: true

  - fields:
      - "_search.ownedById": 1
    options:
      name: idx_owned_by_id
      sparse: true

  - fields:
      - "_search.administeredById": 1
    options:
      name: idx_administered_by_id
      sparse: true

  - fields:
      - "_search.identifier_systemCode": 1
    options:
      name: idx_identifier_system_code
      sparse: true

  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
