resource: Person
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec Person)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, relatedperson.json
#
# Total parameters: 25 (23 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * Demographics mirror Patient (name, telecom, address).
#   * `link[].target` powers `link`, `patient`, `practitioner`, and
#     `relatedperson` reference searches (filtered by resolve() type).
#   * `deceased[x]` is polymorphic (boolean | dateTime).
#   * `phonetic` uses Soundex codes in `_search.phonetic_codes`.

search_parameters:
  name:
    type: string
    description: "A server defined search that may match any of the string fields in the HumanName"
    fields:
      default:
        - field: "_search.familyName_lower"
          query_type: range
        - field: "_search.givenNames_lower"
          query_type: range
        - field: "_search.fullName_lower"
          query_type: range
      exact:
        - field: "_search.familyName"
        - field: "_search.givenNames"
        - field: "_search.fullName"
        - field: "_search.nameText"

  family:
    type: string
    description: "A portion of the family name of the person"
    fields:
      default:
        - field: "_search.familyName_lower"
          query_type: range
      exact:
        - field: "_search.familyName"

  given:
    type: string
    description: "A portion of the given name of the person"
    fields:
      default:
        - field: "_search.givenNames_lower"
          query_type: range
      exact:
        - field: "_search.givenNames"

  address:
    type: string
    description: "A server defined search that may match any of the string fields in the Address"
    fields:
      default:
        - field: "_search.addressFull_lower"
          query_type: range
      exact:
        - field: "_search.addressFull"
        - field: "_search.addressText"

  address-city:
    type: string
    description: "A city specified in an address"
    fields:
      default:
        - field: "_search.addressCity_lower"
          query_type: range
      exact:
        - field: "_search.addressCity"

  address-state:
    type: string
    description: "A state specified in an address"
    fields:
      default:
        - field: "_search.addressState_lower"
          query_type: range
      exact:
        - field: "_search.addressState"

  address-country:
    type: string
    description: "A country specified in an address"
    fields:
      default:
        - field: "_search.addressCountry_lower"
          query_type: range
      exact:
        - field: "_search.addressCountry"

  address-postalcode:
    type: string
    description: "A postal code specified in an address"
    fields:
      - field: "_search.addressPostalCode"
        query_type: exact

  phonetic:
    type: string
    description: "A portion of name using a phonetic matching algorithm"
    fields:
      - field: "_search.phonetic_codes"
        query_type: exact

  link:
    type: reference
    description: "Any link has this Patient, Person, RelatedPerson or Practitioner reference"
    fields:
      - field: "_search.linkTargetIds"
        referenceType: id
      - field: "_search.linkTargetTypes"
        referenceType: type

  patient:
    type: reference
    description: "The Person links to this Patient"
    fields:
      - field: "_search.patientLinkId"
        referenceType: id

  practitioner:
    type: reference
    description: "The Person links to this Practitioner"
    fields:
      - field: "_search.practitionerLinkId"
        referenceType: id

  relatedperson:
    type: reference
    description: "The Person links to this RelatedPerson"
    fields:
      - field: "_search.relatedPersonLinkId"
        referenceType: id

  organization:
    type: reference
    description: "The organization at which this person record is being managed"
    fields:
      - field: "_search.organizationId"
        referenceType: id
      - field: "managingOrganization.reference"
        referenceType: full

  gender:
    type: token
    description: "The gender of the person"
    fields:
      - field: "gender"
        tokenType: code

  identifier:
    type: token
    description: "A person Identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  email:
    type: token
    description: "A value in an email contact"
    fields:
      - field: "_search.email"
        tokenType: code

  phone:
    type: token
    description: "A value in a phone contact"
    fields:
      - field: "_search.phone"
        tokenType: code

  telecom:
    type: token
    description: "The value in any kind of contact"
    fields:
      - field: "_search.telecom_systemCode"
        tokenType: systemCode
      - field: "_search.telecom_values"
        tokenType: code

  address-use:
    type: token
    description: "A use code specified in an address"
    fields:
      - field: "_search.addressUse"
        tokenType: code

  deceased:
    type: token
    description: "This person has been marked as deceased, or has a death date entered"
    fields:
      - field: "_search.deceased"
        tokenType: boolean

  birthdate:
    type: date
    description: "The person's date of birth"
    fields:
      - field: "birthDate"
        type: date

  death-date:
    type: date
    description: "The date of death has been provided and satisfies this search value"
    fields:
      - field: "_search.deathDate"
        type: date

  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  name:
    source: name
    target: _search
    extractor: HumanNameExtractor
    field_mappings:
      - source_path: name[*].family
        target_field: familyName
        datatype: array[string]
      - source_path: name[*].family
        target_field: familyName_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: name[*].given
        target_field: givenNames
        datatype: array[string]
      - source_path: name[*].given
        target_field: givenNames_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: name[*]
        target_field: fullName
        datatype: array[string]
      - source_path: name[*]
        target_field: fullName_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: name[*].text
        target_field: nameText
        datatype: array[string]

  phonetic:
    source: name
    target: _search
    extractor: PhoneticExtractor
    field_mappings:
      - source_path: name[*]
        target_field: phonetic_codes
        datatype: array[string]

  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  telecom:
    source: telecom
    target: _search
    extractor: ContactPointExtractor
    field_mappings:
      - source_path: telecom[*].value
        target_field: email
        datatype: array[string]
        normalize: lowercase
      - source_path: telecom[*].value
        target_field: phone
        datatype: array[string]

  telecom_all:
    source: telecom
    target: _search
    extractor: ContactPointExtractor
    field_mappings:
      - source_path: telecom[*].value
        target_field: telecom_values
        datatype: array[string]
      - source_path: telecom[*]
        target_field: telecom_systemCode
        datatype: array[string]

  address:
    source: address
    target: _search
    extractor: AddressExtractor
    field_mappings:
      - source_path: address[*]
        target_field: addressFull
        datatype: array[string]
      - source_path: address[*]
        target_field: addressFull_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: address[*].city
        target_field: addressCity
        datatype: array[string]
      - source_path: address[*].city
        target_field: addressCity_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: address[*].state
        target_field: addressState
        datatype: array[string]
      - source_path: address[*].state
        target_field: addressState_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: address[*].postalCode
        target_field: addressPostalCode
        datatype: array[string]
      - source_path: address[*].country
        target_field: addressCountry
        datatype: array[string]
      - source_path: address[*].country
        target_field: addressCountry_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: address[*].use
        target_field: addressUse
        datatype: array[string]
      - source_path: address[*].text
        target_field: addressText
        datatype: array[string]

  deceased:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: deceasedBoolean
        target_field: deceased
        datatype: boolean
      - source_path: deceasedDateTime
        target_field: deceased
        datatype: boolean
        transform: presence
      - source_path: deceasedDateTime
        target_field: deathDate
        datatype: date

  link:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: link[*].target.reference
        target_field: linkTargetIds
        datatype: array[string]
        extractType: id
      - source_path: link[*].target.reference
        target_field: linkTargetTypes
        datatype: array[string]
        extractType: type
      - source_path: link[*].target.reference
        target_field: patientLinkId
        datatype: array[string]
        extractType: id
        filterType: Patient
      - source_path: link[*].target.reference
        target_field: practitionerLinkId
        datatype: array[string]
        extractType: id
        filterType: Practitioner
      - source_path: link[*].target.reference
        target_field: relatedPersonLinkId
        datatype: array[string]
        extractType: id
        filterType: RelatedPerson

  organization:
    source: managingOrganization
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: managingOrganization.reference
        target_field: organizationId
        datatype: string
        extractType: id

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - link[*].target
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: |
          Patient compartment (patient.json linking param patient).
          Patient/* refs from link[].target.

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_search.familyName_lower": 1
    options:
      name: idx_family_name_lower
      sparse: true
  - fields:
      - "_search.patientLinkId": 1
    options:
      name: idx_patient_link_id
      sparse: true
  - fields:
      - "_search.linkTargetIds": 1
    options:
      name: idx_link_target_ids
      sparse: true
  - fields:
      - "_search.identifier_values": 1
    options:
      name: idx_identifier_values
      sparse: true
  - fields:
      - "birthDate": 1
    options:
      name: idx_birth_date
      sparse: true
  - fields:
      - "gender": 1
    options:
      name: idx_gender
  - fields:
      - "_search.phonetic_codes": 1
    options:
      name: idx_phonetic_codes
      sparse: true
  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
