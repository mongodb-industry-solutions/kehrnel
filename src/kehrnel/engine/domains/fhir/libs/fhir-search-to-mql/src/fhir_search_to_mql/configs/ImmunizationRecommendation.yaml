resource: ImmunizationRecommendation
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec ImmunizationRecommendation)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/patient.json
#
# Total parameters: 10 (8 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `patient` is required Reference(Patient).
#   * `recommendation[]` is required BackboneElement — token/reference
#     search params target nested fields (forecastStatus, vaccineCode, etc.).

search_parameters:
  patient:
    type: reference
    description: "Who this profile is for"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "patient.reference"
        referenceType: full

  information:
    type: reference
    description: "Patient observations supporting recommendation"
    fields:
      - field: "_search.supportingPatientInformationIds"
        referenceType: id
      - field: "_search.supportingPatientInformationTypes"
        referenceType: type

  support:
    type: reference
    description: "Past immunizations supporting recommendation"
    fields:
      - field: "_search.supportingImmunizationIds"
        referenceType: id
      - field: "_search.supportingImmunizationTypes"
        referenceType: type

  identifier:
    type: token
    description: "Business identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  status:
    type: token
    description: "Vaccine recommendation status"
    fields:
      - field: "_search.forecastStatus_systemCode"
        tokenType: systemCode
      - field: "_search.forecastStatus_codes"
        tokenType: code

  target-disease:
    type: token
    description: "Disease to be immunized against"
    fields:
      - field: "_search.targetDisease_systemCode"
        tokenType: systemCode
      - field: "_search.targetDisease_codes"
        tokenType: code

  vaccine-type:
    type: token
    description: "Vaccine or vaccine group recommendation applies to"
    fields:
      - field: "_search.vaccineCode_systemCode"
        tokenType: systemCode
      - field: "_search.vaccineCode_codes"
        tokenType: code

  date:
    type: date
    description: "Date recommendation(s) created"
    fields:
      - field: "date"
        type: date

  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  patient:
    source: patient
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: patient.reference
        target_field: patientId
        datatype: string
        extractType: id

  recommendation_tokens:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: recommendation[*].forecastStatus.coding[*].code
        target_field: forecastStatus_codes
        datatype: array[string]
      - source_path: recommendation[*].forecastStatus.coding[*]
        target_field: forecastStatus_systemCode
        datatype: array[string]
      - source_path: recommendation[*].targetDisease[*].coding[*].code
        target_field: targetDisease_codes
        datatype: array[string]
      - source_path: recommendation[*].targetDisease[*].coding[*]
        target_field: targetDisease_systemCode
        datatype: array[string]
      - source_path: recommendation[*].vaccineCode[*].coding[*].code
        target_field: vaccineCode_codes
        datatype: array[string]
      - source_path: recommendation[*].vaccineCode[*].coding[*]
        target_field: vaccineCode_systemCode
        datatype: array[string]

  recommendation_references:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: recommendation[*].supportingImmunization[*].reference
        target_field: supportingImmunizationIds
        datatype: array[string]
        extractType: id
      - source_path: recommendation[*].supportingImmunization[*].reference
        target_field: supportingImmunizationTypes
        datatype: array[string]
        extractType: type
      - source_path: recommendation[*].supportingPatientInformation[*].reference
        target_field: supportingPatientInformationIds
        datatype: array[string]
        extractType: id
      - source_path: recommendation[*].supportingPatientInformation[*].reference
        target_field: supportingPatientInformationTypes
        datatype: array[string]
        extractType: type

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: "Patient compartment (patient.json linking param patient)"

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_search.patientId": 1
    options:
      name: idx_patient_id
      sparse: true
  - fields:
      - "date": 1
    options:
      name: idx_date
      sparse: true
  - fields:
      - "_search.forecastStatus_codes": 1
    options:
      name: idx_forecast_status_codes
      sparse: true
  - fields:
      - "_search.vaccineCode_codes": 1
    options:
      name: idx_vaccine_code_codes
      sparse: true
  - fields:
      - "_search.targetDisease_codes": 1
    options:
      name: idx_target_disease_codes
      sparse: true
  - fields:
      - "_search.identifier_values": 1
    options:
      name: idx_identifier_values
      sparse: true
  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
