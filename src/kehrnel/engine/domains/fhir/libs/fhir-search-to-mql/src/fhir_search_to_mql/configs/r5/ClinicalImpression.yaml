resource: ClinicalImpression
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec ClinicalImpression)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, encounter.json, device.json
#
# Total parameters: 14 (12 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `ClinicalImpression.subject` is required Reference(Patient | Group);
#     `patient` is the Patient/* shortcut.
#   * `finding[]` uses CodeableReference — `finding-code` searches
#     `.concept`, `finding-ref` searches `.reference`.
#   * `performer` and `previous` are single Reference (0..1).
#   * `problem[]` and `supportingInfo[]` are Reference arrays.
#   * Top-level scalar `status` and `date` query the FHIR root.

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  encounter:
    type: reference
    description: "The encounter during which this clinical impression was created"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  finding-ref:
    type: reference
    description: "Reference to a finding resource instance"
    fields:
      - field: "_search.findingReferenceIds"
        referenceType: id
      - field: "_search.findingReferenceTypes"
        referenceType: type

  patient:
    type: reference
    description: "The patient assessed"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  performer:
    type: reference
    description: "The clinician performing the assessment"
    fields:
      - field: "_search.performerId"
        referenceType: id
      - field: "_search.performerType"
        referenceType: type
      - field: "performer.reference"
        referenceType: full

  previous:
    type: reference
    description: "Reference to last clinical impression assessment"
    fields:
      - field: "_search.previousId"
        referenceType: id
      - field: "_search.previousType"
        referenceType: type
      - field: "previous.reference"
        referenceType: full

  problem:
    type: reference
    description: "Relevant impressions of patient state"
    fields:
      - field: "_search.problemIds"
        referenceType: id
      - field: "_search.problemTypes"
        referenceType: type
      - field: "problem.reference"
        referenceType: full

  subject:
    type: reference
    description: "Patient or group assessed"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  supporting-info:
    type: reference
    description: "Information supporting the clinical impression"
    fields:
      - field: "_search.supportingInfoIds"
        referenceType: id
      - field: "_search.supportingInfoTypes"
        referenceType: type

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  finding-code:
    type: token
    description: "Finding concept code"
    fields:
      - field: "_search.findingConcept_systemCode"
        tokenType: systemCode
      - field: "_search.findingConcept_codes"
        tokenType: code

  identifier:
    type: token
    description: "Business identifier"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  status:
    type: token
    description: "preparation | in-progress | not-done | on-hold | stopped | completed | entered-in-error | unknown"
    fields:
      - field: "status"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  date:
    type: date
    description: "When the assessment was documented"
    fields:
      - field: "date"
        type: date

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  performer:
    source: performer
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: performer.reference
        target_field: performerId
        datatype: string
        extractType: id
      - source_path: performer.reference
        target_field: performerType
        datatype: string
        extractType: type

  previous:
    source: previous
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: previous.reference
        target_field: previousId
        datatype: string
        extractType: id
      - source_path: previous.reference
        target_field: previousType
        datatype: string
        extractType: type

  problem:
    source: problem
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: problem[*].reference
        target_field: problemIds
        datatype: array[string]
        extractType: id
      - source_path: problem[*].reference
        target_field: problemTypes
        datatype: array[string]
        extractType: type

  supporting_info:
    source: supportingInfo
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: supportingInfo[*].reference
        target_field: supportingInfoIds
        datatype: array[string]
        extractType: id
      - source_path: supportingInfo[*].reference
        target_field: supportingInfoTypes
        datatype: array[string]
        extractType: type

  finding_concept:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: finding[*].item.concept.coding[*].code
        target_field: findingConcept_codes
        datatype: array[string]
      - source_path: finding[*].item.concept.coding[*]
        target_field: findingConcept_systemCode
        datatype: array[string]

  finding_reference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: finding[*].item.reference.reference
        target_field: findingReferenceIds
        datatype: array[string]
        extractType: id
      - source_path: finding[*].item.reference.reference
        target_field: findingReferenceTypes
        datatype: array[string]
        extractType: type

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: "Patient compartment (subject linking param)"
      - target_field: Practitioner
        source_paths:
          - performer
        reference_type: Practitioner
        datatype: array[string]
        comment: "Practitioner compartment (performer linking param)"
      - target_field: Device
        source_paths:
          - performer
        reference_type: Device
        datatype: array[string]
        comment: "Device compartment (performer where Device/*)"
      - target_field: Encounter
        source_paths:
          - encounter
        reference_type: Encounter
        datatype: array[string]
        comment: "Encounter compartment (encounter linking param)"

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Device
    - Encounter

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true
  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_status
  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true
  - fields:
      - "_search.encounterId": 1
    options:
      name: idx_encounter_id
      sparse: true
  - fields:
      - "_search.performerId": 1
    options:
      name: idx_performer_id
      sparse: true
  - fields:
      - "date": 1
    options:
      name: idx_date
      sparse: true
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
