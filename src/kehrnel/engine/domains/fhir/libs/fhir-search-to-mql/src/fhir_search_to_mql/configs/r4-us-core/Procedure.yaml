resource: Procedure
fhir_version: R4
profile: us-core

# R4 note: uses performedDateTime/performedPeriod (NOT occurredDateTime as in R5)

search_parameters:
  status:
    type: token
    description: "preparation | in-progress | not-done | on-hold | stopped | completed | entered-in-error | unknown"
    fields:
      - field: "status"
        tokenType: code

  code:
    type: token
    description: "A code to identify a procedure"
    fields:
      - field: "_search.codeCode"
        tokenType: code
      - field: "_search.codeSystemCode"
        tokenType: systemCode

  patient:
    type: reference
    description: "Search by subject - a patient"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  subject:
    type: reference
    description: "Search by subject"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  encounter:
    type: reference
    description: "The Encounter during which this Procedure was created"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  date:
    type: date
    description: "When the procedure was performed"
    fields:
      - field: "_search.performedDate"
        type: date

  identifier:
    type: token
    description: "A unique identifier for a procedure"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  _id:
    type: token
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    fields:
      - field: "meta.lastUpdated"
        type: date

  _profile:
    type: uri
    description: "US Core profile URL this resource conforms to"
    fields:
      - field: "meta.profile"

denormalization:
  code:
    source: code
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: code.coding[*].code
        target_field: codeCode
        datatype: array[string]
      - source_path: code
        target_field: codeSystemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  # R4: performedDateTime (not occurredDateTime)
  performed:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: performedDateTime
        target_field: performedDate
        datatype: date

  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
        reference_type: Patient
        include_self: false
        datatype: array[string]

  meta_profile:
    source: meta
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: profile
        target_field: meta_profile
        datatype: array[string]

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_r4_proc_compartment_patient
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_r4_proc_status
  - fields:
      - "_search.codeCode": 1
    options:
      name: idx_r4_proc_code
  - fields:
      - "_search.performedDate": -1
    options:
      name: idx_r4_proc_performed_date
  - fields:
      - "meta.profile": 1
    options:
      name: idx_r4_us_proc_meta_profile
      sparse: true
