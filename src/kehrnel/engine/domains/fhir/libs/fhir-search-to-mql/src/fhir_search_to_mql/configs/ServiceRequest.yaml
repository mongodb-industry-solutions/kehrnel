resource: ServiceRequest
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec ServiceRequest)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, device.json, encounter.json
#
# Total parameters: 25 (23 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `ServiceRequest.code` is CodeableReference (0..1) — `code-concept`
#     searches `.concept`, `code-reference` searches `.reference`.
#   * `ServiceRequest.occurrence[x]` is polymorphic (dateTime | Period |
#     Timing). `occurrence` date search uses `occurrenceDateTime` and
#     `_search.occurrencePeriod` for interval overlap; Timing is not
#     denormalized (dynamic occurrence rarely indexed).
#   * `ServiceRequest.subject` is required Reference(Patient | Group |
#     Device | Location); `patient` is the Patient/* shortcut.
#   * `instantiatesCanonical` is canonical[]; `instantiates-uri` is uri[].
#   * `requisition` is a single Identifier (token search).
#   * Top-level scalars `status`, `intent`, `priority` query the FHIR root.
#   * Encounter compartment uses dynamic resolver (`encounter` linking param).

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  based-on:
    type: reference
    description: "What request fulfills"
    fields:
      - field: "_search.basedOnIds"
        referenceType: id
      - field: "_search.basedOnTypes"
        referenceType: type
      - field: "basedOn.reference"
        referenceType: full

  body-structure:
    type: reference
    description: "Body structure to be treated"
    fields:
      - field: "_search.bodyStructureId"
        referenceType: id
      - field: "_search.bodyStructureType"
        referenceType: type
      - field: "bodyStructure.reference"
        referenceType: full

  code-reference:
    type: reference
    description: "Service requested (reference arm of CodeableReference)"
    fields:
      - field: "_search.codeReferenceIds"
        referenceType: id
      - field: "_search.codeReferenceTypes"
        referenceType: type

  encounter:
    type: reference
    description: "Encounter during which request was created"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  instantiates-canonical:
    type: reference
    description: "Instantiates FHIR protocol or definition"
    fields:
      - field: "_search.instantiatesCanonical_values"
        referenceType: full
      - field: "instantiatesCanonical"
        referenceType: full

  patient:
    type: reference
    description: "Search by subject when Patient"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  performer:
    type: reference
    description: "Requested performer"
    fields:
      - field: "_search.performerIds"
        referenceType: id
      - field: "_search.performerTypes"
        referenceType: type
      - field: "performer.reference"
        referenceType: full

  replaces:
    type: reference
    description: "Request(s) replaced by this request"
    fields:
      - field: "_search.replacesIds"
        referenceType: id
      - field: "_search.replacesTypes"
        referenceType: type
      - field: "replaces.reference"
        referenceType: full

  requester:
    type: reference
    description: "Who/what is requesting service"
    fields:
      - field: "_search.requesterId"
        referenceType: id
      - field: "_search.requesterType"
        referenceType: type
      - field: "requester.reference"
        referenceType: full

  specimen:
    type: reference
    description: "Procedure Samples"
    fields:
      - field: "_search.specimenIds"
        referenceType: id
      - field: "_search.specimenTypes"
        referenceType: type
      - field: "specimen.reference"
        referenceType: full

  subject:
    type: reference
    description: "Search by subject"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  body-site:
    type: token
    description: "Location for service"
    fields:
      - field: "_search.bodySite_systemCode"
        tokenType: systemCode
      - field: "_search.bodySite_codes"
        tokenType: code

  category:
    type: token
    description: "Classification of service"
    fields:
      - field: "_search.category_systemCode"
        tokenType: systemCode
      - field: "_search.category_codes"
        tokenType: code

  code-concept:
    type: token
    description: "Service requested (concept arm of CodeableReference)"
    fields:
      - field: "_search.codeConcept_systemCode"
        tokenType: systemCode
      - field: "_search.codeConcept_codes"
        tokenType: code

  identifier:
    type: token
    description: "Business identifier for service request"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  intent:
    type: token
    description: "proposal | plan | directive | order | original-order | reflex-order"
    fields:
      - field: "intent"
        tokenType: code

  performer-type:
    type: token
    description: "Performer role"
    fields:
      - field: "_search.performerType_systemCode"
        tokenType: systemCode
      - field: "_search.performerType_codes"
        tokenType: code

  priority:
    type: token
    description: "routine | urgent | asap | stat"
    fields:
      - field: "priority"
        tokenType: code

  requisition:
    type: token
    description: "Composite Request ID"
    fields:
      - field: "_search.requisition_systemCode"
        tokenType: systemCode
      - field: "_search.requisition_values"
        tokenType: code

  status:
    type: token
    description: "draft | active | on-hold | revoked | completed | entered-in-error | unknown"
    fields:
      - field: "status"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  authored:
    type: date
    description: "Date request signed"
    fields:
      - field: "authoredOn"
        type: date

  occurrence:
    type: date
    description: "When service should occur"
    fields:
      - field: "occurrenceDateTime"
        type: date
      - field: "_search.occurrencePeriod"
        type: period

  # ─────────────────────────────────────────────────────────────
  # URI Parameters
  # ─────────────────────────────────────────────────────────────
  instantiates-uri:
    type: uri
    description: "Instantiates external protocol or definition"
    fields:
      - field: "_search.instantiatesUri_values"
      - field: "instantiatesUri"

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

# Denormalization Configuration
denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  requisition:
    source: requisition
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: requisition.value
        target_field: requisition_values
        datatype: array[string]
      - source_path: requisition
        target_field: requisition_systemCode
        datatype: array[string]

  category:
    source: category
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: category[*].coding[*].code
        target_field: category_codes
        datatype: array[string]
      - source_path: category[*].coding[*]
        target_field: category_systemCode
        datatype: array[string]

  bodySite:
    source: bodySite
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: bodySite[*].coding[*].code
        target_field: bodySite_codes
        datatype: array[string]
      - source_path: bodySite[*].coding[*]
        target_field: bodySite_systemCode
        datatype: array[string]

  performerType:
    source: performerType
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: performerType.coding[*].code
        target_field: performerType_codes
        datatype: array[string]
      - source_path: performerType.coding[*]
        target_field: performerType_systemCode
        datatype: array[string]

  code_concept:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: code.concept.coding[*].code
        target_field: codeConcept_codes
        datatype: array[string]
      - source_path: code.concept.coding[*]
        target_field: codeConcept_systemCode
        datatype: array[string]

  code_reference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: code.reference.reference
        target_field: codeReferenceIds
        datatype: array[string]
        extractType: id
      - source_path: code.reference.reference
        target_field: codeReferenceTypes
        datatype: array[string]
        extractType: type

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  requester:
    source: requester
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: requester.reference
        target_field: requesterId
        datatype: string
        extractType: id
      - source_path: requester.reference
        target_field: requesterType
        datatype: string
        extractType: type

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  bodyStructure:
    source: bodyStructure
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: bodyStructure.reference
        target_field: bodyStructureId
        datatype: string
        extractType: id
      - source_path: bodyStructure.reference
        target_field: bodyStructureType
        datatype: string
        extractType: type

  performer:
    source: performer
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: performer[*].reference
        target_field: performerIds
        datatype: array[string]
        extractType: id
      - source_path: performer[*].reference
        target_field: performerTypes
        datatype: array[string]
        extractType: type

  basedOn:
    source: basedOn
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: basedOn[*].reference
        target_field: basedOnIds
        datatype: array[string]
        extractType: id
      - source_path: basedOn[*].reference
        target_field: basedOnTypes
        datatype: array[string]
        extractType: type

  replaces:
    source: replaces
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: replaces[*].reference
        target_field: replacesIds
        datatype: array[string]
        extractType: id
      - source_path: replaces[*].reference
        target_field: replacesTypes
        datatype: array[string]
        extractType: type

  specimen:
    source: specimen
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: specimen[*].reference
        target_field: specimenIds
        datatype: array[string]
        extractType: id
      - source_path: specimen[*].reference
        target_field: specimenTypes
        datatype: array[string]
        extractType: type

  instantiates_canonical:
    source: instantiatesCanonical
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: instantiatesCanonical[*]
        target_field: instantiatesCanonical_values
        datatype: array[string]

  instantiates_uri:
    source: instantiatesUri
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: instantiatesUri[*]
        target_field: instantiatesUri_values
        datatype: array[string]

  occurrence_period:
    source: occurrencePeriod
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: start
        target_field: occurrencePeriod
        datatype: object
        comment: "Nested Period for `occurrence` overlap queries"

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
          - performer
        reference_type: Patient
        datatype: array[string]
        comment: |
          Patient compartment (patient.json linking params patient,
          subject, performer). Patient/* on subject and performer only.
      - target_field: Practitioner
        source_paths:
          - requester
          - performer
        reference_type: Practitioner
        datatype: array[string]
        comment: "Practitioner compartment (requester + performer)"
      - target_field: Device
        source_paths:
          - requester
          - performer
        reference_type: Device
        datatype: array[string]
        comment: "Device compartment (requester + performer)"

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Device

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true

  - fields:
      - "status": 1
    options:
      name: idx_status

  - fields:
      - "intent": 1
    options:
      name: idx_intent
      sparse: true

  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true

  - fields:
      - "_search.encounterId": 1
    options:
      name: idx_encounter_id
      sparse: true

  - fields:
      - "authoredOn": 1
    options:
      name: idx_authored_on
      sparse: true

  - fields:
      - "occurrenceDateTime": 1
    options:
      name: idx_occurrence_datetime
      sparse: true

  - fields:
      - "_search.occurrencePeriod.start": 1
      - "_search.occurrencePeriod.end": 1
    options:
      name: idx_occurrence_period
      sparse: true

  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
