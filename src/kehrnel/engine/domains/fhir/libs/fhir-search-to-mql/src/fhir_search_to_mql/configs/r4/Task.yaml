resource: Task
fhir_version: R4

search_parameters:
  status:
    type: token
    description: "Task status"
    fields:
      - field: "status"
        tokenType: code
  code:
    type: token
    description: "Code for Task"
    fields:
      - field: "_search.codeCode"
        tokenType: code
      - field: "_search.codeSystemCode"
        tokenType: systemCode
  encounter:
    type: reference
    description: "Encounter for Task"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full
  date:
    type: date
    description: "Date for Task"
    fields:
      - field: "_search.date"
        type: date
  identifier:
    type: token
    description: "Identifier for Task"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code
  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  code:
    source: code
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: code.coding[*].code
        target_field: codeCode
        datatype: array[string]
      - source_path: code
        target_field: codeSystemCode
        datatype: array[string]
  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id
  date:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: authoredOn
        target_field: date
        datatype: date
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

indexes:
  - fields:
      - "status": 1
    options:
      name: idx_r4_task_status
  - fields:
      - "_search.date": -1
    options:
      name: idx_r4_task_date
  - fields:
      - "_search.codeCode": 1
    options:
      name: idx_r4_task_code
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_r4_task_updated
