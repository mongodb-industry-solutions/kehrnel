resource: Goal
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec Goal)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/patient.json
#
# Total parameters: 13 (11 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `Goal.subject` is required Reference(Patient | Group |
#     Organization); `patient` is the Patient/* shortcut.
#   * `Goal.description` is required CodeableConcept — `description`
#     token search; `:text` searches display/text projections.
#   * `Goal.start[x]` is polymorphic (date | CodeableConcept). `start-date`
#     uses `startDate` only (Timing/CodeableConcept start not denormalized).
#   * `Goal.target[]` is BackboneElement; `target-date` searches
#     `target.dueDate`; `target-measure` searches `target.measure`.
#   * Top-level scalar `lifecycleStatus` queries the FHIR root field.

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  addresses:
    type: reference
    description: "Issues addressed by this goal"
    fields:
      - field: "_search.addressesIds"
        referenceType: id
      - field: "_search.addressesTypes"
        referenceType: type
      - field: "addresses.reference"
        referenceType: full

  patient:
    type: reference
    description: "Who this goal is intended for (Patient subject)"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  subject:
    type: reference
    description: "Who this goal is intended for"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  achievement-status:
    type: token
    description: "in-progress | improving | worsening | no-change | achieved | sustaining | not-achieved | no-progress | not-attainable"
    fields:
      - field: "_search.achievementStatus_systemCode"
        tokenType: systemCode
      - field: "_search.achievementStatus_codes"
        tokenType: code

  category:
    type: token
    description: "E.g. Treatment, dietary, behavioral, etc."
    fields:
      - field: "_search.category_systemCode"
        tokenType: systemCode
      - field: "_search.category_codes"
        tokenType: code

  description:
    type: token
    description: "Code or text describing goal"
    fields:
      default:
        - field: "_search.description_systemCode"
          tokenType: systemCode
        - field: "_search.description_codes"
          tokenType: code
      text:
        - field: "_search.description_displays_lower"
          tokenType: code
        - field: "_search.description_text_lower"
          tokenType: code

  identifier:
    type: token
    description: "External Ids for this goal"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  lifecycle-status:
    type: token
    description: "proposed | planned | accepted | active | on-hold | completed | cancelled | entered-in-error | rejected"
    fields:
      - field: "lifecycleStatus"
        tokenType: code

  target-measure:
    type: token
    description: "The parameter whose value is being tracked"
    fields:
      - field: "_search.targetMeasure_systemCode"
        tokenType: systemCode
      - field: "_search.targetMeasure_codes"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  start-date:
    type: date
    description: "When goal pursuit begins"
    fields:
      - field: "startDate"
        type: date

  target-date:
    type: date
    description: "Reach goal on or before"
    fields:
      - field: "_search.targetDueDate"
        type: date

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

# Denormalization Configuration
denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  achievement_status:
    source: achievementStatus
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: achievementStatus.coding[*].code
        target_field: achievementStatus_codes
        datatype: array[string]
      - source_path: achievementStatus.coding[*]
        target_field: achievementStatus_systemCode
        datatype: array[string]

  category:
    source: category
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: category[*].coding[*].code
        target_field: category_codes
        datatype: array[string]
      - source_path: category[*].coding[*]
        target_field: category_systemCode
        datatype: array[string]

  description:
    source: description
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: description.coding[*].code
        target_field: description_codes
        datatype: array[string]
      - source_path: description.coding[*]
        target_field: description_systemCode
        datatype: array[string]
      - source_path: description.coding[*].display
        target_field: description_displays_lower
        datatype: array[string]
        normalize: lowercase
      - source_path: description.text
        target_field: description_text_lower
        datatype: string
        normalize: lowercase

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  addresses:
    source: addresses
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: addresses[*].reference
        target_field: addressesIds
        datatype: array[string]
        extractType: id
      - source_path: addresses[*].reference
        target_field: addressesTypes
        datatype: array[string]
        extractType: type

  target_measure:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: target[*].measure.coding[*].code
        target_field: targetMeasure_codes
        datatype: array[string]
      - source_path: target[*].measure.coding[*]
        target_field: targetMeasure_systemCode
        datatype: array[string]

  target_due_date:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: target[*].dueDate
        target_field: targetDueDate
        datatype: array[date]

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: "Patient compartment (patient.json linking params patient, subject)"

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true

  - fields:
      - "lifecycleStatus": 1
    options:
      name: idx_lifecycle_status

  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true

  - fields:
      - "startDate": 1
    options:
      name: idx_start_date
      sparse: true

  - fields:
      - "_search.targetDueDate": 1
    options:
      name: idx_target_due_date
      sparse: true

  - fields:
      - "_search.identifier_values": 1
    options:
      name: idx_identifier_values
      sparse: true

  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
