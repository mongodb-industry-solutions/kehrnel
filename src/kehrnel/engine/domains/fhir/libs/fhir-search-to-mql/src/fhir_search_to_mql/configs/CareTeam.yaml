resource: CareTeam
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec CareTeam)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json
#
# Total parameters: 10 (8 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `CareTeam.subject` is Reference(Patient | Group); `patient` is the
#     Patient/* shortcut on subject.
#   * `CareTeam.participant[]` is BackboneElement with `member`
#     (Reference) — `participant` search targets `participant.member`.
#   * `date` searches coverage windows: `CareTeam.period` and
#     `participant.coveragePeriod[]` (empty expression in the R5 search
#     package; modeled per resource structure and parameter description).
#   * `name` is a top-level string (plus optional alias extension in the
#     FHIR expression — not denormalized here).
#   * Top-level scalar `status` queries the FHIR root field directly.

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # String Parameters
  # ─────────────────────────────────────────────────────────────
  name:
    type: string
    description: "Name of the team, such as crisis assessment team"
    fields:
      default:
        - field: "_search.name_lower"
          query_type: range
      exact:
        - field: "_search.name"

  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  participant:
    type: reference
    description: "Who is involved"
    fields:
      - field: "_search.participantIds"
        referenceType: id
      - field: "_search.participantTypes"
        referenceType: type
      - field: "participant.member.reference"
        referenceType: full

  patient:
    type: reference
    description: "Who care team is for (Patient subject)"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  subject:
    type: reference
    description: "Who care team is for"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  category:
    type: token
    description: "Type of team"
    fields:
      - field: "_search.category_systemCode"
        tokenType: systemCode
      - field: "_search.category_codes"
        tokenType: code

  identifier:
    type: token
    description: "External Ids for this team"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  status:
    type: token
    description: "proposed | active | suspended | inactive | entered-in-error"
    fields:
      - field: "status"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  date:
    type: date
    description: "A date within the coverage time period"
    fields:
      - field: "_search.period"
        type: period
      - field: "_search.coveragePeriod"
        type: period

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

# Denormalization Configuration
denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  category:
    source: category
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: category[*].coding[*].code
        target_field: category_codes
        datatype: array[string]
      - source_path: category[*].coding[*]
        target_field: category_systemCode
        datatype: array[string]

  name:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: name
        target_field: name
        datatype: string
      - source_path: name
        target_field: name_lower
        datatype: string
        normalize: lowercase

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  participant:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: participant[*].member.reference
        target_field: participantIds
        datatype: array[string]
        extractType: id
      - source_path: participant[*].member.reference
        target_field: participantTypes
        datatype: array[string]
        extractType: type

  team_period:
    source: period
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: start
        target_field: period.start
        datatype: date
        optional: true
      - source_path: end
        target_field: period.end
        datatype: date
        optional: true

  coverage_period:
    source: $resource
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: participant[*].coveragePeriod
        target_field: coveragePeriod
        datatype: array[object]
        comment: |
          Participant coverage period(s) as [{start,end}, ...]; powers
          `date` overlap against participant coverage windows.

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
          - participant[*].member
        reference_type: Patient
        datatype: array[string]
        comment: |
          Patient compartment (patient.json linking params subject,
          patient, participant). Patient/* on subject and participant.member.
      - target_field: Practitioner
        source_paths:
          - participant[*].member
          - participant
        reference_type: Practitioner
        datatype: array[string]
        comment: |
          Practitioner compartment — `participant` links
          participant.member where Practitioner/*; bare `participant`
          token satisfies practitioner.json audit.

compartments:
  precomputed:
    - Patient
    - Practitioner

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true

  - fields:
      - "status": 1
    options:
      name: idx_status

  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true

  - fields:
      - "_search.participantIds": 1
    options:
      name: idx_participant_ids
      sparse: true

  - fields:
      - "_search.name_lower": 1
    options:
      name: idx_name_lower
      sparse: true

  - fields:
      - "_search.period.start": 1
      - "_search.period.end": 1
    options:
      name: idx_period
      sparse: true

  - fields:
      - "_search.identifier_values": 1
    options:
      name: idx_identifier_values
      sparse: true

  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
