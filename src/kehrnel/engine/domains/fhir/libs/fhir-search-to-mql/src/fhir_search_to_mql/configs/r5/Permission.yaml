resource: Permission
fhir_version: R5

search_parameters:
  status:
    type: token
    description: "Permission status"
    fields:
      - field: status
        tokenType: code
  date:
    type: date
    description: "Date for Permission"
    fields:
      - field: _search.date
        type: date
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: id
        tokenType: code
  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: meta.lastUpdated
        type: date

denormalization:
  date:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: date
        target_field: date
        datatype: date

indexes:
  - fields:
      - "status": 1
    options:
      name: idx_r5_permis_status
  - fields:
      - "_search.date": -1
    options:
      name: idx_r5_permis_date
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_r5_permis_updated
