resource: Citation
fhir_version: R5

search_parameters:
  status:
    type: token
    description: "Citation status"
    fields:
      - field: status
        tokenType: code
  date:
    type: date
    description: "Date for Citation"
    fields:
      - field: _search.date
        type: date
  identifier:
    type: token
    description: "Identifier for Citation"
    fields:
      - field: _search.identifier_systemCode
        tokenType: systemCode
      - field: _search.identifier_values
        tokenType: code
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: id
        tokenType: code
  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: meta.lastUpdated
        type: date

denormalization:
  date:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: date
        target_field: date
        datatype: date
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

indexes:
  - fields:
      - "status": 1
    options:
      name: idx_r5_citati_status
  - fields:
      - "_search.date": -1
    options:
      name: idx_r5_citati_date
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_r5_citati_updated
