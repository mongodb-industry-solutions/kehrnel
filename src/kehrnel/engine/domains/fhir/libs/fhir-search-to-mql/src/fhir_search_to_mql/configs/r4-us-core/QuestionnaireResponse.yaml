resource: QuestionnaireResponse
fhir_version: R4
profile: us-core

search_parameters:
  status:
    type: token
    description: "in-progress | completed | amended | entered-in-error | stopped"
    fields:
      - field: "status"
        tokenType: code

  patient:
    type: reference
    description: "The patient that is the subject of the questionnaire response"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  subject:
    type: reference
    description: "The subject of the questionnaire response"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  encounter:
    type: reference
    description: "Encounter associated with the questionnaire response"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  questionnaire:
    type: reference
    description: "The questionnaire the answers are provided for"
    fields:
      - field: "_search.questionnaireId"
        referenceType: id
      - field: "questionnaire"
        referenceType: full

  authored:
    type: date
    description: "When the questionnaire response was last changed"
    fields:
      - field: "_search.authored"
        type: date

  _id:
    type: token
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    fields:
      - field: "meta.lastUpdated"
        type: date

  _profile:
    type: uri
    description: "US Core profile URL this resource conforms to"
    fields:
      - field: "meta.profile"

denormalization:
  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  authored:
    source: authored
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: authored
        target_field: authored
        datatype: date

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
        reference_type: Patient
        include_self: false
        datatype: array[string]

  meta_profile:
    source: meta
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: profile
        target_field: meta_profile
        datatype: array[string]

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_r4_qr_compartment_patient
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_r4_qr_status
  - fields:
      - "meta.profile": 1
    options:
      name: idx_r4_us_qr_meta_profile
      sparse: true
