resource: Bundle
fhir_version: R5

search_parameters:
  code:
    type: token
    description: "Code for Bundle"
    fields:
      - field: _search.codeCode
        tokenType: code
      - field: _search.codeSystemCode
        tokenType: systemCode
  date:
    type: date
    description: "Date for Bundle"
    fields:
      - field: _search.date
        type: date
  identifier:
    type: token
    description: "Identifier for Bundle"
    fields:
      - field: _search.identifier_systemCode
        tokenType: systemCode
      - field: _search.identifier_values
        tokenType: code
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: id
        tokenType: code
  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: meta.lastUpdated
        type: date

denormalization:
  code:
    source: type
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: type.coding[*].code
        target_field: codeCode
        datatype: array[string]
      - source_path: type
        target_field: codeSystemCode
        datatype: array[string]
  date:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: timestamp
        target_field: date
        datatype: date
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

indexes:
  - fields:
      - "_search.date": -1
    options:
      name: idx_r5_bundle_date
  - fields:
      - "_search.codeCode": 1
    options:
      name: idx_r5_bundle_code
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_r5_bundle_updated
