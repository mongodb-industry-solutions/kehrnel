resource: CarePlan
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec CarePlan)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, encounter.json
#
# Total parameters: 20 (18 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `CarePlan.subject` is required Reference(Patient | Group); `patient`
#     is the Patient/* shortcut.
#   * `CarePlan.addresses[]` is CodeableReference — `condition` searches
#     `.reference` (typically Condition/*).
#   * `CarePlan.activity[]` is BackboneElement; `activity-reference`
#     searches `plannedActivityReference`.
#   * `date` searches `CarePlan.period` (interval overlap via
#     `_search.period`).
#   * `custodian` is a single Reference (not in Practitioner compartment
#     linking params — compartment uses legacy `performer` token for audit
#     only; precompute uses `contributor[]` where Practitioner/*).
#   * Top-level scalars `status`, `intent` query root fields.
#   * `instantiatesCanonical` is canonical[]; `instantiates-uri` is uri[].

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  activity-reference:
    type: reference
    description: "Activity that is intended to be part of the care plan"
    fields:
      - field: "_search.activityReferenceIds"
        referenceType: id
      - field: "_search.activityReferenceTypes"
        referenceType: type

  based-on:
    type: reference
    description: "Fulfills CarePlan"
    fields:
      - field: "_search.basedOnIds"
        referenceType: id
      - field: "_search.basedOnTypes"
        referenceType: type
      - field: "basedOn.reference"
        referenceType: full

  care-team:
    type: reference
    description: "Who's involved in plan"
    fields:
      - field: "_search.careTeamIds"
        referenceType: id
      - field: "_search.careTeamTypes"
        referenceType: type
      - field: "careTeam.reference"
        referenceType: full

  condition:
    type: reference
    description: "Condition addressed by this care plan (addresses.reference)"
    fields:
      - field: "_search.conditionIds"
        referenceType: id
      - field: "_search.conditionTypes"
        referenceType: type

  custodian:
    type: reference
    description: "Who is the designated responsible party"
    fields:
      - field: "_search.custodianId"
        referenceType: id
      - field: "_search.custodianType"
        referenceType: type
      - field: "custodian.reference"
        referenceType: full

  encounter:
    type: reference
    description: "The Encounter during which this CarePlan was created"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  goal:
    type: reference
    description: "Desired outcome of plan"
    fields:
      - field: "_search.goalIds"
        referenceType: id
      - field: "_search.goalTypes"
        referenceType: type
      - field: "goal.reference"
        referenceType: full

  instantiates-canonical:
    type: reference
    description: "Instantiates FHIR protocol or definition"
    fields:
      - field: "_search.instantiatesCanonical_values"
        referenceType: full
      - field: "instantiatesCanonical"
        referenceType: full

  part-of:
    type: reference
    description: "Part of referenced CarePlan"
    fields:
      - field: "_search.partOfIds"
        referenceType: id
      - field: "_search.partOfTypes"
        referenceType: type
      - field: "partOf.reference"
        referenceType: full

  patient:
    type: reference
    description: "Who the care plan is for (Patient subject)"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  replaces:
    type: reference
    description: "CarePlan replaced by this CarePlan"
    fields:
      - field: "_search.replacesIds"
        referenceType: id
      - field: "_search.replacesTypes"
        referenceType: type
      - field: "replaces.reference"
        referenceType: full

  subject:
    type: reference
    description: "Who the care plan is for"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  category:
    type: token
    description: "Type of plan"
    fields:
      - field: "_search.category_systemCode"
        tokenType: systemCode
      - field: "_search.category_codes"
        tokenType: code

  identifier:
    type: token
    description: "External Ids for this plan"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  intent:
    type: token
    description: "proposal | plan | order | option | directive"
    fields:
      - field: "intent"
        tokenType: code

  status:
    type: token
    description: "draft | active | on-hold | revoked | completed | entered-in-error | unknown"
    fields:
      - field: "status"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  date:
    type: date
    description: "Time period plan covers"
    fields:
      - field: "_search.period"
        type: period

  # ─────────────────────────────────────────────────────────────
  # URI Parameters
  # ─────────────────────────────────────────────────────────────
  instantiates-uri:
    type: uri
    description: "Instantiates external protocol or definition"
    fields:
      - field: "_search.instantiatesUri_values"
      - field: "instantiatesUri"

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

# Denormalization Configuration
denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  category:
    source: category
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: category[*].coding[*].code
        target_field: category_codes
        datatype: array[string]
      - source_path: category[*].coding[*]
        target_field: category_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  custodian:
    source: custodian
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: custodian.reference
        target_field: custodianId
        datatype: string
        extractType: id
      - source_path: custodian.reference
        target_field: custodianType
        datatype: string
        extractType: type

  based_on:
    source: basedOn
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: basedOn[*].reference
        target_field: basedOnIds
        datatype: array[string]
        extractType: id
      - source_path: basedOn[*].reference
        target_field: basedOnTypes
        datatype: array[string]
        extractType: type

  care_team:
    source: careTeam
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: careTeam[*].reference
        target_field: careTeamIds
        datatype: array[string]
        extractType: id
      - source_path: careTeam[*].reference
        target_field: careTeamTypes
        datatype: array[string]
        extractType: type

  goal:
    source: goal
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: goal[*].reference
        target_field: goalIds
        datatype: array[string]
        extractType: id
      - source_path: goal[*].reference
        target_field: goalTypes
        datatype: array[string]
        extractType: type

  part_of:
    source: partOf
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: partOf[*].reference
        target_field: partOfIds
        datatype: array[string]
        extractType: id
      - source_path: partOf[*].reference
        target_field: partOfTypes
        datatype: array[string]
        extractType: type

  replaces:
    source: replaces
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: replaces[*].reference
        target_field: replacesIds
        datatype: array[string]
        extractType: id
      - source_path: replaces[*].reference
        target_field: replacesTypes
        datatype: array[string]
        extractType: type

  condition:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: addresses[*].reference.reference
        target_field: conditionIds
        datatype: array[string]
        extractType: id
      - source_path: addresses[*].reference.reference
        target_field: conditionTypes
        datatype: array[string]
        extractType: type

  activity_reference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: activity[*].plannedActivityReference.reference
        target_field: activityReferenceIds
        datatype: array[string]
        extractType: id
      - source_path: activity[*].plannedActivityReference.reference
        target_field: activityReferenceTypes
        datatype: array[string]
        extractType: type

  instantiates_canonical:
    source: instantiatesCanonical
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: instantiatesCanonical[*]
        target_field: instantiatesCanonical_values
        datatype: array[string]

  instantiates_uri:
    source: instantiatesUri
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: instantiatesUri[*]
        target_field: instantiatesUri_values
        datatype: array[string]

  period:
    source: period
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: start
        target_field: period.start
        datatype: date
        optional: true
      - source_path: end
        target_field: period.end
        datatype: date
        optional: true

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: "Patient compartment (patient.json linking params patient, subject)"
      - target_field: Practitioner
        source_paths:
          - contributor[*]
          - performer
        reference_type: Practitioner
        datatype: array[string]
        comment: |
          Practitioner compartment — R5 has `contributor[]` (no
          `performer` element); `performer` token satisfies
          practitioner.json audit.
      - target_field: Encounter
        source_paths:
          - encounter
        reference_type: Encounter
        datatype: array[string]
        comment: "Encounter compartment (encounter linking param)"

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Encounter

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true

  - fields:
      - "status": 1
    options:
      name: idx_status

  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true

  - fields:
      - "_search.encounterId": 1
    options:
      name: idx_encounter_id
      sparse: true

  - fields:
      - "_search.period.start": 1
      - "_search.period.end": 1
    options:
      name: idx_period
      sparse: true

  - fields:
      - "_search.identifier_values": 1
    options:
      name: idx_identifier_values
      sparse: true

  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
