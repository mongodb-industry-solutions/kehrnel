resource: ChargeItem
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec ChargeItem)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, practitioner.json, device.json, encounter.json,
#   relatedperson.json
#
# Total parameters: 20 (18 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `code` and `subject` are required.
#   * `service[]` is CodeableReference — `service` searches `.reference`.
#   * `performer[]` backbone; `performer-actor` searches `performer.actor`,
#     `performer-function` searches `performer.function`.
#   * `occurrence[x]` splits into `occurrenceDateTime`, `occurrencePeriod`,
#     and `occurrenceTiming` (search param `occurrence` is a union).
#   * `totalPriceComponent` powers `factor-override` and `price-override`.
#   * Top-level scalar `status` queries the FHIR root.

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  account:
    type: reference
    description: "Account to place this charge"
    fields:
      - field: "_search.accountIds"
        referenceType: id
      - field: "_search.accountTypes"
        referenceType: type
      - field: "account.reference"
        referenceType: full

  encounter:
    type: reference
    description: "Encounter associated with event"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  enterer:
    type: reference
    description: "Individual who was entering"
    fields:
      - field: "_search.entererId"
        referenceType: id
      - field: "_search.entererType"
        referenceType: type
      - field: "enterer.reference"
        referenceType: full

  patient:
    type: reference
    description: "Individual service was done for/to (Patient subject)"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  performer-actor:
    type: reference
    description: "Individual who was performing"
    fields:
      - field: "_search.performerActorIds"
        referenceType: id
      - field: "_search.performerActorTypes"
        referenceType: type
      - field: "performer.actor.reference"
        referenceType: full

  performing-organization:
    type: reference
    description: "Organization providing the charged service"
    fields:
      - field: "_search.performingOrganizationId"
        referenceType: id
      - field: "_search.performingOrganizationType"
        referenceType: type
      - field: "performingOrganization.reference"
        referenceType: full

  requesting-organization:
    type: reference
    description: "Organization requesting the charged service"
    fields:
      - field: "_search.requestingOrganizationId"
        referenceType: id
      - field: "_search.requestingOrganizationType"
        referenceType: type
      - field: "requestingOrganization.reference"
        referenceType: full

  service:
    type: reference
    description: "Which rendered service is being charged"
    fields:
      - field: "_search.serviceReferenceIds"
        referenceType: id
      - field: "_search.serviceReferenceTypes"
        referenceType: type
      - field: "service.reference"
        referenceType: full

  subject:
    type: reference
    description: "Individual service was done for/to"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  code:
    type: token
    description: "A code that identifies the charge, like a billing code"
    fields:
      - field: "_search.code_systemCode"
        tokenType: systemCode
      - field: "_search.code_codes"
        tokenType: code

  identifier:
    type: token
    description: "Business identifier for item"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  performer-function:
    type: token
    description: "What type of performance was done"
    fields:
      - field: "_search.performerFunction_systemCode"
        tokenType: systemCode
      - field: "_search.performerFunction_codes"
        tokenType: code

  status:
    type: token
    description: "planned | billable | not-billable | aborted | billed | entered-in-error | unknown"
    fields:
      - field: "status"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Number Parameters
  # ─────────────────────────────────────────────────────────────
  factor-override:
    type: number
    description: "Factor overriding the associated rules"
    fields:
      - field: "_search.factorOverride_values"

  # ─────────────────────────────────────────────────────────────
  # Quantity Parameters
  # ─────────────────────────────────────────────────────────────
  price-override:
    type: quantity
    description: "Price overriding the associated rules"
    fields:
      - field: "totalPriceComponent.amount"
        quantityType: full

  quantity:
    type: quantity
    description: "Quantity of which the charge item has been serviced"
    fields:
      - field: "quantity"
        quantityType: full

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  entered-date:
    type: date
    description: "Date the charge item was entered"
    fields:
      - field: "enteredDate"
        type: date

  occurrence:
    type: date
    description: "When the charged service was applied"
    fields:
      - field: "occurrenceDateTime"
        type: date
      - field: "_search.occurrencePeriod"
        type: period

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  code:
    source: code
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: code.coding[*].code
        target_field: code_codes
        datatype: array[string]
      - source_path: code.coding[*]
        target_field: code_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  enterer:
    source: enterer
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: enterer.reference
        target_field: entererId
        datatype: string
        extractType: id
      - source_path: enterer.reference
        target_field: entererType
        datatype: string
        extractType: type

  performing_organization:
    source: performingOrganization
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: performingOrganization.reference
        target_field: performingOrganizationId
        datatype: string
        extractType: id
      - source_path: performingOrganization.reference
        target_field: performingOrganizationType
        datatype: string
        extractType: type

  requesting_organization:
    source: requestingOrganization
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: requestingOrganization.reference
        target_field: requestingOrganizationId
        datatype: string
        extractType: id
      - source_path: requestingOrganization.reference
        target_field: requestingOrganizationType
        datatype: string
        extractType: type

  account_refs:
    source: account
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: account[*].reference
        target_field: accountIds
        datatype: array[string]
        extractType: id
      - source_path: account[*].reference
        target_field: accountTypes
        datatype: array[string]
        extractType: type

  performer_actor:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: performer[*].actor.reference
        target_field: performerActorIds
        datatype: array[string]
        extractType: id
      - source_path: performer[*].actor.reference
        target_field: performerActorTypes
        datatype: array[string]
        extractType: type

  performer_function:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: performer[*].function.coding[*].code
        target_field: performerFunction_codes
        datatype: array[string]
      - source_path: performer[*].function.coding[*]
        target_field: performerFunction_systemCode
        datatype: array[string]

  service_reference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: service[*].reference.reference
        target_field: serviceReferenceIds
        datatype: array[string]
        extractType: id
      - source_path: service[*].reference.reference
        target_field: serviceReferenceTypes
        datatype: array[string]
        extractType: type

  factor_override:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: totalPriceComponent.factor
        target_field: factorOverride_values
        datatype: array[decimal]
        comment: "Powers `factor-override` number search parameter"

  occurrence_period:
    source: occurrencePeriod
    target: _search
    extractor: PeriodExtractor
    field_mappings:
      - source_path: start
        target_field: occurrencePeriod
        datatype: object
        comment: "Nested Period for `occurrence` overlap queries"

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: "Patient compartment (subject linking param)"
      - target_field: Practitioner
        source_paths:
          - enterer
          - performerActor
          - performer[*].actor
        reference_type: Practitioner
        datatype: array[string]
        comment: |
          Practitioner compartment (enterer, performer-actor linking
          params). Practitioner/* refs only.
      - target_field: Device
        source_paths:
          - enterer
          - performerActor
          - performer[*].actor
        reference_type: Device
        datatype: array[string]
        comment: "Device compartment (enterer, performer-actor linking params)"
      - target_field: Encounter
        source_paths:
          - encounter
        reference_type: Encounter
        datatype: array[string]
        comment: "Encounter compartment (encounter linking param)"

compartments:
  precomputed:
    - Patient
    - Practitioner
    - Device
    - Encounter

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Practitioner": 1
    options:
      name: idx_compartment_practitioner
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true
  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_status
  - fields:
      - "_search.patientId": 1
    options:
      name: idx_patient_id
      sparse: true
  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true
  - fields:
      - "_search.encounterId": 1
    options:
      name: idx_encounter_id
      sparse: true
  - fields:
      - "_search.entererId": 1
    options:
      name: idx_enterer_id
      sparse: true
  - fields:
      - "_search.performerActorIds": 1
    options:
      name: idx_performer_actor_ids
      sparse: true
  - fields:
      - "_search.serviceReferenceIds": 1
    options:
      name: idx_service_reference_ids
      sparse: true
  - fields:
      - "_search.code_codes": 1
    options:
      name: idx_code_codes
      sparse: true
  - fields:
      - "occurrenceDateTime": 1
    options:
      name: idx_occurrence_date_time
      sparse: true
  - fields:
      - "enteredDate": 1
    options:
      name: idx_entered_date
      sparse: true
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
