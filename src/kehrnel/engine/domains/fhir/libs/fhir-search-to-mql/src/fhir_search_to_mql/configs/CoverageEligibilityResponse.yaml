resource: CoverageEligibilityResponse
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec CoverageEligibilityResponse)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/patient.json
#
# Total parameters: 11 (9 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `request`, `patient`, `insurer` are required Reference fields.
#   * `disposition` is a searchable string scalar.
#   * Top-level scalars `status` and `outcome` query FHIR root fields.
#   * `created` is dateTime at resource root.

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  created:
    type: date
    description: "The creation date for the response"
    fields:
      - field: "created"
        type: date

  # ─────────────────────────────────────────────────────────────
  # String Parameters
  # ─────────────────────────────────────────────────────────────
  disposition:
    type: string
    description: "A description of the status of the adjudication"
    fields:
      default:
        - field: "_search.disposition_lower"
          query_type: range
      exact:
        - field: "_search.disposition"

  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  insurer:
    type: reference
    description: "The organization responsible for the response"
    fields:
      - field: "_search.insurerId"
        referenceType: id
      - field: "_search.insurerType"
        referenceType: type
      - field: "insurer.reference"
        referenceType: full

  patient:
    type: reference
    description: "The patient for whom eligibility is assessed"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "patient.reference"
        referenceType: full

  request:
    type: reference
    description: "The eligibility request this is a response to"
    fields:
      - field: "_search.requestId"
        referenceType: id
      - field: "_search.requestType"
        referenceType: type
      - field: "request.reference"
        referenceType: full

  requestor:
    type: reference
    description: "The party who submitted the original request"
    fields:
      - field: "_search.requestorId"
        referenceType: id
      - field: "_search.requestorType"
        referenceType: type
      - field: "requestor.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  identifier:
    type: token
    description: "The business identifier of the eligibility response"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  outcome:
    type: token
    description: "The outcome of the eligibility assessment"
    fields:
      - field: "outcome"
        tokenType: code

  status:
    type: token
    description: "The status of the eligibility response"
    fields:
      - field: "status"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  disposition:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: disposition
        target_field: disposition
        datatype: string
      - source_path: disposition
        target_field: disposition_lower
        datatype: string
        normalize: lowercase

  patient:
    source: patient
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: patient.reference
        target_field: patientId
        datatype: string
        extractType: id

  request:
    source: request
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: request.reference
        target_field: requestId
        datatype: string
        extractType: id
      - source_path: request.reference
        target_field: requestType
        datatype: string
        extractType: type

  insurer:
    source: insurer
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: insurer.reference
        target_field: insurerId
        datatype: string
        extractType: id
      - source_path: insurer.reference
        target_field: insurerType
        datatype: string
        extractType: type

  requestor:
    source: requestor
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: requestor.reference
        target_field: requestorId
        datatype: string
        extractType: id
      - source_path: requestor.reference
        target_field: requestorType
        datatype: string
        extractType: type

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: "Patient compartment (patient.json linking param patient)"

compartments:
  precomputed:
    - Patient

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true

  - fields:
      - "status": 1
    options:
      name: idx_status

  - fields:
      - "outcome": 1
    options:
      name: idx_outcome
      sparse: true

  - fields:
      - "_search.patientId": 1
    options:
      name: idx_patient_id
      sparse: true

  - fields:
      - "_search.requestId": 1
    options:
      name: idx_request_id
      sparse: true

  - fields:
      - "created": 1
    options:
      name: idx_created
      sparse: true

  - fields:
      - "meta.lastUpdated": 1
    options:
      name: idx_meta_last_updated
      sparse: true
