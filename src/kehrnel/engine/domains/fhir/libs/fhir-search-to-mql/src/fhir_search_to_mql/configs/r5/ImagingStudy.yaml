resource: ImagingStudy
fhir_version: R5

# Structure: schema/indexes/resources.r5.json (resource_spec ImagingStudy)
# Search params: schema/indexes/search-parameters.r5.json
# Compartments: src/fhir_search_to_mql/compartments/definitions/
#   patient.json, encounter.json, device.json
#   (practitioner.json lists `interpreter` — no R5 field/search param;
#    Practitioner compartment queries use the dynamic resolver)
#
# Total parameters: 19 (17 resource-specific per R5 index + 2 common:
# `_id`, `_lastUpdated`).
#
# R5 structural notes:
#   * `ImagingStudy.subject` is required Reference(Patient | Group |
#     Device); `patient` is the Patient/* shortcut.
#   * Series-level search params target `series[]` backbone paths.
#   * `endpoint` unions study-level and series-level endpoints.
#   * `reason` has an empty FHIRPath expression in the R5 search
#     package; denormalized from `reason[].concept` (CodeableReference).
#   * Top-level scalar `status` and `started` query the FHIR root.

search_parameters:
  # ─────────────────────────────────────────────────────────────
  # Reference Parameters
  # ─────────────────────────────────────────────────────────────
  based-on:
    type: reference
    description: "The order for the image (e.g. ServiceRequest)"
    fields:
      - field: "_search.basedOnIds"
        referenceType: id
      - field: "_search.basedOnTypes"
        referenceType: type
      - field: "basedOn.reference"
        referenceType: full

  body-structure:
    type: reference
    description: "The body structure resource associated with the study"
    fields:
      - field: "_search.bodyStructureReferenceIds"
        referenceType: id
      - field: "_search.bodyStructureReferenceTypes"
        referenceType: type

  encounter:
    type: reference
    description: "The context of the study"
    fields:
      - field: "_search.encounterId"
        referenceType: id
      - field: "encounter.reference"
        referenceType: full

  endpoint:
    type: reference
    description: "The endpoint for the study or series"
    fields:
      - field: "_search.endpointIds"
        referenceType: id
      - field: "_search.endpointTypes"
        referenceType: type

  patient:
    type: reference
    description: "Who the study is about (Patient subject)"
    fields:
      - field: "_search.patientId"
        referenceType: id
      - field: "_search.subjectId"
        referenceType: id
      - field: "subject.reference"
        referenceType: full

  performer:
    type: reference
    description: "The person or device who performed the study"
    fields:
      - field: "_search.performerIds"
        referenceType: id
      - field: "_search.performerTypes"
        referenceType: type

  referrer:
    type: reference
    description: "The referring physician"
    fields:
      - field: "_search.referrerId"
        referenceType: id
      - field: "_search.referrerType"
        referenceType: type
      - field: "referrer.reference"
        referenceType: full

  subject:
    type: reference
    description: "Who the study is about"
    fields:
      - field: "_search.subjectId"
        referenceType: id
      - field: "_search.subjectType"
        referenceType: type
      - field: "subject.reference"
        referenceType: full

  # ─────────────────────────────────────────────────────────────
  # Token Parameters
  # ─────────────────────────────────────────────────────────────
  body-site:
    type: token
    description: "The body site code studied"
    fields:
      - field: "_search.bodySite_systemCode"
        tokenType: systemCode
      - field: "_search.bodySite_codes"
        tokenType: code

  dicom-class:
    type: token
    description: "The type of the instance (SOP class)"
    fields:
      - field: "_search.dicomClass_systemCode"
        tokenType: systemCode
      - field: "_search.dicomClass_codes"
        tokenType: code

  identifier:
    type: token
    description: "Identifiers for the study (e.g. DICOM Study Instance UID)"
    fields:
      - field: "_search.identifier_systemCode"
        tokenType: systemCode
      - field: "_search.identifier_values"
        tokenType: code

  instance:
    type: token
    description: "SOP Instance UID for an instance"
    fields:
      - field: "_search.instanceUid_values"
        tokenType: code

  modality:
    type: token
    description: "The modality of the series"
    fields:
      - field: "_search.seriesModality_systemCode"
        tokenType: systemCode
      - field: "_search.seriesModality_codes"
        tokenType: code

  reason:
    type: token
    description: "The reason for the study"
    fields:
      - field: "_search.reasonConcept_systemCode"
        tokenType: systemCode
      - field: "_search.reasonConcept_codes"
        tokenType: code

  series:
    type: token
    description: "DICOM Series Instance UID for a series"
    fields:
      - field: "_search.seriesUid_values"
        tokenType: code

  status:
    type: token
    description: "registered | available | cancelled | entered-in-error | unknown"
    fields:
      - field: "status"
        tokenType: code

  # ─────────────────────────────────────────────────────────────
  # Date Parameters
  # ─────────────────────────────────────────────────────────────
  started:
    type: date
    description: "When the study was started"
    fields:
      - field: "started"
        type: date

  # ─────────────────────────────────────────────────────────────
  # Common Parameters
  # ─────────────────────────────────────────────────────────────
  _id:
    type: token
    description: "Logical id of this artifact"
    fields:
      - field: "id"
        tokenType: code

  _lastUpdated:
    type: date
    description: "When the resource version last changed"
    fields:
      - field: "meta.lastUpdated"
        type: date

denormalization:
  identifier:
    source: identifier
    target: _search
    extractor: IdentifierExtractor
    field_mappings:
      - source_path: identifier[*].value
        target_field: identifier_values
        datatype: array[string]
      - source_path: identifier[*]
        target_field: identifier_systemCode
        datatype: array[string]

  subject:
    source: subject
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: subject.reference
        target_field: subjectId
        datatype: string
        extractType: id
      - source_path: subject.reference
        target_field: subjectType
        datatype: string
        extractType: type
      - source_path: subject.reference
        target_field: patientId
        datatype: string
        extractType: id
        filterType: Patient
        comment: "Patient/* subject only — powers `patient` search parameter"

  based_on:
    source: basedOn
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: basedOn[*].reference
        target_field: basedOnIds
        datatype: array[string]
        extractType: id
      - source_path: basedOn[*].reference
        target_field: basedOnTypes
        datatype: array[string]
        extractType: type

  encounter:
    source: encounter
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: encounter.reference
        target_field: encounterId
        datatype: string
        extractType: id

  referrer:
    source: referrer
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: referrer.reference
        target_field: referrerId
        datatype: string
        extractType: id
      - source_path: referrer.reference
        target_field: referrerType
        datatype: string
        extractType: type

  endpoint:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: endpoint[*].reference|series[*].endpoint[*].reference
        target_field: endpointIds
        datatype: array[string]
        extractType: id
      - source_path: endpoint[*].reference|series[*].endpoint[*].reference
        target_field: endpointTypes
        datatype: array[string]
        extractType: type

  series_modality:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: series[*].modality.coding[*].code
        target_field: seriesModality_codes
        datatype: array[string]
      - source_path: series[*].modality.coding[*]
        target_field: seriesModality_systemCode
        datatype: array[string]

  body_site_concept:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: series[*].bodySite.concept.coding[*].code
        target_field: bodySite_codes
        datatype: array[string]
      - source_path: series[*].bodySite.concept.coding[*]
        target_field: bodySite_systemCode
        datatype: array[string]

  body_structure_reference:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: series[*].bodySite.reference.reference
        target_field: bodyStructureReferenceIds
        datatype: array[string]
        extractType: id
      - source_path: series[*].bodySite.reference.reference
        target_field: bodyStructureReferenceTypes
        datatype: array[string]
        extractType: type

  series_performer:
    source: $resource
    target: _search
    extractor: ReferenceExtractor
    field_mappings:
      - source_path: series[*].performer[*].actor.reference
        target_field: performerIds
        datatype: array[string]
        extractType: id
      - source_path: series[*].performer[*].actor.reference
        target_field: performerTypes
        datatype: array[string]
        extractType: type

  series_uid:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: series[*].uid
        target_field: seriesUid_values
        datatype: array[string]

  instance_uid:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: series[*].instance[*].uid
        target_field: instanceUid_values
        datatype: array[string]

  dicom_class:
    source: $resource
    target: _search
    extractor: DirectFieldExtractor
    field_mappings:
      - source_path: series[*].instance[*].sopClass.code
        target_field: dicomClass_codes
        datatype: array[string]
      - source_path: series[*].instance[*].sopClass.system
        target_field: dicomClass_systemCode
        datatype: array[string]

  reason_concept:
    source: $resource
    target: _search
    extractor: CodeableConceptExtractor
    field_mappings:
      - source_path: reason[*].concept.coding[*].code
        target_field: reasonConcept_codes
        datatype: array[string]
      - source_path: reason[*].concept.coding[*]
        target_field: reasonConcept_systemCode
        datatype: array[string]

  compartment_membership:
    source: $resource
    target: _compartments
    extractor: CompartmentMembershipExtractor
    field_mappings:
      - target_field: Patient
        source_paths:
          - subject
          - patient
        reference_type: Patient
        datatype: array[string]
        comment: "Patient compartment (patient.json linking params patient, subject)"
      - target_field: Encounter
        source_paths:
          - encounter
        reference_type: Encounter
        datatype: array[string]
        comment: "Encounter compartment (encounter linking param)"
      - target_field: Device
        source_paths:
          - series[*].performer[*].actor
          - performer
        reference_type: Device
        datatype: array[string]
        comment: "Device compartment (device.json linking param performer)"

compartments:
  precomputed:
    - Patient
    - Encounter
    - Device

indexes:
  - fields:
      - "_compartments.Patient": 1
    options:
      name: idx_compartment_patient
      sparse: true
  - fields:
      - "_compartments.Encounter": 1
    options:
      name: idx_compartment_encounter
      sparse: true
  - fields:
      - "_compartments.Device": 1
    options:
      name: idx_compartment_device
      sparse: true
  - fields:
      - "status": 1
    options:
      name: idx_status
  - fields:
      - "_search.subjectId": 1
    options:
      name: idx_subject_id
      sparse: true
  - fields:
      - "_search.encounterId": 1
    options:
      name: idx_encounter_id
      sparse: true
  - fields:
      - "started": 1
    options:
      name: idx_started
      sparse: true
  - fields:
      - "_search.seriesModality_codes": 1
    options:
      name: idx_series_modality_codes
      sparse: true
  - fields:
      - "_search.seriesUid_values": 1
    options:
      name: idx_series_uid_values
      sparse: true
  - fields:
      - "meta.lastUpdated": -1
    options:
      name: idx_meta_last_updated
